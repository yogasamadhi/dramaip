replicaCount: 2

# Java is the only runtime family deployed by this chart.

java:
  enabled: true
  replicaCount: 2
  migration:
    enabled: true
    useHelmHook: true
  nacosServerAddr: nacos:8848
  seataServerAddr: seata:8091
  postgresDsn: jdbc:postgresql://postgres:5432/dramaip
  jwtEnabled: "true"
  jwkSetUri: http://identity:8080/.well-known/jwks.json
  corpus:
    crawlerEnabled: "false"
    publicSearchEnabled: "false"
    personalizationEnabled: "false"
    experimentsEnabled: "false"
    maxBytes: "2097152"
    maxRedirects: "5"
    maxDepth: "2"
    minimumDomainDelayMs: "1000"
    userAgent: "DramaIP-Creative-Corpus/1.0 (+https://dramaip.example/corpus-policy)"
    encryptionKeyVersion: "v1"
  images:
    migration: { repository: ghcr.io/dramaip/dramaip-java-migration, tag: "0.1.0" }
    gateway: { repository: ghcr.io/dramaip/dramaip-java-gateway, tag: "0.1.0" }
    identity: { repository: ghcr.io/dramaip/dramaip-java-identity, tag: "0.1.0" }
    notification: { repository: ghcr.io/dramaip/dramaip-java-notification, tag: "0.1.0" }
    reporting: { repository: ghcr.io/dramaip/dramaip-java-reporting, tag: "0.1.0" }
    creation: { repository: ghcr.io/dramaip/dramaip-java-creation, tag: "0.1.0" }
    quota: { repository: ghcr.io/dramaip/dramaip-java-quota, tag: "0.1.0" }
    ai: { repository: ghcr.io/dramaip/dramaip-java-ai, tag: "0.1.0" }
    billing: { repository: ghcr.io/dramaip/dramaip-java-billing, tag: "0.1.0" }

# Applications expose Prometheus metrics and send only traces over OTLP.
# Logs remain structured stdout and are collected out-of-process by Alloy.
observability:
  enabled: false
  otlp:
    endpoint: ""
    headersSecretName: ""
    headersSecretKey: OTEL_EXPORTER_OTLP_HEADERS
  traces:
    sampler: always_on
    # Required for ratio-based samplers such as parentbased_traceidratio.
    # Leave empty for samplers that do not accept an argument.
    samplerArg: ""
  prometheus:
    scrape: true
  # Production rules are evaluated by the operator-managed Prometheus and
  # delivered by its Alertmanager. The release launcher enables this contract
  # only for non-temporary environments and supplies notificationRoute.
  alerting:
    enabled: false
    notificationRoute: ""
    prometheusRule:
      labels:
        observability.dramaip.io/rule-set: platform
  embedded:
    enabled: false
    retention: 720h
    terminationGracePeriodSeconds: 60
    networkPolicy:
      enabled: true
    grafana:
      # When empty, the chart creates and preserves a random admin password in
      # <release>-dramaip-platform-grafana-admin. Production-like environments
      # may instead provide an operator-managed Secret with these two keys.
      existingAdminSecret: ""
      adminUserKey: admin-user
      adminPasswordKey: admin-password
    images:
      prometheus: prom/prometheus:v3.11.3
      alloy: grafana/alloy:v1.19.2
      loki: grafana/loki:3.7.3
      tempo: grafana/tempo:3.0.2
      grafana: grafana/grafana:12.3.8
    storage:
      prometheus: 5Gi
      alloy: 1Gi
      loki: 10Gi
      tempo: 10Gi
      grafana: 1Gi
    resources:
      prometheus:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { cpu: 500m, memory: 512Mi }
      alloy:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { cpu: 500m, memory: 512Mi }
      loki:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { cpu: "1", memory: 1Gi }
      tempo:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { cpu: "1", memory: 1Gi }
      grafana:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { cpu: 500m, memory: 512Mi }

# The browser-facing Next.js UI is deliberately separate from the Java Gateway.
# When both are routed through the same Gateway host, leave apiBaseURL empty
# so the emitted browser bundle calls relative /api/v1 endpoints on that origin.
web:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/dramaip/dramaip-web
    tag: "0.1.0"
  port: 3000
  apiBaseURL: ""
  paymentMode: simulated

image:
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
rolloutToken: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

ingress:
  enabled: false
  className: kong
  annotations: {}
  hosts:
    - host: api.example.com
      paths:
        - path: /api/v1
          pathType: Prefix
  tls: []

# Payment providers are off unless an operator supplies their dedicated
# credentials Secret. Provider secrets are mounted only in billing-service.
payment:
  simulatedEnabled: "false"
  wechat:
    enabled: false
    appID: ""
    mchID: ""
    merchantCertificateSerial: ""
    platformCertificateSerial: ""
    notifyURL: ""
    apiBaseURL: https://api.mch.weixin.qq.com
    credentialsSecret: ""
    apiV3KeyKey: api-v3-key
    merchantPrivateKeyKey: apiclient-key.pem
    platformCertificateKey: platform-cert.pem
    webhookRateLimitPerMinute: 600

  alipay:
    enabled: false
    appID: ""
    sellerID: ""
    notifyURL: ""
    gateway: https://openapi.alipay.com/gateway.do
    credentialsSecret: ""
    merchantPrivateKeyKey: app-private-key.pem
    alipayPublicKeyKey: alipay-public-key.pem
    webhookRateLimitPerMinute: 600

review:
  objectStore:
    endpoint: ""
    region: us-east-1
    bucket: ""
    allowInsecure: false
    # Required for a releasable Studio deployment. The Secret contains only
    # the dedicated private-bucket access key and secret key.
    credentialsSecret: ""
    accessKeyKey: REVIEW_S3_ACCESS_KEY
    secretKeyKey: REVIEW_S3_SECRET_KEY

kong:
  plugins:
    enabled: true
    cors:
      enabled: true
      origins:
        # Required override for the deployed Web origin. Never combine wildcard
        # origin with credentials.
        - https://app.example.com
      methods:
        - GET
        - POST
        - PATCH
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - Idempotency-Key
        - X-CSRF-Token
        - X-Device-Id
        - X-Request-Id
        - traceparent
        - tracestate
      exposedHeaders:
        - Content-Type
        - Idempotency-Key
      credentials: true
      maxAge: 3600
    rateLimiting:
      enabled: true
      minute: 120
      policy: local

# Sized to match the Dockerfile default (-XX:MaxRAMPercentage=50): the 768Mi
# limit yields a ~384Mi heap, and the 384Mi request covers Spring Boot startup
# so pods are not OOM-killed or throttled while warming up. Override per
# environment in values-*.yaml when a profile needs more headroom.
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 768Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity: {}

devInfra:
  enabled: false
  persistence:
    enabled: false
    hostPathBase: ""
  postgres:
    image: postgres:18-alpine
    storage: 1Gi
  redis:
    image: redis:8-alpine
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    clientImage: minio/mc:RELEASE.2025-04-16T18-13-26Z
    storage: 10Gi

secret:
  existingSecret: ""
  # DDL-only identity used by the Java migration Job.
  postgresUser: dramaip
  postgresPassword: change-me
  postgresIdentitySvcPassword: change-me
  postgresNotificationSvcPassword: change-me
  postgresReportingSvcPassword: change-me
  postgresCreationSvcPassword: change-me
  postgresQuotaSvcPassword: change-me
  postgresAiSvcPassword: change-me
  postgresBillingSvcPassword: change-me
  internalToken: change-me-internal
  # Required before enabling corpus crawling or publishing signed snapshots.
  corpusEncryptionKeyBase64: ""
  corpusSnapshotPrivateKeyPem: ""
  reviewS3AccessKey: change-me
  reviewS3SecretKey: change-me
  redisPassword: change-me
  rabbitmqUser: dramaip
  rabbitmqPassword: change-me

migrations:
  # Requires the migration identity to have CREATEROLE. Set false after all
  # Java runtime roles have been pre-provisioned by the database operator.
  bootstrapRuntimeRoles: true
  serviceAccountName: ""
  backoffLimit: 2

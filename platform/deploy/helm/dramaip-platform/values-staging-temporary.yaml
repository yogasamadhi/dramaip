# This overlay is intentionally usable only through helm-release.sh with both
# DRAMAIP_TEMPORARY_STAGING_INFRA=1 and DRAMAIP_TEMPORARY_STAGING_AUTHORIZED=1.
# It never changes normal staging or production. All data is emptyDir-backed
# and is discarded with the dedicated staging namespace.
replicaCount: 1

image:
  pullPolicy: IfNotPresent

web:
  enabled: true
  replicaCount: 1
  # The image is built with an empty public API base URL, which makes browser
  # requests use this same temporary Gateway origin.
  apiBaseURL: ""
  paymentMode: simulated

nodeSelector:
  node-role.kubernetes.io/worker: worker

devInfra:
  enabled: true
  persistence:
    enabled: false
  # The temporary operator network reaches this reviewed mirror while direct
  # Docker Hub is unavailable. Normal dev/staging values keep their defaults.
  postgres:
    image: docker.m.daocloud.io/library/postgres:18-alpine
  redis:
    image: docker.m.daocloud.io/library/redis:8-alpine
  rabbitmq:
    image: docker.m.daocloud.io/library/rabbitmq:4.3-management-alpine

observability:
  enabled: true
  embedded:
    enabled: true
    images:
      prometheus: docker.m.daocloud.io/prom/prometheus:v3.11.3
      alloy: docker.m.daocloud.io/grafana/alloy:v1.19.2
      loki: docker.m.daocloud.io/grafana/loki:3.7.3
      tempo: docker.m.daocloud.io/grafana/tempo:3.0.2
      grafana: docker.m.daocloud.io/grafana/grafana:12.3.8

review:
  objectStore:
    endpoint: http://minio:9000
    region: us-east-1
    bucket: dramaip-review
    credentialsSecret: ""

java:
  migration:
    # The temporary dependency deployments are created by this chart, so a
  # pre-install hook would run before PostgreSQL exists. Keep the migration as
  # a normal Job on first install and let Helm wait for it with
  # --wait-for-jobs. Later upgrades use a pre-upgrade hook so Kubernetes never
  # has to patch the immutable Pod template of the completed install Job.
    enabled: true
    useHelmHook: false

migrations:
  # Allow a fresh PostgreSQL image pull and readiness probe before declaring a
  # migration failure; this overlay remains bounded by Helm's release timeout.
  backoffLimit: 6
  bootstrapRuntimeRoles: true

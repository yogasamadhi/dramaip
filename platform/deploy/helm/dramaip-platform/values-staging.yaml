# Staging deliberately has no inline credentials. The release operator must
# create the required named Secrets from the approved secret manager before Helm is
# allowed to install this values file.
replicaCount: 1

imagePullSecrets:
  - name: dramaip-staging-registry

java:
  migration:
    enabled: true
    useHelmHook: true
  images:
    migration: { repository: registry.example.invalid/dramaip/java-migration, tag: candidate }
    gateway: { repository: registry.example.invalid/dramaip/java-gateway, tag: candidate }
    identity: { repository: registry.example.invalid/dramaip/java-identity, tag: candidate }
    notification: { repository: registry.example.invalid/dramaip/java-notification, tag: candidate }
    reporting: { repository: registry.example.invalid/dramaip/java-reporting, tag: candidate }
    creation: { repository: registry.example.invalid/dramaip/java-creation, tag: candidate }
    quota: { repository: registry.example.invalid/dramaip/java-quota, tag: candidate }
    ai: { repository: registry.example.invalid/dramaip/java-ai, tag: candidate }
    billing: { repository: registry.example.invalid/dramaip/java-billing, tag: candidate }

config:
  env: staging
  logLevel: info
  postgres:
    host: postgres.staging.internal
    sslmode: require
  redis:
    addr: redis.staging.internal:6379
  rabbitmq:
    host: rabbitmq.staging.internal
    port: "5671"
    vhost: /dramaip
  otel:
    endpoint: https://otel-collector.staging.internal:4318

secret:
  existingSecret: dramaip-staging-runtime

review:
  objectStore:
    endpoint: https://review-objects.staging.example.invalid
    region: us-east-1
    bucket: dramaip-review-staging
    credentialsSecret: dramaip-staging-review-object-store

ingress:
  enabled: true
  className: kong
  hosts:
    - host: api.staging.example.invalid
      paths:
        - path: /v1
          pathType: Prefix
  tls:
    - secretName: dramaip-staging-ingress-tls
      hosts:
        - api.staging.example.invalid

kong:
  plugins:
    cors:
      origins:
        - https://app.staging.example.invalid

migrations:
  bootstrapRuntimeRoles: false

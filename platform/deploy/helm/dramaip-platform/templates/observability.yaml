apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-grafana
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: observability-grafana
spec:
  type: ClusterIP
  ports: [{ name: http, port: 3000, targetPort: http }]
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: observability-grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-grafana
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: observability-grafana
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: observability-grafana }
  template:
    metadata:
      annotations:
        checksum/observability-config: {{ $configChecksum }}
        checksum/grafana-dashboard: {{ $dashboardChecksum }}
      labels:
        app.kubernetes.io/name: {{ include "dramaip-platform.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: observability-grafana
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.observability.embedded.terminationGracePeriodSeconds }}
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch }
      {{- include "dramaip-platform.observabilityDataPermissions" . | nindent 6 }}
      {{- include "dramaip-platform.observabilityScheduling" . | nindent 6 }}
      containers:
        - name: grafana
          image: {{ .Values.observability.embedded.images.grafana | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $grafanaAdminSecret | quote }}
                  key: {{ .Values.observability.embedded.grafana.adminUserKey | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $grafanaAdminSecret | quote }}
                  key: {{ .Values.observability.embedded.grafana.adminPasswordKey | quote }}
          ports: [{ name: http, containerPort: 3000 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          startupProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 2, failureThreshold: 45 }
          readinessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 10, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 20, failureThreshold: 3 }
          resources:
            {{- toYaml .Values.observability.embedded.resources.grafana | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/grafana/provisioning/datasources/dramaip.yml, subPath: datasources.yml, readOnly: true }
            - { name: config, mountPath: /etc/grafana/provisioning/dashboards/dramaip.yml, subPath: dashboard-provider.yml, readOnly: true }
            - { name: dashboard, mountPath: /var/lib/grafana/dashboards, readOnly: true }
            - { name: data, mountPath: /var/lib/grafana }
      volumes:
        - { name: config, configMap: { name: {{ $fullname }}-observability } }
        - { name: dashboard, configMap: { name: {{ $fullname }}-grafana-dashboard } }
        - name: data
          {{- if $persistent }}
          hostPath: { path: {{ printf "%s/observability/grafana" $hostPathBase | quote }}, type: DirectoryOrCreate }
          {{- else }}
          emptyDir: { sizeLimit: {{ .Values.observability.embedded.storage.grafana | quote }} }
          {{- end }}
{{- end }}

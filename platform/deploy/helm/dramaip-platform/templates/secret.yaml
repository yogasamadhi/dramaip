{{- if not .Values.secret.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dramaip-platform.secretName" . }}
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secret.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secret.postgresPassword | quote }}
  POSTGRES_IDENTITY_SVC_PASSWORD: {{ .Values.secret.postgresIdentitySvcPassword | quote }}
  POSTGRES_NOTIFICATION_SVC_PASSWORD: {{ .Values.secret.postgresNotificationSvcPassword | quote }}
  POSTGRES_REPORTING_SVC_PASSWORD: {{ .Values.secret.postgresReportingSvcPassword | quote }}
  POSTGRES_CREATION_SVC_PASSWORD: {{ .Values.secret.postgresCreationSvcPassword | quote }}
  POSTGRES_QUOTA_SVC_PASSWORD: {{ .Values.secret.postgresQuotaSvcPassword | quote }}
  POSTGRES_AI_SVC_PASSWORD: {{ .Values.secret.postgresAiSvcPassword | quote }}
  POSTGRES_BILLING_SVC_PASSWORD: {{ .Values.secret.postgresBillingSvcPassword | quote }}
  DRAMAIP_INTERNAL_TOKEN: {{ .Values.secret.internalToken | quote }}
  CORPUS_ENCRYPTION_KEY_BASE64: {{ .Values.secret.corpusEncryptionKeyBase64 | quote }}
  CORPUS_SNAPSHOT_PRIVATE_KEY_PEM: {{ .Values.secret.corpusSnapshotPrivateKeyPem | quote }}
  REVIEW_S3_ACCESS_KEY: {{ .Values.secret.reviewS3AccessKey | quote }}
  REVIEW_S3_SECRET_KEY: {{ .Values.secret.reviewS3SecretKey | quote }}
  REDIS_PASSWORD: {{ .Values.secret.redisPassword | quote }}
  RABBITMQ_USER: {{ .Values.secret.rabbitmqUser | quote }}
  RABBITMQ_PASSWORD: {{ .Values.secret.rabbitmqPassword | quote }}
{{- end }}

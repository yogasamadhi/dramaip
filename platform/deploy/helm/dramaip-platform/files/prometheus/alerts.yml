groups:
  - name: dramaip-platform-reliability
    rules:
      - alert: DramaipTargetDown
        expr: up{job=~"java-gateway|java-services|rabbitmq|alloy|loki|tempo"} == 0
        for: 2m
        labels:
          severity: critical
          area: platform
        annotations:
          summary: "DramaIP scrape target is down"
          runbook: "docs/OBSERVABILITY.md#target-down"

      - alert: DramaipHighRequestErrorRate
        expr: (sum by (service) (rate(dramaip_requests_total{outcome="error"}[5m])) / sum by (service) (rate(dramaip_requests_total[5m]))) > 0.05 and sum by (service) (rate(dramaip_requests_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          area: api
        annotations:
          summary: "DramaIP request error rate exceeds 5%"
          runbook: "docs/OBSERVABILITY.md#request-error-rate"

      - alert: DramaipPaymentConfirmationFailed
        expr: increase(dramaip_business_events_total{event="payment_confirmation",outcome="failed"}[10m]) > 0
        for: 1m
        labels:
          severity: critical
          area: billing
        annotations:
          summary: "A payment confirmation failed"
          runbook: "docs/OBSERVABILITY.md#payment-confirmation"

      - alert: DramaipQuotaRejectionsHigh
        expr: increase(dramaip_quota_reservations_total{outcome="rejected"}[10m]) > 20
        for: 5m
        labels:
          severity: warning
          area: quota
        annotations:
          summary: "Quota reservation rejections are elevated"
          runbook: "docs/OBSERVABILITY.md#quota-rejections"

      - alert: DramaipOutboxBacklog
        expr: dramaip_outbox_pending_events > 100
        for: 5m
        labels:
          severity: critical
          area: messaging
        annotations:
          summary: "Billing outbox backlog exceeds 100 events"
          runbook: "docs/OBSERVABILITY.md#outbox-backlog"

      - alert: DramaipRabbitMQQueueBacklog
        expr: rabbitmq_queue_messages_ready > 1000
        for: 5m
        labels:
          severity: warning
          area: messaging
        annotations:
          summary: "RabbitMQ ready-message backlog exceeds 1000"
          runbook: "docs/OBSERVABILITY.md#rabbitmq-backlog"

      - alert: DramaipDatabasePoolSaturated
        expr: (sum by (service) (dramaip_db_connections{state="in_use"}) / sum by (service) (dramaip_db_max_open_connections)) > 0.8 and on (service) sum by (service) (dramaip_db_max_open_connections) > 0
        for: 5m
        labels:
          severity: warning
          area: database
        annotations:
          summary: "DramaIP database pool utilization exceeds 80%"
          runbook: "docs/OBSERVABILITY.md#database-pool"

      - alert: DramaipProviderFailureRate
        expr: (sum by (service, provider) (rate(dramaip_provider_requests_total{outcome="failed"}[5m])) / sum by (service, provider) (rate(dramaip_provider_requests_total[5m]))) > 0.1 and sum by (service, provider) (rate(dramaip_provider_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          area: ai
        annotations:
          summary: "AI Provider failure rate exceeds 10%"
          runbook: "docs/OBSERVABILITY.md#provider-failure"

      - alert: DramaipProviderLatencyHigh
        expr: (sum by (service, provider) (rate(dramaip_provider_request_duration_seconds_sum[5m])) / sum by (service, provider) (rate(dramaip_provider_request_duration_seconds_count[5m]))) > 15
        for: 5m
        labels:
          severity: warning
          area: ai
        annotations:
          summary: "AI Provider average request latency exceeds 15 seconds"
          runbook: "docs/OBSERVABILITY.md#provider-latency"

      - alert: DramaipProviderCostAlert
        expr: increase(dramaip_provider_cost_alerts_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
          area: finops
        annotations:
          summary: "AI Provider cost guard emitted an alert"
          runbook: "docs/OBSERVABILITY.md#provider-cost"

      - alert: DramaipErrorAggregationHigh
        expr: sum by (service, class) (increase(dramaip_errors_total[10m])) > 10
        for: 5m
        labels:
          severity: warning
          area: errors
        annotations:
          summary: "Aggregated DramaIP errors exceed threshold"
          runbook: "docs/OBSERVABILITY.md#error-aggregation"

  - name: dramaip-observability-pipeline
    rules:
      - alert: DramaipAlloyTraceExportFailures
        expr: sum(increase(otelcol_exporter_send_failed_spans_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
          area: observability
        annotations:
          summary: "Alloy failed to export traces to Tempo"
          runbook: "docs/OBSERVABILITY.md#alloy-trace-export-failures"

      - alert: DramaipAlloyTraceQueueSaturated
        expr: sum(otelcol_exporter_queue_size) / clamp_min(sum(otelcol_exporter_queue_capacity), 1) > 0.8
        for: 5m
        labels:
          severity: warning
          area: observability
        annotations:
          summary: "Alloy trace exporter queue exceeds 80% capacity"
          runbook: "docs/OBSERVABILITY.md#alloy-trace-queue"

      - alert: DramaipAlloyLogWriteDrops
        expr: sum(increase(loki_write_dropped_entries_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
          area: observability
        annotations:
          summary: "Alloy permanently dropped log entries"
          runbook: "docs/OBSERVABILITY.md#alloy-log-write-drops"

      - alert: DramaipAlloyLogWriteRetriesHigh
        expr: sum(increase(loki_write_batch_retries_total[5m])) > 10
        for: 2m
        labels:
          severity: warning
          area: observability
        annotations:
          summary: "Alloy is repeatedly retrying Loki writes"
          runbook: "docs/OBSERVABILITY.md#alloy-log-write-retries"

      - alert: DramaipSensitiveLogRejected
        expr: sum by (reason) (increase(loki_process_dropped_lines_total{reason="sensitive_content"}[5m])) > 0
        for: 1m
        labels:
          severity: warning
          area: security
        annotations:
          summary: "Alloy rejected a log entry containing sensitive content"
          runbook: "docs/OBSERVABILITY.md#sensitive-log-rejected"

      - alert: DramaipLokiDiscardingLogs
        expr: sum by (reason) (increase(loki_discarded_samples_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
          area: observability
        annotations:
          summary: "Loki discarded incoming log entries"
          runbook: "docs/OBSERVABILITY.md#loki-discards"

      - alert: DramaipLokiWalCorruption
        expr: sum(increase(loki_ingester_wal_corruptions_total[10m])) > 0
        for: 1m
        labels:
          severity: critical
          area: observability
        annotations:
          summary: "Loki detected WAL corruption"
          runbook: "docs/OBSERVABILITY.md#loki-wal-corruption"

      - alert: DramaipLokiWalDiskPressure
        expr: max(loki_ingester_wal_disk_usage_percent) > 0.9
        for: 5m
        labels:
          severity: warning
          area: observability
        annotations:
          summary: "Loki WAL filesystem usage exceeds 90%"
          runbook: "docs/OBSERVABILITY.md#loki-wal-disk-pressure"

      - alert: DramaipLokiWalWriteFailures
        expr: sum(increase(loki_ingester_wal_disk_full_failures_total[10m])) > 0
        for: 1m
        labels:
          severity: critical
          area: observability
        annotations:
          summary: "Loki rejected or failed WAL writes because the disk is full"
          runbook: "docs/OBSERVABILITY.md#loki-wal-write-failures"

      - alert: DramaipTempoDiscardingSpans
        expr: sum by (reason) (increase(tempo_discarded_spans_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
          area: observability
        annotations:
          summary: "Tempo discarded incoming spans"
          runbook: "docs/OBSERVABILITY.md#tempo-discards"

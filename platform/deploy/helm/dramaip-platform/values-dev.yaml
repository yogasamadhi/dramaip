replicaCount: 1

image:
  pullPolicy: IfNotPresent

java:
  replicaCount: 1
  images:
    migration: { repository: dramaip-java-migration, tag: dev }
    gateway: { repository: dramaip-java-gateway, tag: dev }
    identity: { repository: dramaip-java-identity, tag: dev }
    notification: { repository: dramaip-java-notification, tag: dev }
    reporting: { repository: dramaip-java-reporting, tag: dev }
    creation: { repository: dramaip-java-creation, tag: dev }
    quota: { repository: dramaip-java-quota, tag: dev }
    ai: { repository: dramaip-java-ai, tag: dev }
    billing: { repository: dramaip-java-billing, tag: dev }

observability:
  enabled: true
  embedded:
    enabled: true

review:
  objectStore:
    allowInsecure: true
    endpoint: http://minio:9000
    region: us-east-1
    bucket: dramaip-review
    credentialsSecret: ""

devInfra:
  enabled: true
  persistence:
    enabled: true
    hostPathBase: ""

secret:
  postgresUser: dramaip
  postgresPassword: dramaip
  postgresIdentitySvcPassword: dramaip
  postgresNotificationSvcPassword: dramaip
  postgresReportingSvcPassword: dramaip
  postgresCreationSvcPassword: dramaip
  postgresQuotaSvcPassword: dramaip
  postgresAiSvcPassword: dramaip
  postgresBillingSvcPassword: dramaip
  internalToken: change-me-internal
  reviewS3AccessKey: dramaip-review
  reviewS3SecretKey: dramaip-review-development-secret
  redisPassword: dramaip
  rabbitmqUser: dramaip
  rabbitmqPassword: dramaip

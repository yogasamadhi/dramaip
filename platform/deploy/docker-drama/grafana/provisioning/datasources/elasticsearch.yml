# Grafana provisioning: query local Elasticsearch logs alongside Prometheus.
apiVersion: 1

datasources:
  - name: Elasticsearch
    uid: elasticsearch
    # Increment when provisioning changes, so an existing Grafana volume is
    # upgraded instead of retaining the previous datasource definition.
    version: 2
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    isDefault: false
    editable: true
    jsonData:
      # Grafana's Elasticsearch Logs query requires an explicit date pattern
      # for daily indices; a wildcard is not a valid time-index expression.
      index: "[dramaip-logs-java-]YYYY.MM.DD"
      interval: Daily
      timeField: "@timestamp"
      logMessageField: message
      version: "9.4.2"

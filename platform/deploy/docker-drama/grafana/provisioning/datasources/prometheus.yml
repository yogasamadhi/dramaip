# Grafana 数据源自动 provisioning：容器启动即接入 Prometheus，无需手动加。
apiVersion: 1

datasources:
  # This separate UID coexists with historic developer volumes that contain a
  # pre-Java datasource named "Prometheus".
  - name: DramaIP Prometheus
    uid: dramaip-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

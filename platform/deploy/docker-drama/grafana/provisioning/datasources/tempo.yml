apiVersion: 1

datasources:
  - name: DramaIP Tempo
    uid: dramaip-tempo
    version: 1
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: dramaip-loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service_name
        filterByTraceID: true
        filterBySpanID: false
        customQuery: false
      tracesToMetrics:
        datasourceUid: dramaip-prometheus
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service
        queries:
          - name: Request rate
            query: 'sum(rate(dramaip_requests_total{$__tags}[5m]))'
          - name: Error rate
            query: 'sum(rate(dramaip_requests_total{$__tags,outcome="error"}[5m]))'
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m

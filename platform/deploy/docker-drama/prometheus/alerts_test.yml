rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'dramaip_business_events_total{service="billing",event="payment_confirmation",outcome="failed"}'
        values: '0 1 1 1'
      - series: 'dramaip_outbox_pending_events{service="billing"}'
        values: '101 101 101 101 101 101 101'
      - series: 'dramaip_provider_request_duration_seconds_sum{service="ai",provider="test"}'
        values: '0 16 32 48 64 80 96'
      - series: 'dramaip_provider_request_duration_seconds_count{service="ai",provider="test"}'
        values: '0 1 2 3 4 5 6'
      - series: 'dramaip_provider_cost_alerts_total{service="ai",event="high_request_cost"}'
        values: '0 1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: DramaipPaymentConfirmationFailed
        exp_alerts:
          - exp_labels:
              area: billing
              event: payment_confirmation
              outcome: failed
              service: billing
              severity: critical
            exp_annotations:
              summary: A payment confirmation failed
              runbook: docs/OBSERVABILITY.md#payment-confirmation
      - eval_time: 6m
        alertname: DramaipOutboxBacklog
        exp_alerts:
          - exp_labels:
              area: messaging
              service: billing
              severity: critical
            exp_annotations:
              summary: Billing outbox backlog exceeds 100 events
              runbook: docs/OBSERVABILITY.md#outbox-backlog
      - eval_time: 6m
        alertname: DramaipProviderLatencyHigh
        exp_alerts:
          - exp_labels:
              area: ai
              provider: test
              service: ai
              severity: warning
            exp_annotations:
              summary: AI Provider average request latency exceeds 15 seconds
              runbook: docs/OBSERVABILITY.md#provider-latency
      - eval_time: 2m
        alertname: DramaipProviderCostAlert
        exp_alerts:
          - exp_labels:
              area: finops
              event: high_request_cost
              service: ai
              severity: warning
            exp_annotations:
              summary: AI Provider cost guard emitted an alert
              runbook: docs/OBSERVABILITY.md#provider-cost

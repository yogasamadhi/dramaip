# Prometheus 抓取配置（对应 docs/后端技术架构.md 指标支柱）。
# 容器在 compose 默认网络内，可用 service name 互访；

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: java-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "java-gateway:8080"

  - job_name: java-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "identity:8080"
          - "java-notification:8080"
          - "java-reporting:8080"
          - "creation:8080"
          - "java-quota:8080"
          - "ai:8080"
          - "java-billing:8080"

  # RabbitMQ 4.x management 镜像自带 rabbitmq_prometheus exporter（端口 15692）。
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

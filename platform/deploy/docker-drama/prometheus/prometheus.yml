# Prometheus 抓取配置（对应 docs/后端技术架构.md 指标支柱）。
# 容器在 compose 默认网络内，可用 service name 互访；

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: java-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "java-gateway:8080"

  - job_name: java-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "identity:8080"
          - "java-notification:8080"
          - "java-reporting:8080"
          - "creation:8080"
          - "java-quota:8080"
          - "ai:8080"
          - "java-billing:8080"

  # RabbitMQ 4.x management 镜像自带 rabbitmq_prometheus exporter（端口 15692）。
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Jaeger v2 自身指标（badger 配置在 8888 暴露 /metrics）。
  - job_name: jaeger
    static_configs:
      - targets: ["jaeger:8888"]

  # OpenTelemetry Collector 自身指标。
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # 服务通过 OTLP 推到 Collector 的 metrics，由 Collector 转成 Prometheus 格式供抓取。
  - job_name: otel-collector-otlp-metrics
    static_configs:
      - targets: ["otel-collector:8889"]

# Java 本地开发编排：基础设施、数据库迁移、Gateway 与七个 Java 领域服务。
services:
  postgres:
    profiles: [java]
    image: postgres:18-alpine
    pull_policy: missing
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dramaip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dramaip}
      POSTGRES_DB: ${POSTGRES_DB:-dramaip}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ${DRAMAIP_COMPOSE_DATA_ROOT:-./docker-data}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    profiles: [java]
    image: redis:8-alpine
    pull_policy: missing
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ${DRAMAIP_COMPOSE_DATA_ROOT:-./docker-data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    profiles: [java]
    image: rabbitmq:4.3-management-alpine
    pull_policy: missing
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dramaip}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dramaip}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - ${DRAMAIP_COMPOSE_DATA_ROOT:-./docker-data}/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      # rabbitmqctl status 在 management 镜像里可用且较轻。
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 6s
      retries: 12

  minio:
    profiles: [java]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: missing
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${REVIEW_S3_ACCESS_KEY:-dramaip-review}
      MINIO_ROOT_PASSWORD: ${REVIEW_S3_SECRET_KEY:-dramaip-review-development-secret}
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - ${DRAMAIP_COMPOSE_DATA_ROOT:-./docker-data}/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    profiles: [java]
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set review http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        mc mb --ignore-existing review/dramaip-review;
        mc anonymous set none review/dramaip-review;
        mc ilm rule rm --all --force review/dramaip-review || true;
        mc ilm rule add --expire-days 30 review/dramaip-review
    environment:
      MINIO_ROOT_USER: ${REVIEW_S3_ACCESS_KEY:-dramaip-review}
      MINIO_ROOT_PASSWORD: ${REVIEW_S3_SECRET_KEY:-dramaip-review-development-secret}

  # ─────────────────── 可观测性 ───────────────────
  # 三大支柱：metrics 由 Prometheus 拉取，traces 经 Alloy 写入 Tempo，
  # logs 由 Alloy 从 Docker API 或宿主机 NDJSON 文件采集并写入 Loki。
  # 书写顺序≠启动顺序（启动由 depends_on 拓扑决定），这里按「排查优先级」排——
  # 接到告警后的典型动线：指标发现问题 → 链路定位服务 → 日志深挖到行。
  # 故顺序为 指标(Prometheus) → 采集(Alloy) → 日志(Loki) / 链路(Tempo)
  # → 可视化前端(Grafana) 收尾。

  # ────── 指标 (Metrics)：拉模型抓取 + TSDB 存储（告警/排障第一站）──────
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.11.3
    pull_policy: missing
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ${DRAMAIP_PROMETHEUS_CONFIG:-./prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${DRAMAIP_COMPOSE_DATA_ROOT:-./docker-data}/prometheus:/prometheus
      - ${DRAMAIP_PROMETHEUS_TARGETS_DIR:-../../server/target/local-dev/prometheus-targets}:/etc/prometheus/host-targets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d

  # ────── 采集与转发：OTLP traces + Docker/宿主机 logs ──────
  alloy:
    profiles: [observability]
    image: grafana/alloy:v1.19.2
    pull_policy: missing
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:${ALLOY_HOST_PORT:-12345}:12345"
      - "127.0.0.1:${ALLOY_OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "127.0.0.1:${ALLOY_OTLP_HTTP_HOST_PORT:-4318}:4318"
    environment:
      DRAMAIP_HOST_LOG_GLOB: /var/log/dramaip/*.log
      DRAMAIP_COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-docker-drama}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DRAMAIP_HOST_LOG_DIR:-../../server/target/local-dev}:/var/log/dramaip:ro
      - ${DRAMAIP_COMPOSE_DATA_ROOT:-./docker-data}/alloy:/var/lib/alloy/data
    depends_on:
      - loki
      - tempo

  # ────── 日志：单机 TSDB + filesystem，保留 30 天 ──────
  loki:
    profiles: [observability]
    image: grafana/loki:3.7.3
    pull_policy: missing
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "127.0.0.1:${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - ${DRAMAIP_COMPOSE_DATA_ROOT:-./docker-data}/loki:/var/lib/loki

  # ────── 链路追踪：单机 filesystem/WAL，保留 30 天 ──────
  tempo:
    profiles: [observability]
    image: grafana/tempo:3.0.2
    pull_policy: missing
    command: ["-target=all", "-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro
      - ${DRAMAIP_COMPOSE_DATA_ROOT:-./docker-data}/tempo:/var/lib/tempo
      - ${DRAMAIP_COMPOSE_DATA_ROOT:-./docker-data}/tempo:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_HOST_PORT:-3200}:3200"

  # ────── 可视化前端：统一接入 Prometheus、Loki、Tempo ──────
  grafana:
    profiles: [observability]
    image: grafana/grafana:12.3.8
    pull_policy: missing
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-dramaip}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dramaip}
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${DRAMAIP_COMPOSE_DATA_ROOT:-./docker-data}/grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

  # End-to-end gate only. A clean witness followed by a synthetic sensitive
  # record lets the smoke test prove both Docker discovery and whole-entry
  # filtering for the configured sensitive-field denylist. This service is
  # never started by the normal observability profile and contains no real
  # credential or user data.
  observability-canary:
    profiles: [observability-test]
    image: node:24.18.0-alpine
    pull_policy: missing
    init: true
    read_only: true
    command: ["node", "/app/observability-log-canary.mjs"]
    environment:
      DRAMAIP_OBSERVABILITY_CANARY: ${DRAMAIP_OBSERVABILITY_CANARY:-dramaip-observability-synthetic-canary}
      DRAMAIP_OBSERVABILITY_WITNESS: ${DRAMAIP_OBSERVABILITY_WITNESS:-dramaip-observability-log-pipeline-witness}
    volumes:
      - ../../scripts/observability-log-canary.mjs:/app/observability-log-canary.mjs:ro
    depends_on:
      alloy:
        condition: service_started

  # ─────────────────── Java 服务端 ───────────────────
  # 镜像未指定 platform，Docker Desktop 会为 Windows/amd64、macOS/arm64
  # 选择宿主机对应的多架构基础镜像；Java 服务本身从本地源码构建。
  # 仅阻塞式 E2E 启用。它不会进入普通 java profile，也不应配置到生产。
  mock-ai:
    profiles: [e2e]
    image: node:24.18.0-alpine
    pull_policy: missing
    command: ["node", "/app/mock-ai-provider.mjs"]
    volumes:
      - ../../scripts/mock-ai-provider.mjs:/app/mock-ai-provider.mjs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8099/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20

  # E2E 专用公开地址模拟源。使用独立的公网形态测试网段验证真实 SSRF
  # 规则；不替换 DNS 解析器，也不放宽生产采集器。
  mock-corpus:
    profiles: [e2e]
    image: node:24.18.0-alpine
    pull_policy: missing
    command: ["node", "/app/mock-corpus-source.mjs"]
    volumes:
      - ../../scripts/mock-corpus-source.mjs:/app/mock-corpus-source.mjs:ro
    networks:
      corpus-e2e:
        ipv4_address: 93.184.216.34
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20

  # 从与运行中 Nacos 相同的镜像导出官方建表脚本。这样不需要在仓库中
  # 复制一份会随 Nacos 版本漂移的 SQL；MySQL 仅在空数据目录初始化时执行它。
  nacos-mysql-schema:
    profiles: [java]
    image: nacos/nacos-server:v3.1.1
    pull_policy: missing
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    # Compose does not apply shell parsing to a string `command`; pass one
    # complete script to `sh -ec` so cp receives both source and destination.
    command: ["cp /home/nacos/conf/mysql-schema.sql /nacos-schema/01-nacos-schema.sql"]
    volumes:
      - nacos-mysql-schema:/nacos-schema

  # Nacos 的持久化存储。mysql:8 由本机已有镜像满足，不会强制拉取。
  nacos-mysql:
    profiles: [java]
    image: mysql:8
    pull_policy: missing
    environment:
      MYSQL_DATABASE: ${NACOS_MYSQL_DATABASE:-nacos_config}
      MYSQL_USER: ${NACOS_MYSQL_USER:-nacos}
      MYSQL_PASSWORD: ${NACOS_MYSQL_PASSWORD:-nacos}
      MYSQL_ROOT_PASSWORD: ${NACOS_MYSQL_ROOT_PASSWORD:-nacos-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - ${DRAMAIP_COMPOSE_DATA_ROOT:-./docker-data}/nacos-mysql:/var/lib/mysql
      - nacos-mysql-schema:/docker-entrypoint-initdb.d:ro
    depends_on:
      nacos-mysql-schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  nacos:
    image: nacos/nacos-server:v3.1.1
    profiles: [java]
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: nacos-mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: ${NACOS_MYSQL_DATABASE:-nacos_config}
      MYSQL_SERVICE_USER: ${NACOS_MYSQL_USER:-nacos}
      MYSQL_SERVICE_PASSWORD: ${NACOS_MYSQL_PASSWORD:-nacos}
      # mysql:8 currently uses caching_sha2_password by default. The Nacos
      # JDBC driver must retrieve the server key for this private Compose
      # network connection when TLS is disabled.
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true"
      # Nacos 3 validates this value even when local authentication is not
      # enabled. It is a development-only default; deployments inject it.
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-VGhpcy1pcy1hLWxvY2FsLWRldmVsb3BtZW50LXRva2VuLWNoYW5nZS1tZQ==}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-security}
      JVM_XMS: ${NACOS_JVM_XMS:-256m}
      JVM_XMX: ${NACOS_JVM_XMX:-256m}
      JVM_XMN: ${NACOS_JVM_XMN:-128m}
    # Cap memory so the standalone JVM does not balloon on a dev host; the
    # heap alone targets 256m, the rest covers metaspace + direct buffers.
    mem_limit: ${NACOS_MEM_LIMIT:-512m}
    # 8848 is the HTTP API, 8849 is the Nacos 3 console (container 8080), and
    # 9848 is the Nacos gRPC client channel needed by Java services on the host.
    ports:
      - "127.0.0.1:${NACOS_HOST_PORT:-8848}:8848"
      - "127.0.0.1:${NACOS_CONSOLE_HOST_PORT:-8849}:8080"
      - "127.0.0.1:${NACOS_GRPC_HOST_PORT:-9848}:9848"
    depends_on:
      nacos-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v3/console/health/readiness >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  seata:
    image: apache/seata-server:2.7.0.jdk21
    profiles: [java]
    environment:
      SEATA_IP: seata
      SEATA_PORT: 8091
    # Seata's default heap easily exceeds 1GB without a cgroup limit. 768m is
    # ample for single-node dev and keeps Docker Desktop memory predictable.
    mem_limit: ${SEATA_MEM_LIMIT:-768m}
    ports: ["127.0.0.1:${SEATA_HOST_PORT:-8091}:8091"]

  java-migration:
    profiles: [java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: migration } }
    environment:
      # Eight Spring Boot JVMs plus the local observability stack run together.
      # Bound each heap so Docker Desktop remains usable on an 8GB allocation.
      JAVA_OPTS: "${JAVA_OPTS:--Xms64m -Xmx256m -XX:+UseG1GC}"
      POSTGRES_DSN: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dramaip}
      POSTGRES_USER: ${POSTGRES_USER:-dramaip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dramaip}
      HISTORICAL_MIGRATIONS_DIR: /app/historical-migrations
      HISTORICAL_MIGRATIONS_APPLY_PENDING: ${HISTORICAL_MIGRATIONS_APPLY_PENDING:-true}
      DB_ROLE_BOOTSTRAP: ${DB_ROLE_BOOTSTRAP:-true}
      DRAMAIP_MIGRATION_ROLE_PASSWORD: ${DRAMAIP_MIGRATION_ROLE_PASSWORD:-dramaip}
      DRAMAIP_DEPLOYMENT_ENVIRONMENT: ${DRAMAIP_DEPLOYMENT_ENVIRONMENT:-local}
      DRAMAIP_SERVICE_VERSION: ${DRAMAIP_SERVICE_VERSION:-development}
      DRAMAIP_RELEASE_NAME: ${COMPOSE_PROJECT_NAME:-docker-drama}
      OTEL_SERVICE_NAME: migration
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_TRACES_SAMPLER: always_on
      OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SERVER_REQUEST: ""
      OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_CLIENT_REQUEST: ""
      OTEL_INSTRUMENTATION_COMMON_DB_QUERY_SANITIZATION_ENABLED: "true"
      OTEL_JAVAAGENT_OPTS: ${OTEL_JAVAAGENT_OPTS:-}
    depends_on: { postgres: { condition: service_healthy } }

  java-gateway:
    profiles: [java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: gateway } }
    environment: &java-env
      JAVA_OPTS: "${JAVA_OPTS:--Xms64m -Xmx256m -XX:+UseG1GC}"
      NACOS_SERVER_ADDR: nacos:8848
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dramaip}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://identity:8080/.well-known/jwks.json}
      JWT_ENABLED: ${JWT_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3009,http://127.0.0.1:3009,http://localhost:3010,http://127.0.0.1:3010}
      DRAMAIP_INTERNAL_TOKEN: ${DRAMAIP_INTERNAL_TOKEN:-change-me-internal}
      DRAMAIP_DEPLOYMENT_ENVIRONMENT: ${DRAMAIP_DEPLOYMENT_ENVIRONMENT:-local}
      DRAMAIP_SERVICE_VERSION: ${DRAMAIP_SERVICE_VERSION:-development}
      DRAMAIP_RELEASE_NAME: ${COMPOSE_PROJECT_NAME:-docker-drama}
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_TRACES_SAMPLER: always_on
      OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SERVER_REQUEST: ""
      OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_CLIENT_REQUEST: ""
      OTEL_INSTRUMENTATION_COMMON_DB_QUERY_SANITIZATION_ENABLED: "true"
      OTEL_JAVAAGENT_OPTS: ${OTEL_JAVAAGENT_OPTS:-}
    ports: ["127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"]
    depends_on: { nacos: { condition: service_healthy }, java-migration: { condition: service_completed_successfully } }

  identity:
    profiles: [java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: services/identity } }
    environment: &java-service-env
      JAVA_OPTS: "${JAVA_OPTS:--Xms64m -Xmx256m -XX:+UseG1GC}"
      POSTGRES_DSN: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dramaip}
      POSTGRES_PASSWORD: ${POSTGRES_IDENTITY_PASSWORD:-dramaip}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dramaip}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-dramaip}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-dramaip}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dramaip}
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-false}
      WEB_COOKIE_DOMAIN: ${WEB_COOKIE_DOMAIN:-}
      WEB_REFRESH_COOKIE_TTL: ${WEB_REFRESH_COOKIE_TTL:-720h}
      NACOS_SERVER_ADDR: nacos:8848
      SEATA_SERVER_ADDR: seata:8091
      JWT_ENABLED: ${JWT_ENABLED:-true}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://identity:8080/.well-known/jwks.json}
      DRAMAIP_INTERNAL_TOKEN: ${DRAMAIP_INTERNAL_TOKEN:-change-me-internal}
      IDENTITY_ALLOW_EPHEMERAL_JWT: ${IDENTITY_ALLOW_EPHEMERAL_JWT:-true}
      REVIEW_S3_ENDPOINT: ${REVIEW_S3_ENDPOINT:-http://minio:9000}
      REVIEW_S3_REGION: ${REVIEW_S3_REGION:-us-east-1}
      REVIEW_S3_BUCKET: ${REVIEW_S3_BUCKET:-dramaip-review}
      REVIEW_S3_ACCESS_KEY: ${REVIEW_S3_ACCESS_KEY:-dramaip-review}
      REVIEW_S3_SECRET_KEY: ${REVIEW_S3_SECRET_KEY:-dramaip-review-development-secret}
      REVIEW_S3_ALLOW_INSECURE: ${REVIEW_S3_ALLOW_INSECURE:-true}
      DRAMAIP_DEPLOYMENT_ENVIRONMENT: ${DRAMAIP_DEPLOYMENT_ENVIRONMENT:-local}
      DRAMAIP_SERVICE_VERSION: ${DRAMAIP_SERVICE_VERSION:-development}
      DRAMAIP_RELEASE_NAME: ${COMPOSE_PROJECT_NAME:-docker-drama}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_TRACES_SAMPLER: always_on
      OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SERVER_REQUEST: ""
      OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_CLIENT_REQUEST: ""
      OTEL_INSTRUMENTATION_COMMON_DB_QUERY_SANITIZATION_ENABLED: "true"
      OTEL_JAVAAGENT_OPTS: ${OTEL_JAVAAGENT_OPTS:-}
      OTEL_SERVICE_NAME: identity
    depends_on: { java-migration: { condition: service_completed_successfully }, nacos: { condition: service_healthy } }

  java-notification:
    profiles: [java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: services/notification } }
    environment:
      <<: *java-service-env
      POSTGRES_USER: dramaip_notification_svc
      POSTGRES_PASSWORD: ${POSTGRES_NOTIFICATION_SVC_PASSWORD:-dramaip}
      OTEL_SERVICE_NAME: notification
    depends_on: { java-migration: { condition: service_completed_successfully }, nacos: { condition: service_healthy } }

  java-reporting:
    profiles: [java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: services/reporting } }
    environment:
      <<: *java-service-env
      POSTGRES_USER: dramaip_reporting_svc
      POSTGRES_PASSWORD: ${POSTGRES_REPORTING_SVC_PASSWORD:-dramaip}
      OTEL_SERVICE_NAME: reporting
    depends_on: { java-migration: { condition: service_completed_successfully }, nacos: { condition: service_healthy } }

  creation:
    profiles: [java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: services/creation } }
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: creation
    depends_on: { java-migration: { condition: service_completed_successfully }, nacos: { condition: service_healthy } }

  java-quota:
    profiles: [java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: services/quota } }
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: quota
    depends_on: { java-migration: { condition: service_completed_successfully }, nacos: { condition: service_healthy }, seata: { condition: service_started } }

  ai:
    profiles: [java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: services/ai } }
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: ai
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_MODELS: ${AI_MODELS:-}
      CORPUS_CRAWLER_ENABLED: ${CORPUS_CRAWLER_ENABLED:-false}
      CORPUS_PUBLIC_SEARCH_ENABLED: ${CORPUS_PUBLIC_SEARCH_ENABLED:-false}
      CORPUS_PERSONALIZATION_ENABLED: ${CORPUS_PERSONALIZATION_ENABLED:-false}
      CORPUS_EXPERIMENTS_ENABLED: ${CORPUS_EXPERIMENTS_ENABLED:-false}
      CORPUS_MAX_BYTES: ${CORPUS_MAX_BYTES:-2097152}
      CORPUS_MAX_REDIRECTS: ${CORPUS_MAX_REDIRECTS:-5}
      CORPUS_MAX_DEPTH: ${CORPUS_MAX_DEPTH:-2}
      CORPUS_MINIMUM_DOMAIN_DELAY_MS: ${CORPUS_MINIMUM_DOMAIN_DELAY_MS:-1000}
      CORPUS_USER_AGENT: ${CORPUS_USER_AGENT:-DramaIP-Creative-Corpus/1.0 (+https://dramaip.example/corpus-policy)}
      CORPUS_ENCRYPTION_KEY_BASE64: ${CORPUS_ENCRYPTION_KEY_BASE64:-}
      CORPUS_ENCRYPTION_KEY_VERSION: ${CORPUS_ENCRYPTION_KEY_VERSION:-v1}
      CORPUS_SNAPSHOT_PRIVATE_KEY_PEM: ${CORPUS_SNAPSHOT_PRIVATE_KEY_PEM:-}
      # The E2E crawler network deliberately uses a public-looking subnet.
      # Register the service through the ordinary Compose network so Gateway
      # never tries to route business traffic through the crawler fixture.
      SPRING_CLOUD_NACOS_DISCOVERY_NETWORK_INTERFACE: eth0
    depends_on: { java-migration: { condition: service_completed_successfully }, nacos: { condition: service_healthy }, seata: { condition: service_started } }
    networks:
      default:
        interface_name: eth0
      corpus-e2e:
        interface_name: eth1

  java-billing:
    profiles: [java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: services/billing } }
    environment:
      <<: *java-service-env
      # Local Compose owns the simulated payment adapter; production Helm
      # releases do not activate this profile.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      OTEL_SERVICE_NAME: billing
    depends_on: { java-migration: { condition: service_completed_successfully }, nacos: { condition: service_healthy }, seata: { condition: service_started } }

volumes:
  nacos-mysql-schema:

networks:
  default: {}
  corpus-e2e:
    ipam:
      config:
        - subnet: 93.184.216.0/24

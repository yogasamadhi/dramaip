# Docker json-file logs -> Elasticsearch. This configuration is deliberately
# local-development only: Elasticsearch authentication is disabled in Compose.
filebeat.inputs:
  - type: filestream
    id: docker-container-logs
    paths:
      - /var/lib/docker/containers/*/*-json.log
    parsers:
      - container: ~
    prospector.scanner.check_interval: 5s
    # Docker's json-file logs frequently begin with the same startup output.
    # A content fingerprint would merge different containers before their
    # first distinctive byte is reached, so use their stable mounted inode.
    file_identity.native: ~

processors:
  - decode_json_fields:
      fields: ["message"]
      target: ""
      max_depth: 1
      overwrite_keys: true
      add_error_key: false
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"
  # Java's JSON contract deliberately exposes top-level service. Normalize
  # ECS-shaped container logs (for example Filebeat's service.name) to the
  # same scalar before Elasticsearch maps the field.
  - script:
      lang: javascript
      id: normalize-service-field
      source: >
        function process(event) {
          var serviceName = event.Get("service.name");
          if (serviceName) {
            event.Put("service", serviceName);
            event.Delete("service.name");
          }
        }

# Java emits a scalar `service` field. The Compose entrypoint installs a
# higher-priority Java template for this index, so it cannot conflict with
# Filebeat's generic ECS `service.*` object mapping.
setup.ilm.enabled: false
setup.template.enabled: false

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "dramaip-logs-java-%{+yyyy.MM.dd}"

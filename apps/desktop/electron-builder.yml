# electron-builder 配置（ROADMAP v1.0-5）—— macOS / Windows / Linux 安装包
appId: com.sdns.studio
productName: 短剧IP小说工作室
afterSign: ../../scripts/notarize-mac.cjs
# 版本号从 apps/desktop/package.json 读取（保持 1.0.0）
directories:
  output: dist
  buildResources: build
# 原生模块必须从 asar 中解包；只解包二进制，避免把依赖源码目录散落进 unpacked 产物
asarUnpack:
  - '**/*.node'
# 应用文件
files:
  - 'out/**/*'
  - 'package.json'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!**/node_modules/**/*.d.ts'
  - '!**/node_modules/**/*.md'
  - '!**/node_modules/**/LICENSE*'
  - '!**/node_modules/**/*.{map,test.js,spec.js}'
# .sdnspkg 项目包文件关联（双击可在应用内打开导入）
fileAssociations:
  - ext: sdnspkg
    name: SDNS Project Package
    description: 短剧IP小说工作室 项目包
    role: Editor
# 图标（buildResources 下：icon.icns / icon.ico / icon.png，缺失则用默认）
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
win:
  target:
    - nsis
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
# v1.0：Linux（AppImage + deb）
linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: sdns-studio
  artifactName: ${productName}-${version}-${arch}.${ext}
# 自动更新发布源设计：真实发布时由 release 环境覆盖为稳定 HTTPS 静态源
publish:
  provider: generic
  url: https://updates.example.invalid/short-drama-novel-studio/stable/

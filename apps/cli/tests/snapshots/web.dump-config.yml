# == @dramaip/boot-bundle-base
- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'
- id: hmr
  name: '@dramaip/infra-hmr'
  disabled: !!js '!ctx.get(''profileContext'')'
  config:
    root: []
- id: config-editor
  name: '@dramaip/infra-config-editor'
  disabled: !!js '!ctx.get(''profileContext'')'
- id: settings
  name: '@dramaip/infra-settings'
  disabled: !!js '!ctx.get(''profileContext'')'
- id: credentials
  name: '@dramaip/infra-credentials-local'
- id: storage
  name: '@dramaip/infra-storage'
- id: storage-sqlite
  name: '@dramaip/infra-storage-sqlite'
  config:
    path: !!js dramaipHomePath('storage', 'documents.sqlite')
- id: storage-domain
  name: '@dramaip/infra-storage-domain'
  config:
    backend: sqlite
- id: storage-relational
  name: '@dramaip/infra-storage-relational'
  config:
    path: !!js dramaipHomePath('storage', 'dramaip.sqlite')
- id: subprocess
  name: '@dramaip/infra-subprocess-local'
- id: typert
  name: '@dramaip/infra-typert-registry'
- id: typert-loader
  name: '@dramaip/infra-typert-loader'
- id: typert-gateway
  name: '@dramaip/infra-gateway'
- id: remote-access
  name: '@dramaip/infra-remote-access'
- id: compat-runtime
  name: '@dramaip/compat-runtime'
- id: operations
  name: '@dramaip/infra-operations'
- id: system-system
  name: '@dramaip/system-system'
- id: foundation
  name: '@dramaip/system-system/handlers/foundation'
- id: system
  name: '@dramaip/system-system/handlers/system'
  config:
    hostRoutes: false
- id: workspace-workspace
  name: '@dramaip/workspace-workspace'
- id: workspace
  name: '@dramaip/workspace-workspace/handlers/workspace'
# == @dramaip/boot-bundle-web
- id: web-startup
  name: '@dramaip/infra-web-runtime/startup'
- id: webserver
  name: '@dramaip/infra-webserver'
  inject:
    - webStartup
  config:
    host: !!js ctx.webStartup.host ?? '127.0.0.1'
    port: !!js ctx.webStartup.port ?? 3280
    tls: !!js ctx.webStartup.tls
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
- id: web-runtime
  name: '@dramaip/infra-web-runtime'
  inject:
    - webStartup
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    publicUrl: !!js ctx.webStartup.publicUrl
    surfaceContext: true
- id: connection
  name: '@dramaip/infra-connection'
  inject:
    - webStartup
  config:
    trustedHosts: !!js ctx.webStartup.trustedHosts
- id: settings-controller
  name: '@dramaip/infra-settings-controller'
- id: client-hmr
  name: '@dramaip/infra-client-hmr'
- id: modules
  name: '@dramaip/infra-client-modules'
- id: api-remotes
  name: '@dramaip/infra-remotes'

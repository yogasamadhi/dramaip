stages:
  - validate
  - quality

default:
  tags:
    - docker
    - private
  interruptible: true

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

variables:
  GIT_DEPTH: "0"
  GIT_TERMINAL_PROMPT: "0"
  PNPM_HOME: "${CI_PROJECT_DIR}/.cache/pnpm"
  PNPM_STORE_DIR: "${CI_PROJECT_DIR}/.cache/pnpm/store"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  PLATFORM_CLIENTS_NODE_VERSION: "24.18.0"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"

static_checks:
  stage: validate
  image:
    name: harbor.home.arpa/ci-tools/git-yq:4.44.3
    entrypoint: [""]
  script:
    - git diff --check
    - platform/deploy/release/check-manifest.sh
    - bash -n platform/deploy/release/*.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

java_server:
  stage: validate
  image:
    name: maven:3.9.11-eclipse-temurin-21
    entrypoint: [""]
  script:
    - cd platform/server
    - mvn -B -ntp verify
  artifacts:
    when: always
    paths:
      - platform/server/**/target/
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

platform_clients:
  stage: validate
  image:
    name: node:24.18.0-bookworm-slim
    entrypoint: [""]
  cache:
    key:
      files:
        - platform/clients/pnpm-lock.yaml
      prefix: platform-clients-${CI_PROJECT_ID}
    paths:
      - .cache/pnpm/
  before_script:
    - |
      set -eu
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl xz-utils python3 build-essential
      corepack enable
      corepack prepare pnpm@11.28.5 --activate
      test "$(pnpm --version)" = "11.28.5"
      node --version
      cd platform/clients
      pnpm ci
  script:
    - pnpm run lint
    - pnpm run typecheck
    - pnpm run contracts:check
    - pnpm run test
    - pnpm run build:web
    - pnpm run build:admin
    - cd ..
    - make web-route-smoke
    - make observability-config-smoke
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

platform_e2e:
  stage: validate
  image:
    name: node:24.18.0-bookworm-slim
    entrypoint: [""]
  needs:
    - job: java_server
      artifacts: true
  before_script:
    - |
      set -eu
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl gnupg make
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      . /etc/os-release
      printf 'Types: deb\nURIs: https://download.docker.com/linux/debian\nSuites: %s\nComponents: stable\nArchitectures: %s\nSigned-By: /etc/apt/keyrings/docker.asc\n' "$VERSION_CODENAME" "$(dpkg --print-architecture)" > /etc/apt/sources.list.d/docker.sources
      apt-get update
      apt-get install -y --no-install-recommends docker-ce-cli docker-compose-plugin
      docker info
  script:
    - export COMPOSE_PROJECT_NAME="dramaip-ci-${CI_PIPELINE_ID}-${CI_JOB_ID}"
    - cd platform
    - make platform-ci-e2e
  after_script:
    - export COMPOSE_PROJECT_NAME="dramaip-ci-${CI_PIPELINE_ID}-${CI_JOB_ID}"
    - cd platform
    - if [ "$CI_JOB_STATUS" != "success" ]; then docker compose -f deploy/docker-drama/docker-compose.yaml --profile java --profile e2e --profile observability --profile observability-test logs --no-color > ../platform-e2e-compose.log 2>&1 || true; fi
    - make platform-ci-down || true
  artifacts:
    when: always
    paths:
      - platform-e2e-compose.log
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

desktop_linux:
  stage: validate
  image:
    name: node:24.18.0-bookworm-slim
    entrypoint: [""]
  cache:
    key:
      files:
        - desktop/pnpm-lock.yaml
      prefix: desktop-linux-${CI_PROJECT_ID}
    paths:
      - .cache/pnpm/
      - .cache/electron/
      - .cache/electron-builder/
  before_script:
    - |
      set -eu
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl git xz-utils python3 build-essential xvfb libgtk-3-0 libnss3 libasound2 libgbm1
      corepack enable
      corepack prepare pnpm@11.28.5 --activate
      test "$(pnpm --version)" = "11.28.5"
      DESKTOP_NODE_VERSION=24.18.0
      case "$(uname -m)" in x86_64) desktop_node_arch=x64 ;; aarch64) desktop_node_arch=arm64 ;; *) exit 1 ;; esac
      desktop_node_archive="node-v${DESKTOP_NODE_VERSION}-linux-${desktop_node_arch}.tar.xz"
      curl -fsSLO "https://nodejs.org/dist/v${DESKTOP_NODE_VERSION}/${desktop_node_archive}"
      curl -fsSLO "https://nodejs.org/dist/v${DESKTOP_NODE_VERSION}/SHASUMS256.txt"
      grep " ${desktop_node_archive}$" SHASUMS256.txt | sha256sum -c -
      tar -xJf "${desktop_node_archive}" -C /opt
      export PATH="/opt/node-v${DESKTOP_NODE_VERSION}-linux-${desktop_node_arch}/bin:${PATH}"
      test "$(node --version)" = "v24.18.0"
      git submodule update --init
      cd desktop
      pnpm run prepare:framework
      pnpm ci
      pnpm run build:framework
      pnpm run check:framework
      export DRAMAIP_UPDATE_URL="${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/packages/generic/dramaip-desktop/${CI_COMMIT_TAG:-${CI_COMMIT_SHA}}"
  script:
    - pnpm run lint
    - pnpm run format:check
    - pnpm run typecheck
    - pnpm run test
    - pnpm run check:architecture
    - pnpm run check:generated
    - pnpm run check:migration:complete
    - pnpm run check:engine-locks
    - pnpm run check:provider-catalog
    - pnpm run check:extension-packages
    - pnpm run check:timeline-exports
    - pnpm run build
    - pnpm run check:renderer-chunks
    - pnpm run test:runtime:watch
    - pnpm run test:runtime:hmr
    - xvfb-run -a pnpm run test:runtime:hmr:electron
    - xvfb-run -a node scripts/run-electron-playwright.ts test
    - pnpm run package
    - pnpm run release:metadata
  artifacts:
    when: always
    paths:
      - desktop/apps/desktop/dist/
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

desktop_macos_release:
  stage: validate
  tags:
    - macos
    - private
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.28.5 --activate
    - git submodule update --init
    - cd desktop
    - test "$(pnpm --version)" = "11.28.5"
    - test "$(node --version)" = "v24.18.0"
    - pnpm run prepare:framework
    - pnpm ci
    - pnpm run build:framework
    - pnpm run check:framework
    - export DRAMAIP_UPDATE_URL="${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/packages/generic/dramaip-desktop/${CI_COMMIT_TAG}"
  script:
    - pnpm run lint
    - pnpm run format:check
    - pnpm run test
    - pnpm run check:architecture
    - pnpm run check:generated
    - pnpm run check:migration:complete
    - pnpm run check:engine-locks
    - pnpm run check:provider-catalog
    - pnpm run check:extension-packages
    - pnpm run check:timeline-exports
    - pnpm run test:e2e
    - pnpm run check:renderer-chunks
    - pnpm run test:runtime:watch
    - pnpm run test:runtime:hmr
    - pnpm run test:runtime:hmr:electron
    - pnpm run package
    - pnpm run release:metadata
  artifacts:
    when: always
    paths:
      - desktop/apps/desktop/dist/
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG'

desktop_windows_release:
  stage: validate
  tags:
    - windows
    - private
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.28.5 --activate
    - git submodule update --init
    - Set-Location desktop
    - if ((pnpm --version) -ne "11.28.5") { throw "Desktop requires pnpm 11.28.5 exactly" }
    - if ((node --version) -ne "v24.18.0") { throw "Core Runtime requires Node 24.18.0 exactly" }
    - pnpm run prepare:framework
    - pnpm ci
    - pnpm run build:framework
    - pnpm run check:framework
    - $env:DRAMAIP_UPDATE_URL = "$env:CI_SERVER_URL/api/v4/projects/$env:CI_PROJECT_ID/packages/generic/dramaip-desktop/$env:CI_COMMIT_TAG"
  script:
    - pnpm run lint
    - pnpm run format:check
    - pnpm run test
    - pnpm run check:architecture
    - pnpm run check:generated
    - pnpm run check:migration:complete
    - pnpm run check:engine-locks
    - pnpm run check:provider-catalog
    - pnpm run check:extension-packages
    - pnpm run check:timeline-exports
    - pnpm run test:e2e
    - pnpm run check:renderer-chunks
    - pnpm run test:runtime:watch
    - pnpm run test:runtime:hmr
    - pnpm run test:runtime:hmr:electron
    - pnpm run package
    - pnpm run release:metadata
  artifacts:
    when: always
    paths:
      - desktop/apps/desktop/dist/
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG'

sonarqube_platform:
  stage: quality
  image:
    name: harbor.home.arpa/ci-tools/sonar-scanner:7.0.1
    entrypoint: [""]
  needs:
    - job: java_server
      artifacts: true
  script:
    - >-
      sonar-scanner
      -Dsonar.projectBaseDir=platform
      -Dsonar.host.url="${SONAR_HOST_URL}"
      -Dsonar.token="${SONAR_TOKEN}"
      -Dsonar.qualitygate.wait=true
      -Dsonar.qualitygate.timeout=300
      -Dsonar.scanner.truststorePath=/opt/sonar-truststore/truststore.p12
      -Dsonar.scanner.truststorePassword=changeit
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - validate
  - quality

default:
  tags:
    - docker
    - private
  interruptible: true

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

variables:
  GIT_DEPTH: "0"
  GIT_TERMINAL_PROMPT: "0"
  BUN_INSTALL_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/bun"
  DESKTOP_NODE_VERSION: "24.18.0"
  PLATFORM_CLIENTS_NODE_VERSION: "24.18.0"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"

static_checks:
  stage: validate
  image:
    name: harbor.home.arpa/ci-tools/git-yq:4.44.3
    entrypoint: [""]
  script:
    - git diff --check
    - "test \"$(awk -F '|' 'NF == 4 && $1 !~ /^#/ { count += 1 } END { print count }' dramaip-platform/deploy/release/images.tsv)\" = 9"
    - "test \"$(awk -F '|' '$3 == \"java\" { count += 1 } END { print count }' dramaip-platform/deploy/release/images.tsv)\" = 8"
    - "test \"$(awk -F '|' '$3 == \"web\" { count += 1 } END { print count }' dramaip-platform/deploy/release/images.tsv)\" = 1"
    - bash -n dramaip-platform/deploy/release/build-images.sh dramaip-platform/deploy/release/scan-images.sh dramaip-platform/deploy/release/push-images.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

java_server:
  stage: validate
  image:
    name: maven:3.9.11-eclipse-temurin-21
    entrypoint: [""]
  script:
    - cd dramaip-platform/server
    - mvn -B -ntp verify
  artifacts:
    when: always
    paths:
      - dramaip-platform/server/**/target/
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

platform_clients:
  stage: validate
  image:
    name: oven/bun:1.3.14-debian
    entrypoint: [""]
  cache:
    key:
      files:
        - dramaip-platform/clients/bun.lock
      prefix: platform-clients-${CI_PROJECT_ID}
    paths:
      - .cache/bun/
  before_script:
    - |
      set -eu
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl xz-utils python3 build-essential
      case "$(dpkg --print-architecture)" in
        amd64)
          node_arch=x64
          node_sha256=55aa7153f9d88f28d765fcdad5ae6945b5c0f98a36881703817e4c450fa76742
          ;;
        arm64)
          node_arch=arm64
          node_sha256=58c9520501f6ae2b52d5b210444e24b9d0c029a58c5011b797bc1fe7105886f6
          ;;
        *)
          echo "Unsupported architecture: $(dpkg --print-architecture)" >&2
          exit 1
          ;;
      esac
      node_archive="node-v${PLATFORM_CLIENTS_NODE_VERSION}-linux-${node_arch}.tar.xz"
      curl -fsSLO "https://nodejs.org/dist/v${PLATFORM_CLIENTS_NODE_VERSION}/${node_archive}"
      printf '%s  %s\n' "${node_sha256}" "${node_archive}" | sha256sum -c -
      mkdir -p /opt/dramaip-clients-node
      tar -xJf "${node_archive}" -C /opt/dramaip-clients-node --strip-components=1
      rm "${node_archive}"
      export PATH="/opt/dramaip-clients-node/bin:${PATH}"
      bun --version
      node --version
      cd dramaip-platform/clients
      bun ci
  script:
    - bun run lint
    - bun run typecheck
    - bun run contracts:check
    - bun run test
    - bun run build:web
    - bun run build:admin
    - cd ..
    - make web-route-smoke
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

desktop_linux:
  stage: validate
  image:
    name: oven/bun:1.3.14-debian
    entrypoint: [""]
  cache:
    key:
      files:
        - dramaip-desktop/bun.lock
      prefix: desktop-linux-${CI_PROJECT_ID}
    paths:
      - .cache/bun/
      - .cache/electron/
      - .cache/electron-builder/
  before_script:
    - |
      set -eu
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl xz-utils python3 build-essential
      case "$(dpkg --print-architecture)" in
        amd64)
          node_arch=x64
          node_sha256=55aa7153f9d88f28d765fcdad5ae6945b5c0f98a36881703817e4c450fa76742
          ;;
        arm64)
          node_arch=arm64
          node_sha256=58c9520501f6ae2b52d5b210444e24b9d0c029a58c5011b797bc1fe7105886f6
          ;;
        *)
          echo "Unsupported architecture: $(dpkg --print-architecture)" >&2
          exit 1
          ;;
      esac
      node_archive="node-v${DESKTOP_NODE_VERSION}-linux-${node_arch}.tar.xz"
      curl -fsSLO "https://nodejs.org/dist/v${DESKTOP_NODE_VERSION}/${node_archive}"
      printf '%s  %s\n' "${node_sha256}" "${node_archive}" | sha256sum -c -
      mkdir -p /opt/dramaip-node
      tar -xJf "${node_archive}" -C /opt/dramaip-node --strip-components=1
      rm "${node_archive}"
      export PATH="/opt/dramaip-node/bin:${PATH}"
      bun --version
      node --version
      cd dramaip-desktop
      bun ci
  script:
    - bun run lint
    - bun run test:unit
    - bun run test:db
    - bun run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

sonarqube_platform:
  stage: quality
  image:
    name: harbor.home.arpa/ci-tools/sonar-scanner:7.0.1
    entrypoint: [""]
  needs:
    - job: java_server
      artifacts: true
  script:
    - >-
      sonar-scanner
      -Dsonar.projectBaseDir=dramaip-platform
      -Dsonar.host.url="${SONAR_HOST_URL}"
      -Dsonar.token="${SONAR_TOKEN}"
      -Dsonar.qualitygate.wait=true
      -Dsonar.qualitygate.timeout=300
      -Dsonar.scanner.truststorePath=/opt/sonar-truststore/truststore.p12
      -Dsonar.scanner.truststorePassword=changeit
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

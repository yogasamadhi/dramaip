- id: sdk-jsonrpc-server
  name: "@deepseek-ai/dsh-sdk-jsonrpc-server"
  config:
    maxTokensAsSuccess: false

- id: llm
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      anthropic:
        apiKeyEnv: DRAMAIP_DSH_API_KEY
        baseURL: !!js process.env.DRAMAIP_DSH_BASE_URL
        models:
          - id: !!js process.env.DRAMAIP_DSH_MODEL
            contextWindow: 200000
            maxTokens: 32768

- id: dramaip-mcp
  name: "@deepseek-ai/dsh-mcp-client"
  config:
    serverName: dramaip
    transport: streamable-http
    url: !!js process.env.DRAMAIP_MCP_URL
    headers:
      Authorization: !!js "`Bearer ${process.env.DRAMAIP_MCP_TOKEN}`"
    failOnStartupError: true
    reconnect:
      enabled: false

- id: agent-spine
  name: "@deepseek-ai/dsh-agent-spine-demo"
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: |-
      你是 DramaIP 的中文创作智能助手。只能分析用户提供的上下文并使用 DramaIP 只读 MCP 工具。
      禁止执行命令、读取或修改本地文件、访问未授权网络、创建子代理或修改 DramaIP 正式数据。
      所有输出使用简体中文，不得输出隐藏思维过程。
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

appId: com.sdns.dramaip.next
productName: DramaIP Studio
artifactName: DramaIP-Studio-Next-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - "**/*.node"
extraResources:
  - from: ../../generated/third-party-licenses.json
    to: third-party-notices/desktop2-licenses.json
  - from: build/codex
    to: codex
    filter:
      - "**/*"
  - from: build/dsh
    to: dsh/runtime
    filter:
      - "**/*"
      - "!node_modules/**/*"
  - from: build/dsh/node_modules
    to: dsh/runtime/node_modules
    filter:
      - "**/*"
  - from: dsh-config
    to: dsh/config
    filter:
      - "*.cordis.yml"
  - from: ../../../desktop/vendor/deepseek-harness/LICENSE
    to: third-party-notices/dsh/LICENSE
  - from: ../../../desktop/vendor/deepseek-harness/THIRD_PARTY_NOTICES.md
    to: third-party-notices/dsh/THIRD_PARTY_NOTICES.md
  - from: build/pi
    to: pi/runtime
    filter:
      - "**/*"
  - from: ../../../desktop/vendor/pi/LICENSE
    to: third-party-notices/pi/LICENSE
  - from: pi-adapter/THIRD_PARTY_NOTICES.md
    to: third-party-notices/pi/THIRD_PARTY_NOTICES.md
  - from: build/opencode
    to: opencode
    filter:
      - "**/*"
      - "!node_modules/**/*"
  - from: build/opencode/node_modules/jsonc-parser
    to: opencode/node_modules/jsonc-parser
  - from: build/opencode/node_modules/@lydell
    to: opencode/node_modules/@lydell
    filter:
      - "node-pty/**/*"
      - "node-pty-*/**/*"
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  category: Development
  target:
    - AppImage
publish:
  provider: generic
  url: ${env.DRAMAIP_NEXT_UPDATE_URL}

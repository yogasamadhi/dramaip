# Standalone package under dramaip/plugin2dsh/, independent of the Desktop workspace and platform/.
# The @deepseek-ai peers come from the DSH install that loads this plugin,
# never from a registry.
autoInstallPeers: false
# esbuild's postinstall only re-checks the binary that its platform package
# already ships; nothing here needs install-time scripts.
allowBuilds:
  esbuild: false

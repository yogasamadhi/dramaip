spring:
  application:
    name: gateway
  config:
    import: optional:nacos:${spring.application.name}.yaml?group=DRAMAIP
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
      config:
        namespace: ${NACOS_NAMESPACE:}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}

dramaip:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3009,http://127.0.0.1:3009,http://localhost:3010,http://127.0.0.1:3010}
  security:
    jwt:
      enabled: ${JWT_ENABLED:false}
      jwk-set-uri: ${JWT_JWK_SET_URI:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}

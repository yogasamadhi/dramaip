spring:
  application:
    name: migration
  main:
    web-application-type: none
  flyway:
    enabled: false
  datasource:
    url: ${POSTGRES_DSN:jdbc:postgresql://localhost:5432/dramaip}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

dramaip:
  migration:
    historical-migrations-dir: ${HISTORICAL_MIGRATIONS_DIR:migration/historical-migrations}
    role-bootstrap: ${DB_ROLE_BOOTSTRAP:false}
    apply-pending-historical-migrations: ${HISTORICAL_MIGRATIONS_APPLY_PENDING:false}
    role-password: ${DRAMAIP_MIGRATION_ROLE_PASSWORD:${POSTGRES_PASSWORD:}}

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}

spring:
  application: { name: notification }
  config:
    import: "optional:nacos:${spring.application.name}.yaml?group=DRAMAIP"
  flyway: { enabled: false }
  datasource:
    url: "${POSTGRES_DSN:jdbc:postgresql://localhost:5432/dramaip}"
    username: "${POSTGRES_USER:dramaip_notification_svc}"
    password: "${POSTGRES_PASSWORD:}"
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "${JWT_JWK_SET_URI:}"
  cloud:
    nacos:
      server-addr: "${NACOS_SERVER_ADDR:localhost:8848}"
dramaip:
  security:
    jwt:
      enabled: ${JWT_ENABLED:false}
  consumer:
    enabled: ${NOTIFICATION_CONSUMER_ENABLED:${SUPPORT_CONSUMER_ENABLED:false}}
  events:
    notification-queue: "${NOTIFICATION_EVENT_QUEUE:${SUPPORT_EVENT_QUEUE:dramaip.notification.java}}"
management.endpoints.web.exposure.include: health,info,metrics,prometheus

server:
  http:
    addr: 0.0.0.0:8101
  grpc:
    addr: 0.0.0.0:9101
data:
  postgres:
    dsn: postgres://dramaip:dramaip@localhost:5432/dramaip?sslmode=disable&search_path=auth
  redis:
    addr: localhost:6379
jwt:
  issuer: dramaip-auth
  audience: dramaip-api
  access_token_ttl: 15m
  refresh_token_ttl: 720h
email:
  # A provider-owned HTTPS delivery gateway. Configure through environment
  # variables in deployment; no provider credential is stored in this file.
  timeout: 10s

version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  # Existing synchronous API packages predate the current directory and RPC
  # naming rules. Keep the exceptions scoped to those legacy paths so every
  # new event contract is still checked by the complete STANDARD rule set.
  ignore_only:
    PACKAGE_DIRECTORY_MATCH:
      - api
    RPC_REQUEST_RESPONSE_UNIQUE:
      - api/auth/service/v1/auth.proto
      - api/billing/service/v1/billing.proto
      - api/quota/service/v1/quota.proto
      - api/user/service/v1/user.proto
    RPC_RESPONSE_STANDARD_NAME:
      - api
breaking:
  use:
    - FILE

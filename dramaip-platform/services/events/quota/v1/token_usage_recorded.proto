syntax = "proto3";

package events.quota.v1;

option go_package = "github.com/dramaip/dramaip-platform/services/events/quota/v1;quotaeventsv1";

// TokenUsageRecorded is emitted after a quota usage record is durably stored.
message TokenUsageRecorded {
  string usage_id = 1;
  string account_id = 2;
  string user_id = 3;
  string request_id = 4;
  int64 input_tokens = 5;
  int64 output_tokens = 6;
  int64 total_tokens = 7;
}

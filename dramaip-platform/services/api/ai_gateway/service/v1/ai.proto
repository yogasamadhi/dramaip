syntax = "proto3";

package dramaip.ai_gateway.service.v1;

option go_package = "github.com/dramaip/dramaip-platform/services/api/ai_gateway/service/v1;aigatewayv1";

service AiGatewayService {
  // Lists the currently configured, billable cloud models. This is a
  // read-only authenticated capability; it never exposes provider secrets.
  rpc ListModels(ListModelsRequest) returns (ListModelsReply);
  // Checks a bounded desktop context before a billable Chat request. The
  // request intentionally contains only counts, never creative content.
  rpc Preflight(PreflightRequest) returns (PreflightReply);
  rpc Chat(ChatRequest) returns (ChatReply);
  // Streams provider output only after the same preflight-bound request has
  // claimed durable idempotency and reserved quota. A reconnect with the same
  // key replays the final audited result rather than invoking a provider again.
  rpc ChatStream(ChatRequest) returns (stream ChatStreamEvent);
  // Requests cancellation for a currently streaming generation. Cancellation
  // releases the reservation before its audit is marked canceled.
  rpc CancelChat(CancelChatRequest) returns (CancelChatReply);
  // Returns the caller-owned audit state for reconnect/status recovery. It
  // never returns input prompts or provider credentials.
  rpc GetChatStatus(GetChatStatusRequest) returns (GetChatStatusReply);
}

message ListModelsRequest {
  string user_id = 1;
}

message CloudModel {
  string provider = 1;
  string model = 2;
  bool is_default = 3;
}

message ListModelsReply {
  repeated CloudModel models = 1;
}

message PreflightRequest {
  string user_id = 1;
  string provider = 2;
  string model = 3;
  int64 context_characters = 4;
  int64 message_count = 5;
  int64 max_tokens = 6;
  // SHA-256 base64url digest over provider/model/final messages/max_tokens.
  // This binds the content-free preflight to the later Chat payload.
  string request_hash = 7;
}

message PreflightReply {
  CloudModel model = 1;
  int64 estimated_tokens = 2;
  string request_hash = 3;
}

message ChatRequest {
  string user_id = 1;
  string request_id = 2;
  string model = 3;
  repeated ChatMessage messages = 4;
  int64 max_tokens = 5;
  string provider = 6;
  // Idempotency-Key supplied by the client. request_id remains a request
  // correlation value for backwards compatibility.
  string idempotency_key = 7;
  // Trusted Web BFF network observation for cost guardrails; never used as identity.
  string client_ip = 8;
  // Must equal the hash accepted by Preflight and the gateway's recomputation
  // from this exact Chat payload.
  string preflight_request_hash = 9;
}

message ChatMessage {
  string role = 1;
  string content = 2;
}

message ChatReply {
  string content = 1;
  int64 total_tokens = 2;
  string provider = 3;
  string model = 4;
  int64 prompt_tokens = 5;
  int64 completion_tokens = 6;
  string reservation_id = 7;
  int64 remaining_tokens = 8;
  string request_id = 9;
  string status = 10;
}

message ChatStreamEvent {
  // started, delta, completed, canceled, or failed.
  string type = 1;
  string request_id = 2;
  string delta = 3;
  ChatReply reply = 4;
}

message CancelChatRequest {
  string user_id = 1;
  string idempotency_key = 2;
}

message CancelChatReply {
  // cancellation_requested, succeeded, canceled, or not_found.
  string status = 1;
}

message GetChatStatusRequest {
  string user_id = 1;
  string idempotency_key = 2;
}

message GetChatStatusReply {
  ChatReply reply = 1;
}

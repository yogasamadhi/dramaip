syntax = "proto3";

package dramaip.auth.service.v1;

option go_package = "github.com/dramaip/dramaip-platform/services/api/auth/service/v1;authv1";

service AuthService {
  rpc Register(RegisterRequest) returns (AuthReply);
  rpc Login(LoginRequest) returns (AuthReply);
  rpc Refresh(RefreshRequest) returns (AuthReply);
  rpc Logout(LogoutRequest) returns (LogoutReply);
  rpc ValidateAccessToken(ValidateAccessTokenRequest) returns (AuthReply);
  rpc RequestEmailVerification(RequestEmailVerificationRequest) returns (EmailActionReply);
  rpc VerifyEmail(VerifyEmailRequest) returns (EmailActionReply);
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (EmailActionReply);
  rpc ResetPassword(ResetPasswordRequest) returns (EmailActionReply);
  // Web BFF creates a short-lived code only after it has authenticated the
  // browser session. The raw code is returned once and is never persisted.
  rpc CreateDesktopAuthorizationCode(CreateDesktopAuthorizationCodeRequest) returns (CreateDesktopAuthorizationCodeReply);
  // Desktop BFF exchanges the code after the Electron main process has
  // verified its local callback state and supplies the original PKCE verifier.
  rpc ExchangeDesktopAuthorizationCode(ExchangeDesktopAuthorizationCodeRequest) returns (AuthReply);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string display_name = 3;
  string device_id = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string device_id = 3;
}

message RefreshRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
  string access_token = 2;
  string device_id = 3;
}

message ValidateAccessTokenRequest {
  string access_token = 1;
}

message AuthReply {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  string token_type = 4;
  string user_id = 5;
  string email = 6;
  string name = 7;
  bool email_verified = 8;
}

message LogoutReply {
  bool ok = 1;
}

// Verification and recovery codes are delivered out of band. They are never
// returned by this API, placed in a URL, or written to logs.
message RequestEmailVerificationRequest {
  string user_id = 1;
}

message VerifyEmailRequest {
  string user_id = 1;
  string code = 2;
}

message RequestPasswordResetRequest {
  string email = 1;
}

message ResetPasswordRequest {
  string email = 1;
  string code = 2;
  string password = 3;
}

message EmailActionReply {
  bool accepted = 1;
}

message CreateDesktopAuthorizationCodeRequest {
  string user_id = 1;
  string code_challenge = 2;
  string redirect_uri = 3;
  string device_id = 4;
}

message CreateDesktopAuthorizationCodeReply {
  string authorization_code = 1;
  int64 expires_in = 2;
}

message ExchangeDesktopAuthorizationCodeRequest {
  string authorization_code = 1;
  string code_verifier = 2;
  string redirect_uri = 3;
  string device_id = 4;
}

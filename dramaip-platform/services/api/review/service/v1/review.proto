syntax = "proto3";

package dramaip.review.service.v1;

option go_package = "github.com/dramaip/dramaip-platform/services/api/review/service/v1;reviewv1";

service ReviewService {
  rpc CreatePackage(CreatePackageRequest) returns (CreatePackageReply);
  rpc CompletePackage(CompletePackageRequest) returns (ReviewPackage);
  rpc RefreshUploadTarget(RefreshUploadTargetRequest) returns (UploadTarget);
  rpc SyncPackage(SyncPackageRequest) returns (SyncPackageReply);
  rpc DeletePackage(DeletePackageRequest) returns (DeletePackageReply);

  // Called by the Web BFF for anonymous review pages. The BFF must apply its
  // own edge rate limit; this service also enforces a database-backed limit.
  rpc GetPublicPackage(GetPublicPackageRequest) returns (PublicPackageReply);
  rpc SubmitPublicComment(SubmitPublicCommentRequest) returns (ReviewComment);
  rpc SubmitPublicDecision(SubmitPublicDecisionRequest) returns (ReviewDecision);
}

message ReviewMediaDeclaration {
  string id = 1;
  string relative_path = 2;
  string mime_type = 3;
  int64 size_bytes = 4;
  string sha256 = 5;
}

message ReviewMedia {
  string id = 1;
  string relative_path = 2;
  string mime_type = 3;
  int64 size_bytes = 4;
  string sha256 = 5;
  string status = 6;
  string download_url = 7;
  string download_url_expires_at = 8;
}

message ReviewPackage {
  string id = 1;
  string workspace_id = 2;
  string desktop_package_id = 3;
  string title = 4;
  string status = 5;
  string manifest_json = 6;
  int64 storage_bytes = 7;
  int64 sync_cursor = 8;
  string expires_at = 9;
  string created_at = 10;
  repeated ReviewMedia media = 11;
}

message UploadHeader {
  string name = 1;
  string value = 2;
}

message UploadTarget {
  string media_id = 1;
  string method = 2;
  string url = 3;
  repeated UploadHeader required_headers = 4;
  string expires_at = 5;
}

message CreatePackageRequest {
  string user_id = 1;
  string workspace_id = 2;
  string desktop_package_id = 3;
  string title = 4;
  string manifest_json = 5;
  string pin = 6;
  repeated ReviewMediaDeclaration media = 7;
}

message CreatePackageReply {
  ReviewPackage package = 1;
  // Returned only once. The database stores only SHA-256(token).
  string share_token = 2;
  repeated UploadTarget upload_targets = 3;
}

message CompletePackageRequest {
  string user_id = 1;
  string package_id = 2;
}

message RefreshUploadTargetRequest {
  string user_id = 1;
  string package_id = 2;
  string media_id = 3;
}

message SyncPackageRequest {
  string user_id = 1;
  string package_id = 2;
  int64 after_cursor = 3;
}

message SyncPackageReply {
  int64 next_cursor = 1;
  repeated ReviewComment comments = 2;
  repeated ReviewDecision decisions = 3;
}

message DeletePackageRequest {
  string user_id = 1;
  string package_id = 2;
}

message DeletePackageReply {
  string package_id = 1;
  string status = 2;
}

message GetPublicPackageRequest {
  string token = 1;
  string pin = 2;
}

message PublicPackageReply {
  ReviewPackage package = 1;
}

message SubmitPublicCommentRequest {
  string token = 1;
  string pin = 2;
  string client_id = 3;
  string shot_id = 4;
  double timecode_seconds = 5;
  string author_alias = 6;
  string body = 7;
}

message ReviewComment {
  string id = 1;
  string package_id = 2;
  string client_id = 3;
  string shot_id = 4;
  double timecode_seconds = 5;
  string author_alias = 6;
  string body = 7;
  bool resolved = 8;
  int64 cursor = 9;
  string created_at = 10;
  string updated_at = 11;
}

message SubmitPublicDecisionRequest {
  string token = 1;
  string pin = 2;
  string client_id = 3;
  string shot_id = 4;
  string decision = 5;
  string author_alias = 6;
  string note = 7;
}

message ReviewDecision {
  string id = 1;
  string package_id = 2;
  string client_id = 3;
  string shot_id = 4;
  string decision = 5;
  string author_alias = 6;
  string note = 7;
  int64 cursor = 8;
  string created_at = 9;
}

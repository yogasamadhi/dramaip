syntax = "proto3";

package dramaip.billing.job.v1;

option go_package = "github.com/dramaip/dramaip-platform/services/api/billing/job/v1;billingjobv1";

// ReconciliationOperationsService is deliberately hosted by billing-job: the
// job owns both the durable reconciliation reports and the repair workflow.
// It is an internal mTLS-only API for the Admin BFF, never a public billing
// surface.
service ReconciliationOperationsService {
  rpc StartReconciliation(StartReconciliationRequest) returns (StartReconciliationResponse);
  rpc GetLatestReconciliationRun(GetLatestReconciliationRunRequest) returns (GetLatestReconciliationRunResponse);
  rpc ListReconciliationItems(ListReconciliationItemsRequest) returns (ListReconciliationItemsResponse);
  rpc ApplyReconciliationAction(ApplyReconciliationActionRequest) returns (ApplyReconciliationActionResponse);
}

message ReconciliationRun {
  string id = 1;
  string trigger = 2;
  string requested_by = 3;
  string status = 4;
  int32 scanned_items = 5;
  int32 detected_items = 6;
  string started_at = 7;
  string completed_at = 8;
  string failure = 9;
}

message ReconciliationItem {
  string id = 1;
  string run_id = 2;
  string order_id = 3;
  string user_id = 4;
  string subscription_id = 5;
  string mismatch_type = 6;
  string severity = 7;
  string recommendation = 8;
  string status = 9;
  int32 occurrences = 10;
  string first_detected_at = 11;
  string last_detected_at = 12;
  string resolved_at = 13;
  string resolved_by = 14;
  string resolution_note = 15;
}

message ReconciliationAction {
  string id = 1;
  string item_id = 2;
  string action = 3;
  string idempotency_key = 4;
  string actor = 5;
  string reason = 6;
  string status = 7;
  string outcome_json = 8;
  string created_at = 9;
  string completed_at = 10;
}

message StartReconciliationRequest {
  string actor_id = 1;
  string idempotency_key = 2;
}
message StartReconciliationResponse { ReconciliationRun run = 1; }

message GetLatestReconciliationRunRequest {}
message GetLatestReconciliationRunResponse { ReconciliationRun run = 1; }

message ListReconciliationItemsRequest {
  string status = 1;
  int32 limit = 2;
}
message ListReconciliationItemsResponse { repeated ReconciliationItem items = 1; }

message ApplyReconciliationActionRequest {
  string item_id = 1;
  string action = 2;
  string actor_id = 3;
  string reason = 4;
  string idempotency_key = 5;
}
message ApplyReconciliationActionResponse { ReconciliationAction action = 1; }

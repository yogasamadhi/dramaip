syntax = "proto3";

package dramaip.billing.service.v1;

option go_package = "github.com/dramaip/dramaip-platform/services/api/billing/service/v1;billingv1";

service BillingService {
  rpc ListPlans(ListPlansRequest) returns (ListPlansReply);
  rpc CreateCheckout(CreateCheckoutRequest) returns (CreateCheckoutReply);
  rpc ConfirmSandboxPayment(ConfirmSandboxPaymentRequest) returns (ConfirmSandboxPaymentReply);
  rpc ConfirmSimulatedPayment(ConfirmSimulatedPaymentRequest) returns (ConfirmSimulatedPaymentReply);
  rpc GetSubscription(GetSubscriptionRequest) returns (Subscription);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersReply);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc CancelSubscription(CancelSubscriptionRequest) returns (Subscription);
  rpc ResumeSubscription(ResumeSubscriptionRequest) returns (Subscription);
  rpc ChangeSubscriptionPlan(ChangeSubscriptionPlanRequest) returns (Subscription);
  rpc RequestRefund(RequestRefundRequest) returns (Refund);
}

message ListPlansRequest {}

message Plan {
  string id = 1;
  string code = 2;
  string name = 3;
  int64 monthly_token_quota = 4;
  string price = 5;
  string currency = 6;
  int64 price_cny = 7;
  string model_level = 8;
  int64 max_rpm = 9;
}

message ListPlansReply {
  repeated Plan plans = 1;
}

message CreateCheckoutRequest {
  string user_id = 1;
  string plan_id = 2;
  string provider = 3;
}

message CreateCheckoutReply {
  string order_id = 1;
  string payment_url = 2;
  string plan_id = 3;
  string provider = 4;
  string status = 5;
  string expires_at = 6;
}

message ConfirmSandboxPaymentRequest {
  string user_id = 1;
  string checkout_id = 2;
}

message ConfirmSandboxPaymentReply {
  string order_id = 1;
  string status = 2;
  Subscription subscription = 3;
  TokenBalance token_balance = 4;
}

message ConfirmSimulatedPaymentRequest {
  string user_id = 1;
  string checkout_id = 2;
}

message ConfirmSimulatedPaymentReply {
  string order_id = 1;
  string status = 2;
  Subscription subscription = 3;
  TokenBalance token_balance = 4;
}

message TokenBalance {
  string plan = 1;
  int64 quota_tokens = 2;
  int64 used_tokens = 3;
  int64 remaining_tokens = 4;
  string period_start = 5;
  string period_end = 6;
}

message GetSubscriptionRequest {
  string user_id = 1;
}

message ListOrdersRequest {
  string user_id = 1;
}

message ListOrdersReply {
  repeated Order orders = 1;
}

message GetOrderRequest {
  string user_id = 1;
  string order_id = 2;
}

message CancelSubscriptionRequest {
  string user_id = 1;
  string subscription_id = 2;
  bool immediate = 3;
}

message ResumeSubscriptionRequest {
  string user_id = 1;
  string subscription_id = 2;
  string idempotency_key = 3;
}

message ChangeSubscriptionPlanRequest {
  string user_id = 1;
  string subscription_id = 2;
  string plan_id = 3;
  string idempotency_key = 4;
}

message RequestRefundRequest {
  string user_id = 1;
  string subscription_id = 2;
  string reason = 3;
  string idempotency_key = 4;
}

message Subscription {
  string id = 1;
  string user_id = 2;
  string plan_id = 3;
  string status = 4;
  string current_period_start = 5;
  string current_period_end = 6;
  string plan_code = 7;
  bool cancel_at_period_end = 8;
  string canceled_at = 9;
  string scheduled_plan_code = 10;
  string scheduled_change_at = 11;
  string lifecycle_error = 12;
}

message Refund {
  string id = 1;
  string subscription_id = 2;
  string status = 3;
  string reason = 4;
  int64 used_tokens = 5;
  string quota_hold_status = 6;
  string failure_reason = 7;
  string created_at = 8;
  string resolved_at = 9;
}

message Order {
  string id = 1;
  string user_id = 2;
  string plan_id = 3;
  string plan_code = 4;
  string provider = 5;
  string status = 6;
  string amount = 7;
  string currency = 8;
  string payment_url = 9;
  string created_at = 10;
  string paid_at = 11;
  string subscription_id = 12;
  string expires_at = 13;
}

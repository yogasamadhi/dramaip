syntax = "proto3";

package dramaip.quota.service.v1;

option go_package = "github.com/dramaip/dramaip-platform/services/api/quota/service/v1;quotav1";

service QuotaService {
  rpc GetTokenBalance(GetTokenBalanceRequest) returns (TokenBalance);
  rpc CreatePeriodAccount(CreatePeriodAccountRequest) returns (TokenAccount);
  rpc ReserveTokens(ReserveTokensRequest) returns (TokenReservation);
  rpc SettleTokens(SettleTokensRequest) returns (TokenUsage);
  rpc CancelReservation(CancelReservationRequest) returns (TokenReservation);
  rpc ListTokenUsage(ListTokenUsageRequest) returns (ListTokenUsageReply);
  rpc GetUsageTrend(GetUsageTrendRequest) returns (GetUsageTrendReply);
}

message GetTokenBalanceRequest {
  string user_id = 1;
}

message TokenBalance {
  string plan = 1;
  int64 quota_tokens = 2;
  int64 used_tokens = 3;
  int64 remaining_tokens = 4;
  string period_start = 5;
  string period_end = 6;
}

message CreatePeriodAccountRequest {
  string user_id = 1;
  string subscription_id = 2;
  int64 quota_tokens = 3;
  string period_start = 4;
  string period_end = 5;
  string plan_code = 6;
  string plan_name = 7;
  string billing_period = 8;
  string plan_price = 9;
  string currency = 10;
  int64 max_rpm = 11;
  int64 max_context_tokens = 12;
  string model_level = 13;
  string plan_snapshot_source = 14;
  string plan_snapshot_at = 15;
}

message TokenAccount {
  string id = 1;
  string user_id = 2;
  string subscription_id = 3;
  int64 quota_tokens = 4;
  int64 used_tokens = 5;
}

message ReserveTokensRequest {
  string user_id = 1;
  string request_id = 2;
  int64 reserved_tokens = 3;
}

message TokenReservation {
  string id = 1;
  string token_account_id = 2;
  int64 reserved_tokens = 3;
  string status = 4;
  string subscription_id = 5;
  int64 current_used = 6;
  int64 current_quota = 7;
  string expires_at = 8;
}

message SettleTokensRequest {
  string reservation_id = 1;
  string request_id = 2;
  string model = 3;
  int64 prompt_tokens = 4;
  int64 completion_tokens = 5;
  // False means the provider completed but did not return trustworthy usage.
  // The quota service must retain the reservation until its safe fallback.
  bool usage_known = 6;
}

message CancelReservationRequest {
  string reservation_id = 1;
}

message TokenUsage {
  string id = 1;
  int64 total_tokens = 2;
  string request_id = 3;
  string model = 4;
  int64 prompt_tokens = 5;
  int64 completion_tokens = 6;
  string status = 7;
  string created_at = 8;
}

message ListTokenUsageRequest {
  string user_id = 1;
  int32 limit = 2;
}

message ListTokenUsageReply {
  repeated TokenUsage usage = 1;
}

message GetUsageTrendRequest {
  string user_id = 1;
  int32 days = 2;
}

message UsageTrendPoint {
  string date = 1;
  int64 total_tokens = 2;
}

message GetUsageTrendReply {
  repeated UsageTrendPoint points = 1;
}

syntax = "proto3";

package dramaip.reporting.service.v1;

option go_package = "github.com/dramaip/dramaip-platform/services/api/reporting/service/v1;reportingv1";

// ReportingService exposes only a rebuildable, event-derived operational read
// model. It intentionally does not expose any domain schema or financial
// ledger mutation to the Admin BFF.
service ReportingService {
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  rpc ListExceptions(ListExceptionsRequest) returns (ListExceptionsResponse);
  // ResolveException acknowledges a projection exception only. It never
  // changes the source event or any billing/quota ledger entry.
  rpc ResolveException(ResolveExceptionRequest) returns (ResolveExceptionResponse);
}

message GetOverviewRequest {}

message GetOverviewResponse {
  int64 user_count = 1;
  int64 paid_order_count = 2;
  int64 active_subscription_count = 3;
  int64 total_tokens = 4;
  int64 open_exception_count = 5;
  string last_event_at = 6;
}

message UserSummary {
  string user_id = 1;
  string first_seen_at = 2;
  string last_seen_at = 3;
  int64 total_tokens = 4;
  string last_plan_code = 5;
}

message ListUsersRequest {
  int32 limit = 1;
}
message ListUsersResponse {
  repeated UserSummary users = 1;
}

message OrderSummary {
  string order_id = 1;
  string user_id = 2;
  string plan_code = 3;
  string provider = 4;
  string amount = 5;
  string currency = 6;
  string status = 7;
  string subscription_id = 8;
  string updated_at = 9;
}

message ListOrdersRequest {
  int32 limit = 1;
}
message ListOrdersResponse {
  repeated OrderSummary orders = 1;
}

message SubscriptionSummary {
  string subscription_id = 1;
  string user_id = 2;
  string plan_code = 3;
  string status = 4;
  string period_start = 5;
  string period_end = 6;
  string updated_at = 7;
}

message ListSubscriptionsRequest {
  int32 limit = 1;
}
message ListSubscriptionsResponse {
  repeated SubscriptionSummary subscriptions = 1;
}

message ProjectionException {
  string id = 1;
  string event_id = 2;
  string event_type = 3;
  string status = 4;
  string summary = 5;
  string trace_id = 6;
  string created_at = 7;
  string resolved_at = 8;
  string resolved_by = 9;
  string resolution_reason = 10;
}

message ListExceptionsRequest {
  int32 limit = 1;
  bool include_resolved = 2;
}
message ListExceptionsResponse {
  repeated ProjectionException exceptions = 1;
}

message ResolveExceptionRequest {
  string exception_id = 1;
  string actor_id = 2;
  string reason = 3;
  string trace_id = 4;
}
message ResolveExceptionResponse {
  ProjectionException exception = 1;
}

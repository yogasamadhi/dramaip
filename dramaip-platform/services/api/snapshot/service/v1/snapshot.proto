syntax = "proto3";

package dramaip.snapshot.service.v1;

option go_package = "github.com/dramaip/dramaip-platform/services/api/snapshot/service/v1;snapshotv1";

// SnapshotService owns opaque, client-encrypted project snapshot envelopes.
// It never accepts a recovery key or interprets project-package plaintext.
service SnapshotService {
  rpc CreateProjectSnapshot(CreateProjectSnapshotRequest) returns (CreateProjectSnapshotResponse);
  rpc StartProjectSnapshotUpload(StartProjectSnapshotUploadRequest) returns (StartProjectSnapshotUploadResponse);
  rpc UploadProjectSnapshotChunk(UploadProjectSnapshotChunkRequest) returns (UploadProjectSnapshotChunkResponse);
  rpc CompleteProjectSnapshotUpload(CompleteProjectSnapshotUploadRequest) returns (CompleteProjectSnapshotUploadResponse);
  rpc ListProjectSnapshots(ListProjectSnapshotsRequest) returns (ListProjectSnapshotsResponse);
  rpc GetProjectSnapshot(GetProjectSnapshotRequest) returns (GetProjectSnapshotResponse);
  rpc DeleteProjectSnapshot(DeleteProjectSnapshotRequest) returns (DeleteProjectSnapshotResponse);
}

message ProjectSnapshot {
  string id = 1;
  int64 encrypted_bytes = 2;
  string encrypted_sha256 = 3;
  string created_at = 4;
  string expires_at = 5;
}

message CreateProjectSnapshotRequest {
  string user_id = 1;
  // A client-generated, retry-stable identifier. The same key may only name
  // the same encrypted envelope for one user.
  string idempotency_key = 2;
  bytes encrypted_envelope = 3;
}

message CreateProjectSnapshotResponse {
  ProjectSnapshot snapshot = 1;
}

// ProjectSnapshotUpload describes a short-lived, opaque ciphertext upload.
// The service never interprets the uploaded encrypted envelope.
message ProjectSnapshotUpload {
  string id = 1;
  int64 encrypted_bytes = 2;
  string encrypted_sha256 = 3;
  repeated int32 received_chunk_indexes = 4;
  string expires_at = 5;
  string created_at = 6;
}

message StartProjectSnapshotUploadRequest {
  string user_id = 1;
  // Retry-stable across all chunks and completion attempts.
  string idempotency_key = 2;
  int64 encrypted_bytes = 3;
  string encrypted_sha256 = 4;
}

message StartProjectSnapshotUploadResponse {
  // Set when the same idempotency key already completed successfully.
  ProjectSnapshot snapshot = 1;
  // Set while the client should continue uploading missing chunks.
  ProjectSnapshotUpload upload = 2;
}

message UploadProjectSnapshotChunkRequest {
  string user_id = 1;
  string upload_id = 2;
  int32 chunk_index = 3;
  bytes encrypted_chunk = 4;
  string encrypted_chunk_sha256 = 5;
}

message UploadProjectSnapshotChunkResponse {
  ProjectSnapshotUpload upload = 1;
}

message CompleteProjectSnapshotUploadRequest {
  string user_id = 1;
  string upload_id = 2;
}

message CompleteProjectSnapshotUploadResponse {
  ProjectSnapshot snapshot = 1;
}

message ListProjectSnapshotsRequest {
  string user_id = 1;
}

message ListProjectSnapshotsResponse {
  repeated ProjectSnapshot snapshots = 1;
}

message GetProjectSnapshotRequest {
  string user_id = 1;
  string snapshot_id = 2;
}

message GetProjectSnapshotResponse {
  ProjectSnapshot snapshot = 1;
  bytes encrypted_envelope = 2;
}

message DeleteProjectSnapshotRequest {
  string user_id = 1;
  string snapshot_id = 2;
}

message DeleteProjectSnapshotResponse {
  string snapshot_id = 1;
  string deleted_at = 2;
}

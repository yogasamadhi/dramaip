syntax = "proto3";

package dramaip.notification.job.v1;

option go_package = "github.com/dramaip/dramaip-platform/services/api/notification/job/v1;notificationjobv1";

// NotificationDeliveryOperationsService stays with notification-job because
// replaying a failed delivery must execute the same inbox and channel flow as
// normal event consumption. It is an internal mTLS-only Admin BFF boundary.
service NotificationDeliveryOperationsService {
  rpc ListDeliveryAttempts(ListDeliveryAttemptsRequest) returns (ListDeliveryAttemptsResponse);
  rpc RetryDelivery(RetryDeliveryRequest) returns (RetryDeliveryResponse);
}

message DeliveryAttempt {
  string id = 1;
  string event_id = 2;
  string notification_id = 3;
  string user_id = 4;
  string channel = 5;
  string status = 6;
  string failure = 7;
  string attempted_at = 8;
}

message ListDeliveryAttemptsRequest {
  string status = 1;
  int32 limit = 2;
}
message ListDeliveryAttemptsResponse { repeated DeliveryAttempt attempts = 1; }

message RetryDeliveryRequest {
  string delivery_attempt_id = 1;
  string actor_id = 2;
  string idempotency_key = 3;
}
message RetryDeliveryResponse {
  string event_id = 1;
  string notification_id = 2;
  string status = 3;
}

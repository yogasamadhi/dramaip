syntax = "proto3";

package dramaip.bff.mobile.interface.v1;

option go_package = "github.com/dramaip/dramaip-platform/services/api/bff/mobile/interface/v1;mobilebffv1";

// Contract owned by the Mobile BFF. The external HTTP adapter validates a
// mobile access token before it returns this deliberately small account view.
service MobileBffInterfaceService {
  rpc GetBrief(GetBriefRequest) returns (GetBriefResponse);
}

message GetBriefRequest {
  string user_id = 1;
}

// Mobile must not receive the Web account dashboard, orders, usage history or
// payment data. Draft/sync fields belong to the later LM3-29 contract.
message GetBriefResponse {
  string user_id = 1;
  string display_name = 2;
  string plan_code = 3;
  int64 remaining_tokens = 4;
}

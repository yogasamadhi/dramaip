syntax = "proto3";

package dramaip.user.service.v1;

option go_package = "github.com/dramaip/dramaip-platform/services/api/user/service/v1;userv1";

service UserService {
  rpc GetProfile(GetProfileRequest) returns (UserProfile);
  rpc EnsureProfile(EnsureProfileRequest) returns (UserProfile);
  rpc UpdateProfile(UpdateProfileRequest) returns (UserProfile);
  // Admin BFF only: mirrors the authoritative auth-account state into the
  // customer profile after its separate account-status domain write succeeds.
  rpc SetProfileStatus(SetProfileStatusRequest) returns (UserProfile);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesReply);
  rpc ListWorkspaceMembers(ListWorkspaceMembersRequest) returns (ListWorkspaceMembersReply);
  rpc ListWorkspaceInvitations(ListWorkspaceInvitationsRequest) returns (ListWorkspaceInvitationsReply);
  rpc InviteWorkspaceMember(InviteWorkspaceMemberRequest) returns (WorkspaceInvitation);
  rpc AcceptWorkspaceInvitation(AcceptWorkspaceInvitationRequest) returns (WorkspaceMember);
  rpc RevokeWorkspaceInvitation(RevokeWorkspaceInvitationRequest) returns (WorkspaceInvitation);
  rpc UpdateWorkspaceMemberRole(UpdateWorkspaceMemberRoleRequest) returns (WorkspaceMember);
  rpc RemoveWorkspaceMember(RemoveWorkspaceMemberRequest) returns (WorkspaceMember);
  // Billing BFF only: applies the immutable subscription entitlement snapshot.
  rpc SetWorkspacePlan(SetWorkspacePlanRequest) returns (Workspace);
}

message GetProfileRequest {
  string user_id = 1;
}

message UserProfile {
  string id = 1;
  string email = 2;
  string phone = 3;
  string status = 4;
  string display_name = 5;
  string avatar_url = 6;
  string locale = 7;
  string timezone = 8;
}

message EnsureProfileRequest {
  string user_id = 1;
  string email = 2;
  string phone = 3;
  string display_name = 4;
  string status = 5;
}

message UpdateProfileRequest {
  string user_id = 1;
  string phone = 2;
  string display_name = 3;
  string avatar_url = 4;
  string locale = 5;
  string timezone = 6;
}

message SetProfileStatusRequest {
  string user_id = 1;
  string status = 2;
  string operator_id = 3;
  string reason = 4;
  string idempotency_key = 5;
}

message Workspace {
  string id = 1;
  string owner_user_id = 2;
  string name = 3;
  string plan_code = 4;
  int32 included_seats = 5;
  int32 active_member_count = 6;
  int32 pending_invitation_count = 7;
  string current_user_role = 8;
  int64 review_storage_bytes = 9;
  int32 review_retention_days = 10;
}

message WorkspaceMember {
  string id = 1;
  string workspace_id = 2;
  string user_id = 3;
  string role = 4;
  string status = 5;
  string display_name = 6;
  string email = 7;
  string created_at = 8;
}

message WorkspaceInvitation {
  string id = 1;
  string workspace_id = 2;
  string email = 3;
  string role = 4;
  string invited_by = 5;
  string expires_at = 6;
  string accepted_by = 7;
  string accepted_at = 8;
  string revoked_at = 9;
  string created_at = 10;
  // Returned only once from InviteWorkspaceMember so SMTP-less deployments
  // can copy the invitation link. It is never persisted by the service.
  string token = 11;
}

message ListWorkspacesRequest {
  string user_id = 1;
}

message ListWorkspacesReply {
  repeated Workspace workspaces = 1;
}

message ListWorkspaceMembersRequest {
  string user_id = 1;
  string workspace_id = 2;
}

message ListWorkspaceMembersReply {
  repeated WorkspaceMember members = 1;
}

message ListWorkspaceInvitationsRequest {
  string user_id = 1;
  string workspace_id = 2;
}

message ListWorkspaceInvitationsReply {
  repeated WorkspaceInvitation invitations = 1;
}

message InviteWorkspaceMemberRequest {
  string user_id = 1;
  string workspace_id = 2;
  string email = 3;
  string role = 4;
  int32 expires_in_hours = 5;
}

message AcceptWorkspaceInvitationRequest {
  string user_id = 1;
  string token = 2;
}

message RevokeWorkspaceInvitationRequest {
  string user_id = 1;
  string workspace_id = 2;
  string invitation_id = 3;
}

message UpdateWorkspaceMemberRoleRequest {
  string user_id = 1;
  string workspace_id = 2;
  string member_user_id = 3;
  string role = 4;
}

message RemoveWorkspaceMemberRequest {
  string user_id = 1;
  string workspace_id = 2;
  string member_user_id = 3;
}

message SetWorkspacePlanRequest {
  string workspace_id = 1;
  string plan_code = 2;
  int32 included_seats = 3;
  int64 review_storage_bytes = 4;
  int32 review_retention_days = 5;
}

# Fluent Bit 采集配置：tail docker json-file 日志 → opensearch output 直连。
# 对应 docs/技术架构.md §12 日志支柱。security 禁用，故 opensearch output 无需凭证/tls。
#
# 注意：Fluent Bit 没有 `docker` filter 插件（易与 `kubernetes` filter 混淆）。
# 历史配置 [FILTER] Name docker 会导致启动失败：
#   [config] section 'docker' tried to instance a plugin name that doesn't exist
# 容器 json-file 日志用 tail + 内置 docker parser 解析即可。
# 若需在 Discover 按容器【名】（而非 ID）过滤，二选一：
#   1) 改用 docker `fluentbit` 日志驱动（Docker 自动附带 container_name/source 字段）；
#   2) 增加 Lua filter 经 docker.sock 查询容器名注入 record（需在 compose 重新挂载 sock）。
[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    Tag               docker.*
    Path_Key          source_file
    DB                /fluent-bit/state/flb_docker.db
    Refresh_Interval  5
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

[OUTPUT]
    Name               opensearch
    Match              *
    Host               opensearch
    Port               9200
    Index              dramaip-logs
    Logstash_Format    On
    Logstash_Prefix    dramaip-logs
    Suppress_Type_Name On
    tls                Off
    Retry_Limit        5

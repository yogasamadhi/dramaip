# Jaeger v2 配置：badger 落盘存储，持久化到 docker-data/jaeger。
# 基于 jaeger v2.17.0 官方 cmd/jaeger/config-badger.yaml 精简（去掉 archive 第二存储与 UI 自定义）。
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888      # jaeger 自身指标，供 prometheus 抓取（容器内，不必对外暴露）
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http: {}

  jaeger_query:
    storage:
      traces: badger_store

  jaeger_storage:
    backends:
      badger_store:
        badger:
          directories:
            keys: /badger/keys
            values: /badger/values
          ephemeral: false
          ttl:
            spans: 720h   # 30 天

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: badger_store

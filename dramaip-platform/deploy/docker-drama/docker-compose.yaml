# Java 本地开发编排：基础设施、数据库迁移、Gateway 与七个 Java 领域服务。
services:
  postgres:
    profiles: [java]
    container_name: drama-postgres
    image: postgres:18-alpine
    pull_policy: missing
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dramaip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dramaip}
      POSTGRES_DB: ${POSTGRES_DB:-dramaip}
    ports:
      - "5432:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    profiles: [java]
    container_name: drama-redis
    image: redis:8-alpine
    pull_policy: missing
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    profiles: [java]
    container_name: drama-rabbitmq
    image: rabbitmq:4.3-management-alpine
    pull_policy: missing
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dramaip}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dramaip}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./docker-data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      # rabbitmqctl status 在 management 镜像里可用且较轻。
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 6s
      retries: 12

  minio:
    profiles: [java]
    container_name: drama-minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: missing
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${REVIEW_S3_ACCESS_KEY:-dramaip-review}
      MINIO_ROOT_PASSWORD: ${REVIEW_S3_SECRET_KEY:-dramaip-review-development-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./docker-data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    profiles: [java]
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set review http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        mc mb --ignore-existing review/dramaip-review;
        mc anonymous set none review/dramaip-review;
        mc ilm rule rm --all --force review/dramaip-review || true;
        mc ilm rule add --expire-days 30 review/dramaip-review
    environment:
      MINIO_ROOT_USER: ${REVIEW_S3_ACCESS_KEY:-dramaip-review}
      MINIO_ROOT_PASSWORD: ${REVIEW_S3_SECRET_KEY:-dramaip-review-development-secret}

  # ─────────────────── 可观测性 ───────────────────
  # 三大支柱：traces/metrics 经 OTLP 推送到 otel-collector，
  # logs 走 stdout 由宿主 docker json-file 落盘、再由 Filebeat 采集。
  # 书写顺序≠启动顺序（启动由 depends_on 拓扑决定），这里按「排查优先级」排——
  # 接到告警后的典型动线：指标发现问题 → 链路定位服务 → 日志深挖到行。
  # 故顺序为 指标(Prometheus) → 链路(Jaeger + otel-collector) → 日志(Elastic Stack)
  # → 可视化前端(Grafana) 收尾。

  # ────── 指标 (Metrics)：拉模型抓取 + TSDB 存储（告警/排障第一站）──────
  prometheus:
    profiles: [observability]
    container_name: drama-prometheus
    image: prom/prometheus:v3.11.3
    pull_policy: missing
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ${DRAMAIP_PROMETHEUS_CONFIG:-./prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./docker-data/prometheus:/prometheus
      - ${DRAMAIP_PROMETHEUS_TARGETS_DIR:-../../server/target/local-dev/prometheus-targets}:/etc/prometheus/host-targets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d

  # ────── 链路追踪 (Tracing)：定位「哪个服务、哪一跳」出问题 ──────
  # 数据流：Java 服务 → otel-collector（中转）→ jaeger（存储/UI）。
  # otel-collector 横跨三支柱：traces 转发至 jaeger，metrics/logs 视
  # otel-collector/config.yaml 可下发到 Prometheus 或其他观测后端。
  otel-collector:
    profiles: [observability]
    container_name: drama-otel-collector
    image: otel/opentelemetry-collector-contrib:0.155.0
    pull_policy: missing
    command: ["--config", "/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"     # OTLP gRPC
      - "127.0.0.1:4318:4318"     # OTLP HTTP
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    profiles: [observability]
    # v2 基于 OTel Collector；v1(all-in-one) 已于 2025-12-31 EOL。
    # badger 落盘到 docker-data/jaeger（见 jaeger/config.yaml）。
    container_name: drama-jaeger
    image: jaegertracing/jaeger:2.17.0
    pull_policy: missing
    command: ["--config", "/jaeger/config.yaml"]
    ports:
      - "127.0.0.1:16686:16686"   # Jaeger UI（local development only）
    volumes:
      - ./jaeger/config.yaml:/jaeger/config.yaml:ro
      - ./docker-data/jaeger:/badger

  # ────── 日志 (Logging)：采集 → 存储/检索 → UI（深挖到「哪一行」）──────
  # Filebeat tail Docker json-file，并经 Docker socket 注入容器元数据；registry 卷持久化
  # 读取偏移，避免重启后重复采集。此配置仅用于本机开发，Elasticsearch 安全功能关闭。
  filebeat:
    profiles: [observability]
    container_name: drama-filebeat
    image: elastic/filebeat:9.4.2
    pull_policy: missing
    user: root
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        curl -fsS -X PUT http://elasticsearch:9200/_index_template/dramaip-logs-java \
          -H 'Content-Type: application/json' \
          --data-binary @/usr/share/filebeat/dramaip-java-index-template.json >/dev/null
        exec filebeat -e --strict.perms=false
    volumes:
      - ${DRAMAIP_FILEBEAT_CONFIG:-./filebeat/filebeat.yml}:/usr/share/filebeat/filebeat.yml:ro
      - ./filebeat/dramaip-java-index-template.json:/usr/share/filebeat/dramaip-java-index-template.json:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-data/filebeat:/usr/share/filebeat/data
      - ${DRAMAIP_HOST_LOG_DIR:-../../server/target/local-dev}:/var/log/dramaip:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Elasticsearch 存储/检索。此 Compose 服务仅用于本机开发：安全功能关闭且所有
  # 端口限制在 loopback。生产环境必须使用启用认证、TLS、索引生命周期和最小权限
  # 角色的受管/受控 Elastic 集群（见 docs/LOCAL_DEVELOPMENT.md）。
  elasticsearch:
    profiles: [observability]
    container_name: drama-elasticsearch
    image: elasticsearch:9.4.2
    pull_policy: missing
    environment:
      cluster.name: dramaip-logs
      node.name: drama-elasticsearch
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      # 256m keeps the full local Java + observability stack usable on the
      # default 8GB Docker Desktop allocation. Override for larger data sets.
      ES_JAVA_OPTS: "-Xms256m -Xmx256m -XX:MaxDirectMemorySize=128m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    # Leave headroom for Lucene off-heap segments while keeping the entire
    # local platform below Docker Desktop's common 8GB allocation.
    # The 256MB heap still needs native/Lucene/ML headroom. One GiB remains
    # well below the prior unbounded footprint and is stable alongside the
    # heap-bounded Java services on an 8GB Docker Desktop allocation.
    mem_limit: ${ELASTICSEARCH_MEM_LIMIT:-1g}
    ports:
      - "127.0.0.1:9200:9200"   # REST API（Kibana / Filebeat 连）
    volumes:
      - ./docker-data/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  kibana:
    profiles: [observability]
    container_name: drama-kibana
    image: kibana:9.4.2
    pull_policy: missing
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ────── 可视化前端：统一大盘，provisioning 同时接 Prometheus(指标,默认) + Elasticsearch(日志) ──────
  grafana:
    profiles: [observability]
    container_name: drama-grafana
    image: grafana/grafana:12.3.8
    pull_policy: missing
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-dramaip}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dramaip}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./docker-data/grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  # ─────────────────── Java 服务端 ───────────────────
  # 镜像未指定 platform，Docker Desktop 会为 Windows/amd64、macOS/arm64
  # 选择宿主机对应的多架构基础镜像；Java 服务本身从本地源码构建。
  # 从与运行中 Nacos 相同的镜像导出官方建表脚本。这样不需要在仓库中
  # 复制一份会随 Nacos 版本漂移的 SQL；MySQL 仅在空数据目录初始化时执行它。
  nacos-mysql-schema:
    profiles: [java]
    image: nacos/nacos-server:v3.1.1
    pull_policy: missing
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    # Compose does not apply shell parsing to a string `command`; pass one
    # complete script to `sh -ec` so cp receives both source and destination.
    command: ["cp /home/nacos/conf/mysql-schema.sql /nacos-schema/01-nacos-schema.sql"]
    volumes:
      - nacos-mysql-schema:/nacos-schema

  # Nacos 的持久化存储。mysql:8 由本机已有镜像满足，不会强制拉取。
  nacos-mysql:
    profiles: [java]
    container_name: drama-nacos-mysql
    image: mysql:8
    pull_policy: missing
    environment:
      MYSQL_DATABASE: ${NACOS_MYSQL_DATABASE:-nacos_config}
      MYSQL_USER: ${NACOS_MYSQL_USER:-nacos}
      MYSQL_PASSWORD: ${NACOS_MYSQL_PASSWORD:-nacos}
      MYSQL_ROOT_PASSWORD: ${NACOS_MYSQL_ROOT_PASSWORD:-nacos-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - ./docker-data/nacos-mysql:/var/lib/mysql
      - nacos-mysql-schema:/docker-entrypoint-initdb.d:ro
    depends_on:
      nacos-mysql-schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  nacos:
    image: nacos/nacos-server:v3.1.1
    profiles: [java]
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: nacos-mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: ${NACOS_MYSQL_DATABASE:-nacos_config}
      MYSQL_SERVICE_USER: ${NACOS_MYSQL_USER:-nacos}
      MYSQL_SERVICE_PASSWORD: ${NACOS_MYSQL_PASSWORD:-nacos}
      # mysql:8 currently uses caching_sha2_password by default. The Nacos
      # JDBC driver must retrieve the server key for this private Compose
      # network connection when TLS is disabled.
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true"
      # Nacos 3 validates this value even when local authentication is not
      # enabled. It is a development-only default; deployments inject it.
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-VGhpcy1pcy1hLWxvY2FsLWRldmVsb3BtZW50LXRva2VuLWNoYW5nZS1tZQ==}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-security}
      JVM_XMS: ${NACOS_JVM_XMS:-256m}
      JVM_XMX: ${NACOS_JVM_XMX:-256m}
      JVM_XMN: ${NACOS_JVM_XMN:-128m}
    # Cap memory so the standalone JVM does not balloon on a dev host; the
    # heap alone targets 256m, the rest covers metaspace + direct buffers.
    mem_limit: ${NACOS_MEM_LIMIT:-512m}
    # 8848 is the HTTP API, 8849 is the Nacos 3 console (container 8080), and
    # 9848 is the Nacos gRPC client channel needed by Java services on the host.
    ports: ["8848:8848", "8849:8080", "9848:9848"]
    depends_on:
      nacos-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v3/console/health/readiness >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  seata:
    image: apache/seata-server:2.7.0.jdk21
    profiles: [java]
    environment:
      SEATA_IP: seata
      SEATA_PORT: 8091
    # Seata's default heap easily exceeds 1GB without a cgroup limit. 768m is
    # ample for single-node dev and keeps Docker Desktop memory predictable.
    mem_limit: ${SEATA_MEM_LIMIT:-768m}
    ports: ["8091:8091"]

  java-migration:
    profiles: [java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: migration } }
    environment:
      # Eight Spring Boot JVMs plus the local Elastic stack run together in
      # observability mode. Bound each heap so Docker Desktop does not evict
      # Elasticsearch on an 8GB development allocation.
      JAVA_OPTS: "${JAVA_OPTS:--Xms64m -Xmx256m -XX:+UseG1GC}"
      POSTGRES_DSN: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dramaip}
      POSTGRES_USER: ${POSTGRES_USER:-dramaip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dramaip}
      HISTORICAL_MIGRATIONS_DIR: /app/historical-migrations
      HISTORICAL_MIGRATIONS_APPLY_PENDING: ${HISTORICAL_MIGRATIONS_APPLY_PENDING:-true}
      DB_ROLE_BOOTSTRAP: ${DB_ROLE_BOOTSTRAP:-true}
      DRAMAIP_MIGRATION_ROLE_PASSWORD: ${DRAMAIP_MIGRATION_ROLE_PASSWORD:-dramaip}
      OTEL_SERVICE_NAME: migration
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_TRACES_SAMPLER: always_on
      OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SERVER_REQUEST: ""
      OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_CLIENT_REQUEST: ""
      OTEL_INSTRUMENTATION_COMMON_DB_QUERY_SANITIZATION_ENABLED: "true"
      OTEL_JAVAAGENT_OPTS: ${OTEL_JAVAAGENT_OPTS:-}
    depends_on: { postgres: { condition: service_healthy } }

  java-gateway:
    profiles: [java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: gateway } }
    environment: &java-env
      JAVA_OPTS: "${JAVA_OPTS:--Xms64m -Xmx256m -XX:+UseG1GC}"
      NACOS_SERVER_ADDR: nacos:8848
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dramaip}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://identity:8080/.well-known/jwks.json}
      JWT_ENABLED: ${JWT_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3009,http://127.0.0.1:3009,http://localhost:3010,http://127.0.0.1:3010}
      DRAMAIP_INTERNAL_TOKEN: ${DRAMAIP_INTERNAL_TOKEN:-change-me-internal}
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_TRACES_SAMPLER: always_on
      OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SERVER_REQUEST: ""
      OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_CLIENT_REQUEST: ""
      OTEL_INSTRUMENTATION_COMMON_DB_QUERY_SANITIZATION_ENABLED: "true"
      OTEL_JAVAAGENT_OPTS: ${OTEL_JAVAAGENT_OPTS:-}
    ports: ["8080:8080"]
    depends_on: { nacos: { condition: service_healthy }, java-migration: { condition: service_completed_successfully } }

  identity:
    profiles: [java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: services/identity } }
    environment: &java-service-env
      JAVA_OPTS: "${JAVA_OPTS:--Xms64m -Xmx256m -XX:+UseG1GC}"
      POSTGRES_DSN: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dramaip}
      POSTGRES_PASSWORD: ${POSTGRES_IDENTITY_PASSWORD:-dramaip}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dramaip}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-dramaip}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-dramaip}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dramaip}
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-false}
      WEB_COOKIE_DOMAIN: ${WEB_COOKIE_DOMAIN:-}
      WEB_REFRESH_COOKIE_TTL: ${WEB_REFRESH_COOKIE_TTL:-720h}
      NACOS_SERVER_ADDR: nacos:8848
      SEATA_SERVER_ADDR: seata:8091
      JWT_ENABLED: ${JWT_ENABLED:-true}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://identity:8080/.well-known/jwks.json}
      DRAMAIP_INTERNAL_TOKEN: ${DRAMAIP_INTERNAL_TOKEN:-change-me-internal}
      IDENTITY_ALLOW_EPHEMERAL_JWT: ${IDENTITY_ALLOW_EPHEMERAL_JWT:-true}
      REVIEW_S3_ENDPOINT: ${REVIEW_S3_ENDPOINT:-http://minio:9000}
      REVIEW_S3_REGION: ${REVIEW_S3_REGION:-us-east-1}
      REVIEW_S3_BUCKET: ${REVIEW_S3_BUCKET:-dramaip-review}
      REVIEW_S3_ACCESS_KEY: ${REVIEW_S3_ACCESS_KEY:-dramaip-review}
      REVIEW_S3_SECRET_KEY: ${REVIEW_S3_SECRET_KEY:-dramaip-review-development-secret}
      REVIEW_S3_ALLOW_INSECURE: ${REVIEW_S3_ALLOW_INSECURE:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_TRACES_SAMPLER: always_on
      OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SERVER_REQUEST: ""
      OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_CLIENT_REQUEST: ""
      OTEL_INSTRUMENTATION_COMMON_DB_QUERY_SANITIZATION_ENABLED: "true"
      OTEL_JAVAAGENT_OPTS: ${OTEL_JAVAAGENT_OPTS:-}
      OTEL_SERVICE_NAME: identity
    depends_on: { java-migration: { condition: service_completed_successfully }, nacos: { condition: service_healthy } }

  java-notification:
    profiles: [java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: services/notification } }
    environment:
      <<: *java-service-env
      POSTGRES_USER: dramaip_notification_svc
      POSTGRES_PASSWORD: ${POSTGRES_NOTIFICATION_SVC_PASSWORD:-dramaip}
      OTEL_SERVICE_NAME: notification
    depends_on: { java-migration: { condition: service_completed_successfully }, nacos: { condition: service_healthy } }

  java-reporting:
    profiles: [java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: services/reporting } }
    environment:
      <<: *java-service-env
      POSTGRES_USER: dramaip_reporting_svc
      POSTGRES_PASSWORD: ${POSTGRES_REPORTING_SVC_PASSWORD:-dramaip}
      OTEL_SERVICE_NAME: reporting
    depends_on: { java-migration: { condition: service_completed_successfully }, nacos: { condition: service_healthy } }

  creation:
    profiles: [java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: services/creation } }

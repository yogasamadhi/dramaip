# 全栈本地开发编排：基础设施 + 8 个 Go 微服务 + Kong + 可观测性。
#
# 8 个 Go 服务统一用 services/Dockerfile.service + build.args.TARGET 构建，
# 与 K8s chart（deploy/helm/dramaip-platform/templates/deployment.yaml）同源。
# 修改 Go 代码后用 `make mvp-up`（即 docker compose up -d --build）重建。
#
# 服务间 gRPC 走 compose 内部 DNS（如 bff → auth:9101）；下游服务的
# 8101–8107 / 9101–9105 不映射到主机，外部访问统一经 Kong :8000 → bff:8100。

# 共享锚点：所有 app 服务都继承这套通用 env + 重启策略 + 基础依赖。
x-app-common: &app-common
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    otel-collector:
      condition: service_started
  environment: &app-env
    ENV: dev
    LOG_LEVEL: debug
    TIMEZONE: Asia/Shanghai
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: dramaip
    POSTGRES_PASSWORD: dramaip
    POSTGRES_DB: dramaip
    POSTGRES_SSLMODE: disable
    # Compose uses the one-shot migrate service. AUTO_MIGRATE remains a local
    # single-service fallback and is disabled in the full stack.
    AUTO_MIGRATE: "false"
    BFF_AUTO_MIGRATE: "false"
    MIGRATIONS_DIR: /app/migrations
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

services:
  postgres:
    container_name: drama-postgres
    image: postgres:18-alpine
    pull_policy: missing
    environment:
      POSTGRES_USER: dramaip
      POSTGRES_PASSWORD: dramaip
      POSTGRES_DB: dramaip
    ports:
      - "5432:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dramaip -d dramaip"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    container_name: drama-redis
    image: redis:8-alpine
    pull_policy: missing
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    container_name: drama-rabbitmq
    image: rabbitmq:4.3-management-alpine
    pull_policy: missing
    environment:
      RABBITMQ_DEFAULT_USER: dramaip
      RABBITMQ_DEFAULT_PASS: dramaip
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./docker-data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      # rabbitmqctl status 在 management 镜像里可用且较轻。
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 6s
      retries: 12

  # ─────────────────────────── Go 微服务 ───────────────────────────

  migrate:
    container_name: drama-migrate
    image: dramaip-migrate
    build:
      context: ../../services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/migration/job/cmd/server
        OUTPUT: dramaip-migrate
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: dramaip-migrate
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    <<: *app-common
    container_name: drama-auth
    image: dramaip-auth
    build:
      context: ../../services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/auth/service/cmd/server
        OUTPUT: dramaip-auth
    environment:
      <<: *app-env
      AUTH_HTTP_ADDR: ":8101"
      AUTH_GRPC_ADDR: ":9101"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: dramaip
      REDIS_DB: "0"
      JWT_ISSUER: dramaip
      JWT_ACCESS_SECRET: dramaip-dev-access-secret-change-me
      JWT_REFRESH_SECRET: dramaip-dev-refresh-secret-change-me
      JWT_ACCESS_TTL: "900"
      JWT_REFRESH_TTL: "2592000"
      OTEL_SERVICE_NAME: dramaip-auth
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  user:
    <<: *app-common
    container_name: drama-user
    image: dramaip-user
    build:
      context: ../../services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/user/service/cmd/server
        OUTPUT: dramaip-user
    environment:
      <<: *app-env
      USER_HTTP_ADDR: ":8102"
      USER_GRPC_ADDR: ":9102"
      OTEL_SERVICE_NAME: dramaip-user

  billing:
    <<: *app-common
    container_name: drama-billing
    image: dramaip-billing
    build:
      context: ../../services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/billing/service/cmd/server
        OUTPUT: dramaip-billing
    environment:
      <<: *app-env
      BILLING_HTTP_ADDR: ":8103"
      BILLING_GRPC_ADDR: ":9103"
      OTEL_SERVICE_NAME: dramaip-billing

  quota:
    <<: *app-common
    container_name: drama-quota
    image: dramaip-quota
    build:
      context: ../../services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/quota/service/cmd/server
        OUTPUT: dramaip-quota
    environment:
      <<: *app-env
      QUOTA_HTTP_ADDR: ":8104"
      QUOTA_GRPC_ADDR: ":9104"
      OTEL_SERVICE_NAME: dramaip-quota

  ai-gateway:
    <<: *app-common
    container_name: drama-ai-gateway
    image: dramaip-ai-gateway
    build:
      context: ../../services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/ai_gateway/service/cmd/server
        OUTPUT: dramaip-ai-gateway
    environment:
      <<: *app-env
      AI_GATEWAY_HTTP_ADDR: ":8105"
      AI_GATEWAY_GRPC_ADDR: ":9105"
      # ai-gateway 调用 quota（ReserveTokens/SettleTokens ...）。
      QUOTA_GRPC_ENDPOINT: quota:9104
      AI_PROVIDER_DEFAULT: openai-compatible
      AI_PROVIDER_TIMEOUT_SECONDS: "90"
      # 占位：真 key 走 .env 或运行时注入，留空则 Chat 会返回错误。
      AI_PROVIDER_API_KEY: ""
      AI_PROVIDER_BASE_URL: https://api.openai.com/v1
      AI_DEFAULT_MODEL: gpt-4o-mini
      OTEL_SERVICE_NAME: dramaip-ai-gateway

  billing-job:
    <<: *app-common
    container_name: drama-billing-job
    image: dramaip-billing-job
    build:
      context: ../../services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/billing/job/cmd/server
        OUTPUT: dramaip-billing-job
    environment:
      <<: *app-env
      BILLING_JOB_HTTP_ADDR: ":8106"
      OUTBOX_POLL_INTERVAL_MS: "1000"
      OUTBOX_BATCH_SIZE: "100"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: dramaip
      RABBITMQ_PASSWORD: dramaip
      RABBITMQ_VHOST: "/"
      RABBITMQ_EVENTS_QUEUE: dramaip.mvp.events
      OTEL_SERVICE_NAME: dramaip-billing-job
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  quota-job:
    <<: *app-common
    container_name: drama-quota-job
    image: dramaip-quota-job
    build:
      context: ../../services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/quota/job/cmd/server
        OUTPUT: dramaip-quota-job
    environment:
      <<: *app-env
      QUOTA_JOB_HTTP_ADDR: ":8107"
      QUOTA_JOB_TICK_SECONDS: "60"
      OTEL_SERVICE_NAME: dramaip-quota-job

  bff:
    <<: *app-common
    container_name: drama-bff
    image: dramaip-bff
    build:
      context: ../../services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/bff/interface/cmd/server
        OUTPUT: dramaip-bff
    environment:
      <<: *app-env
      # BFF 自己只读这 6 个变量；POSTGRES/REDIS/JWT/MIGRATIONS 归下游服务。
      BFF_HTTP_ADDR: ":8100"
      AUTH_GRPC_ENDPOINT: auth:9101
      USER_GRPC_ENDPOINT: user:9102
      BILLING_GRPC_ENDPOINT: billing:9103
      QUOTA_GRPC_ENDPOINT: quota:9104
      AI_GATEWAY_GRPC_ENDPOINT: ai-gateway:9105
      OTEL_SERVICE_NAME: dramaip-bff

  # Application external entry — the ONLY API service clients may reach from outside.
  # (postgres/redis/rabbitmq/prometheus/grafana/jaeger below are dev-time
  # infra ports; in prod (k8s) everything collapses to exposing Kong alone.)
  kong:
    container_name: drama-kong
    image: kong:3.9-ubuntu
    pull_policy: missing
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ../kong/kong.yml:/kong/declarative/kong.yml:ro
    depends_on:
      - bff

  prometheus:
    container_name: drama-prometheus
    image: prom/prometheus:v3.11.3
    pull_policy: missing
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker-data/prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d

  jaeger:
    # v2 基于 OTel Collector；v1(all-in-one) 已于 2025-12-31 EOL。
    # badger 落盘到 docker-data/jaeger（见 jaeger/config.yaml）。
    container_name: drama-jaeger
    image: jaegertracing/jaeger:2.17.0
    pull_policy: missing
    command: ["--config", "/jaeger/config.yaml"]
    ports:
      - "16686:16686"   # Jaeger UI
    volumes:
      - ./jaeger/config.yaml:/jaeger/config.yaml:ro
      - ./docker-data/jaeger:/badger

  otel-collector:
    container_name: drama-otel-collector
    image: otel/opentelemetry-collector-contrib:0.155.0
    pull_policy: missing
    command: ["--config", "/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"     # OTLP gRPC（Kratos OTel exporter 发往这里）
      - "4318:4318"     # OTLP HTTP
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger

  grafana:
    container_name: drama-grafana
    image: grafana/grafana:12.3.8
    pull_policy: missing
    environment:
      GF_SECURITY_ADMIN_USER: dramaip
      GF_SECURITY_ADMIN_PASSWORD: dramaip
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker-data/grafana:/var/lib/grafana
    depends_on:
      - prometheus

  # 可观测性 · 日志支柱：OpenSearch 存储/检索（Fluent Bit 采集，见下方 fluent-bit service）。
  # security plugin 禁用（dev/内网起步最简，Dashboards 免认证直连）；生产环境再开。
  opensearch:
    container_name: drama-opensearch
    image: opensearchproject/opensearch:3.6.0
    pull_policy: missing
    environment:
      cluster.name: dramaip-logs
      node.name: drama-opensearch
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Dramaip@2026"   # 兜底：3.x 镜像 entrypoint 即便 security 禁用也可能强制检查
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"   # REST API（Dashboards / Fluent Bit 连）
      - "9600:9600"   # 性能指标，留作后续 prometheus 抓
    volumes:
      - ./docker-data/opensearch:/usr/share/opensearch/data

  opensearch-dashboards:
    container_name: drama-opensearch-dashboards
    image: opensearchproject/opensearch-dashboards:3.6.0
    pull_policy: missing
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"   # 配合 OS 侧 plugins.security.disabled=true，移除登录页与 tenantinfo 400
    ports:
      - "5601:5601"
    depends_on:
      - opensearch

  # 日志采集：tail docker json-file + opensearch output 直连（无认证）。
  # 注：Fluent Bit 无 `docker` filter 插件；容器【名】需改用 fluentbit 日志驱动或 Lua 注入。
  # 挂宿主 /var/lib/docker/containers 是采集容器日志的标配；state 卷持久化 tail DB 偏移，
  # 避免 fluent-bit 重启后从头重读 → OpenSearch 日志重复。
  fluent-bit:
    container_name: drama-fluent-bit
    image: fluent/fluent-bit:5.0.8
    pull_policy: missing
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./docker-data/fluent-bit:/fluent-bit/state
    depends_on:
      - opensearch

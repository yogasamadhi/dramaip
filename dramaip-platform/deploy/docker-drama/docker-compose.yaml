# Java 本地开发编排：基础设施、数据库迁移、Gateway 与六个 Java 领域服务。
# `docker compose --profile java up -d --build` 只启动 Java 运行时；legacy/mixed
# profile 仅保留在迁移归档期，待 Kratos 源码移除后会一并清理。

# 共享锚点：所有 app 服务都继承这套通用 env + 重启策略 + 基础依赖。
x-app-common: &app-common
  profiles: [legacy, mixed]
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    otel-collector:
      condition: service_started
  environment: &app-env
    ENV: ${ENV:-dev}
    LOG_LEVEL: ${LOG_LEVEL:-debug}
    TIMEZONE: ${TIMEZONE:-Asia/Shanghai}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:-dramaip}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dramaip}
    POSTGRES_DB: ${POSTGRES_DB:-dramaip}
    POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
    # Compose uses the one-shot migrate service. AUTO_MIGRATE remains a local
    # single-service fallback and is disabled in the full stack.
    AUTO_MIGRATE: "false"
    MIGRATIONS_DIR: /app/migrations
    WEB_REFRESH_COOKIE_TTL: ${WEB_REFRESH_COOKIE_TTL:-720h}
    WEB_COOKIE_DOMAIN: ${WEB_COOKIE_DOMAIN:-}
    GRPC_MTLS_ENABLED: ${GRPC_MTLS_ENABLED:-false}
    GRPC_MTLS_CERT_FILE: ${GRPC_MTLS_CERT_FILE:-}
    GRPC_MTLS_KEY_FILE: ${GRPC_MTLS_KEY_FILE:-}
    GRPC_MTLS_CA_FILE: ${GRPC_MTLS_CA_FILE:-}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    # Every internal RPC gets a finite client/server deadline. AI chat receives
    # a separate budget so it can contain the Provider timeout without making
    # ordinary auth/quota/billing calls wait for it.
    GRPC_REQUEST_TIMEOUT: ${GRPC_REQUEST_TIMEOUT:-10s}
    AI_RPC_TIMEOUT: ${AI_RPC_TIMEOUT:-95s}

services:
  postgres:
    profiles: [legacy, mixed, java]
    container_name: drama-postgres
    image: postgres:18-alpine
    pull_policy: missing
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dramaip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dramaip}
      POSTGRES_DB: ${POSTGRES_DB:-dramaip}
    ports:
      - "5432:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    profiles: [legacy, mixed, java]
    container_name: drama-redis
    image: redis:8-alpine
    pull_policy: missing
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    profiles: [legacy, mixed, java]
    container_name: drama-rabbitmq
    image: rabbitmq:4.3-management-alpine
    pull_policy: missing
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dramaip}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dramaip}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./docker-data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      # rabbitmqctl status 在 management 镜像里可用且较轻。
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 6s
      retries: 12

  minio:
    profiles: [legacy, mixed, java]
    container_name: drama-minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: missing
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${REVIEW_S3_ACCESS_KEY:-dramaip-review}
      MINIO_ROOT_PASSWORD: ${REVIEW_S3_SECRET_KEY:-dramaip-review-development-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./docker-data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    profiles: [legacy, mixed, java]
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set review http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        mc mb --ignore-existing review/dramaip-review;
        mc anonymous set none review/dramaip-review;
        mc ilm rule rm --all --force review/dramaip-review || true;
        mc ilm rule add --expire-days 30 review/dramaip-review
    environment:
      MINIO_ROOT_USER: ${REVIEW_S3_ACCESS_KEY:-dramaip-review}
      MINIO_ROOT_PASSWORD: ${REVIEW_S3_SECRET_KEY:-dramaip-review-development-secret}

  # ─────────────────────────── Go 微服务 ───────────────────────────

  migrate:
    profiles: [legacy, mixed]
    container_name: drama-migrate
    image: dramaip-migrate
    build:
      context: ../../legacy/go-services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/migration/job/cmd/server
        OUTPUT: dramaip-migrate
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: dramaip-migrate
      # The one-shot migration job is the only process that receives the DDL
      # identity and the bootstrap passwords for all runtime database roles.
      DB_ROLE_BOOTSTRAP: ${DB_ROLE_BOOTSTRAP:-true}
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-dramaip}
      POSTGRES_USER_PROFILE_PASSWORD: ${POSTGRES_USER_PROFILE_PASSWORD:-dramaip}
      POSTGRES_BILLING_PASSWORD: ${POSTGRES_BILLING_PASSWORD:-dramaip}
      POSTGRES_QUOTA_PASSWORD: ${POSTGRES_QUOTA_PASSWORD:-dramaip}
      POSTGRES_AI_GATEWAY_PASSWORD: ${POSTGRES_AI_GATEWAY_PASSWORD:-dramaip}
      POSTGRES_NOTIFICATION_PASSWORD: ${POSTGRES_NOTIFICATION_PASSWORD:-dramaip}
      POSTGRES_INSPIRATION_PASSWORD: ${POSTGRES_INSPIRATION_PASSWORD:-dramaip}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-dramaip}
      POSTGRES_REPORTING_PASSWORD: ${POSTGRES_REPORTING_PASSWORD:-dramaip}
      POSTGRES_SNAPSHOT_PASSWORD: ${POSTGRES_SNAPSHOT_PASSWORD:-dramaip}
      POSTGRES_REVIEW_PASSWORD: ${POSTGRES_REVIEW_PASSWORD:-dramaip}
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    <<: *app-common
    container_name: drama-auth
    image: dramaip-auth
    build:
      context: ../../legacy/go-services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/auth/service/cmd/server
        OUTPUT: dramaip-auth
    environment:
      <<: *app-env
      POSTGRES_USER: dramaip_auth
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-dramaip}
      AUTH_HTTP_ADDR: ":8101"
      AUTH_GRPC_ADDR: ":9101"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dramaip}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_ISSUER: ${JWT_ISSUER:-dramaip}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-dramaip-api}
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:-}
      JWT_PRIVATE_KEY_FILE: ${JWT_PRIVATE_KEY_FILE:-}
      JWT_JWKS_FILE: ${JWT_JWKS_FILE:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-2592000}
      AUTH_EMAIL_DELIVERY_URL: ${AUTH_EMAIL_DELIVERY_URL:-}
      AUTH_EMAIL_DELIVERY_TOKEN: ${AUTH_EMAIL_DELIVERY_TOKEN:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      AUTH_EMAIL_TIMEOUT: ${AUTH_EMAIL_TIMEOUT:-10s}
      OTEL_SERVICE_NAME: dramaip-auth
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  user:
    <<: *app-common
    container_name: drama-user
    image: dramaip-user
    build:
      context: ../../legacy/go-services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/user/service/cmd/server
        OUTPUT: dramaip-user
    environment:
      <<: *app-env
      POSTGRES_USER: dramaip_user
      POSTGRES_PASSWORD: ${POSTGRES_USER_PROFILE_PASSWORD:-dramaip}
      USER_HTTP_ADDR: ":8102"
      USER_GRPC_ADDR: ":9102"
      OTEL_SERVICE_NAME: dramaip-user

  billing:
    <<: *app-common
    container_name: drama-billing
    image: dramaip-billing
    build:
      context: ../../legacy/go-services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/billing/service/cmd/server
        OUTPUT: dramaip-billing
    environment:
      <<: *app-env
      POSTGRES_USER: dramaip_billing
      POSTGRES_PASSWORD: ${POSTGRES_BILLING_PASSWORD:-dramaip}
      BILLING_HTTP_ADDR: ":8103"
      BILLING_GRPC_ADDR: ":9103"
      QUOTA_GRPC_ENDPOINT: quota:9104
      BILLING_QUOTA_DIAL_TIMEOUT: ${BILLING_QUOTA_DIAL_TIMEOUT:-10s}
      # Kept disabled by default. Sandbox credentials and certificate paths are
      # supplied from legacy/go-services/.env or an operator-managed override; no secret
      # is committed to Compose.
      WECHAT_PAY_ENABLED: ${WECHAT_PAY_ENABLED:-false}
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:-}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_CERT_SERIAL: ${WECHAT_PAY_CERT_SERIAL:-}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH:-}
      WECHAT_PAY_PLATFORM_CERT_SERIAL: ${WECHAT_PAY_PLATFORM_CERT_SERIAL:-}
      WECHAT_PAY_PLATFORM_CERT_PATH: ${WECHAT_PAY_PLATFORM_CERT_PATH:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      WECHAT_PAY_API_BASE_URL: ${WECHAT_PAY_API_BASE_URL:-https://api.mch.weixin.qq.com}
      ALIPAY_ENABLED: ${ALIPAY_ENABLED:-false}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_SELLER_ID: ${ALIPAY_SELLER_ID:-}
      ALIPAY_PRIVATE_KEY_PATH: ${ALIPAY_PRIVATE_KEY_PATH:-}
      ALIPAY_PUBLIC_KEY_PATH: ${ALIPAY_PUBLIC_KEY_PATH:-}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-https://openapi.alipay.com/gateway.do}
      OTEL_SERVICE_NAME: dramaip-billing

  quota:
    <<: *app-common
    container_name: drama-quota
    image: dramaip-quota
    build:
      context: ../../legacy/go-services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/quota/service/cmd/server
        OUTPUT: dramaip-quota
    environment:
      <<: *app-env
      POSTGRES_USER: dramaip_quota
      POSTGRES_PASSWORD: ${POSTGRES_QUOTA_PASSWORD:-dramaip}
      QUOTA_HTTP_ADDR: ":8104"
      QUOTA_GRPC_ADDR: ":9104"
      OTEL_SERVICE_NAME: dramaip-quota

  ai-gateway:
    <<: *app-common
    container_name: drama-ai-gateway
    image: dramaip-ai-gateway
    build:
      context: ../../legacy/go-services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/ai_gateway/service/cmd/server
        OUTPUT: dramaip-ai-gateway
    environment:
      <<: *app-env
      POSTGRES_USER: dramaip_ai_gateway
      POSTGRES_PASSWORD: ${POSTGRES_AI_GATEWAY_PASSWORD:-dramaip}
      AI_GATEWAY_HTTP_ADDR: ":8105"
      AI_GATEWAY_GRPC_ADDR: ":9105"
      # ai-gateway 调用 quota（ReserveTokens/SettleTokens ...）。
      QUOTA_GRPC_ENDPOINT: quota:9104
      AI_PROVIDER_DEFAULT: ${AI_PROVIDER_DEFAULT:-openai-compatible}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-90}
      AI_PROVIDER_MAX_CONCURRENCY: ${AI_PROVIDER_MAX_CONCURRENCY:-8}
      AI_PROVIDER_CIRCUIT_FAILURES: ${AI_PROVIDER_CIRCUIT_FAILURES:-3}
      AI_PROVIDER_CIRCUIT_RESET: ${AI_PROVIDER_CIRCUIT_RESET:-15s}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://api.openai.com/v1}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-gpt-4o-mini}
      AI_PROVIDERS: ${AI_PROVIDERS:-openai-compatible}
      AI_TEST_PROVIDER_ENABLED: ${AI_TEST_PROVIDER_ENABLED:-true}
      AI_PROVIDER_OPENAI_COMPATIBLE_GPT_4O_MINI_INPUT_PRICE_PER_MILLION: ${AI_PROVIDER_OPENAI_COMPATIBLE_GPT_4O_MINI_INPUT_PRICE_PER_MILLION:-}
      AI_PROVIDER_OPENAI_COMPATIBLE_GPT_4O_MINI_OUTPUT_PRICE_PER_MILLION: ${AI_PROVIDER_OPENAI_COMPATIBLE_GPT_4O_MINI_OUTPUT_PRICE_PER_MILLION:-}
      AI_PROVIDER_OPENAI_COMPATIBLE_GPT_4O_MINI_CURRENCY: ${AI_PROVIDER_OPENAI_COMPATIBLE_GPT_4O_MINI_CURRENCY:-USD}
      AI_PROVIDER_OPENAI_COMPATIBLE_GPT_4O_MINI_EXCHANGE_RATE_TO_CNY: ${AI_PROVIDER_OPENAI_COMPATIBLE_GPT_4O_MINI_EXCHANGE_RATE_TO_CNY:-}
      AI_COST_WINDOW: ${AI_COST_WINDOW:-5m}
      AI_USER_COST_LIMIT_CNY: ${AI_USER_COST_LIMIT_CNY:-5}
      AI_IP_COST_LIMIT_CNY: ${AI_IP_COST_LIMIT_CNY:-20}
      AI_REQUEST_COST_ALERT_CNY: ${AI_REQUEST_COST_ALERT_CNY:-1}
      OTEL_SERVICE_NAME: dramaip-ai-gateway

  notification:
    <<: *app-common
    container_name: drama-notification
    image: dramaip-notification
    build:
      context: ../../legacy/go-services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/notification/service/cmd/server
        OUTPUT: dramaip-notification
    environment:
      <<: *app-env
      POSTGRES_USER: dramaip_notification
      POSTGRES_PASSWORD: ${POSTGRES_NOTIFICATION_PASSWORD:-dramaip}
      NOTIFICATION_HTTP_ADDR: ":8108"
      NOTIFICATION_GRPC_ADDR: ":9106"
      OTEL_SERVICE_NAME: dramaip-notification

  # The handoff service owns only short mobile drafts and adoption audit rows;
  # it is deliberately not a general project-sync or document merge service.
  inspiration:
    <<: *app-common
    container_name: drama-inspiration
    image: dramaip-inspiration
    build:
      context: ../../legacy/go-services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/inspiration/service/cmd/server
        OUTPUT: dramaip-inspiration
    environment:
      <<: *app-env
      POSTGRES_USER: dramaip_inspiration
      POSTGRES_PASSWORD: ${POSTGRES_INSPIRATION_PASSWORD:-dramaip}
      INSPIRATION_HTTP_ADDR: ":8111"
      INSPIRATION_GRPC_ADDR: ":9107"
      OTEL_SERVICE_NAME: dramaip-inspiration

  # Snapshot owns opaque end-to-end encrypted project envelopes only. The
  # recovery key never leaves the Desktop device and is not an environment
  # secret for this service.
  snapshot:
    <<: *app-common
    container_name: drama-snapshot
    image: dramaip-snapshot
    build:
      context: ../../legacy/go-services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/snapshot/service/cmd/server
        OUTPUT: dramaip-snapshot
    environment:
      <<: *app-env
      POSTGRES_USER: dramaip_snapshot
      POSTGRES_PASSWORD: ${POSTGRES_SNAPSHOT_PASSWORD:-dramaip}
      SNAPSHOT_HTTP_ADDR: ":8114"
      SNAPSHOT_GRPC_ADDR: ":9109"
      OTEL_SERVICE_NAME: dramaip-snapshot

  review:
    <<: *app-common
    container_name: drama-review
    image: dramaip-review
    build:
      context: ../../legacy/go-services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/review/service/cmd/server
        OUTPUT: dramaip-review
    environment:
      <<: *app-env
      POSTGRES_USER: dramaip_review
      POSTGRES_PASSWORD: ${POSTGRES_REVIEW_PASSWORD:-dramaip}
      REVIEW_HTTP_ADDR: ":8115"
      REVIEW_GRPC_ADDR: ":9112"
      USER_GRPC_ENDPOINT: user:9102
      REVIEW_S3_ENDPOINT: http://minio:9000
      REVIEW_S3_REGION: us-east-1
      REVIEW_S3_BUCKET: dramaip-review
      REVIEW_S3_ACCESS_KEY: ${REVIEW_S3_ACCESS_KEY:-dramaip-review}
      REVIEW_S3_SECRET_KEY: ${REVIEW_S3_SECRET_KEY:-dramaip-review-development-secret}
      OTEL_SERVICE_NAME: dramaip-review
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      user:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  # Reporting is a read-model service. It consumes only durable public events
  # through reporting-job and never receives any domain schema credential.
  reporting:
    <<: *app-common
    container_name: drama-reporting
    image: dramaip-reporting
    build:
      context: ../../legacy/go-services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/reporting/service/cmd/server
        OUTPUT: dramaip-reporting
    environment:
      <<: *app-env
      POSTGRES_USER: dramaip_reporting
      POSTGRES_PASSWORD: ${POSTGRES_REPORTING_PASSWORD:-dramaip}
      REPORTING_HTTP_ADDR: ":8112"
      REPORTING_GRPC_ADDR: ":9108"
      OTEL_SERVICE_NAME: dramaip-reporting

  notification-job:
    <<: *app-common
    container_name: drama-notification-job
    image: dramaip-notification-job
    build:
      context: ../../legacy/go-services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/notification/job/cmd/server
        OUTPUT: dramaip-notification-job
    environment:
      <<: *app-env
      POSTGRES_USER: dramaip_notification
      POSTGRES_PASSWORD: ${POSTGRES_NOTIFICATION_PASSWORD:-dramaip}
      NOTIFICATION_JOB_HTTP_ADDR: ":8109"
      NOTIFICATION_JOB_GRPC_ADDR: ":9111"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-dramaip}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dramaip}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-dramaip.platform.events}
      RABBITMQ_EVENTS_QUEUE: ${RABBITMQ_EVENTS_QUEUE:-dramaip.platform.events}
      NOTIFICATION_EVENTS_QUEUE: ${NOTIFICATION_EVENTS_QUEUE:-dramaip.notification.events}
      NOTIFICATION_DLQ_EXCHANGE: ${NOTIFICATION_DLQ_EXCHANGE:-dramaip.platform.events.dlx}
      NOTIFICATION_DLQ_QUEUE: ${NOTIFICATION_DLQ_QUEUE:-dramaip.notification.events.dlq}
      NOTIFICATION_EVENT_PREFETCH: ${NOTIFICATION_EVENT_PREFETCH:-1}
      NOTIFICATION_EVENT_MAX_RETRIES: ${NOTIFICATION_EVENT_MAX_RETRIES:-3}
      NOTIFICATION_INBOX_LEASE: ${NOTIFICATION_INBOX_LEASE:-1m}
      NOTIFICATION_CHANNELS: ${NOTIFICATION_CHANNELS:-in_app}
      OTEL_SERVICE_NAME: dramaip-notification-job
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  reporting-job:
    <<: *app-common
    container_name: drama-reporting-job
    image: dramaip-reporting-job
    build:
      context: ../../legacy/go-services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/reporting/job/cmd/server
        OUTPUT: dramaip-reporting-job
    environment:
      <<: *app-env
      POSTGRES_USER: dramaip_reporting
      POSTGRES_PASSWORD: ${POSTGRES_REPORTING_PASSWORD:-dramaip}
      REPORTING_JOB_HTTP_ADDR: ":8113"
      REPORTING_REBUILD_ON_START: ${REPORTING_REBUILD_ON_START:-false}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-dramaip}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dramaip}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-dramaip.platform.events}
      RABBITMQ_EVENTS_QUEUE: ${RABBITMQ_EVENTS_QUEUE:-dramaip.platform.events}
      REPORTING_EVENTS_QUEUE: ${REPORTING_EVENTS_QUEUE:-dramaip.reporting.events}
      REPORTING_DLQ_EXCHANGE: ${REPORTING_DLQ_EXCHANGE:-dramaip.platform.events.dlx}
      REPORTING_DLQ_QUEUE: ${REPORTING_DLQ_QUEUE:-dramaip.reporting.events.dlq}
      REPORTING_EVENT_PREFETCH: ${REPORTING_EVENT_PREFETCH:-10}
      REPORTING_EVENT_MAX_RETRIES: ${REPORTING_EVENT_MAX_RETRIES:-3}
      OTEL_SERVICE_NAME: dramaip-reporting-job
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  billing-job:
    <<: *app-common
    container_name: drama-billing-job
    image: dramaip-billing-job
    build:
      context: ../../legacy/go-services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/billing/job/cmd/server
        OUTPUT: dramaip-billing-job
    environment:
      <<: *app-env
      POSTGRES_USER: dramaip_billing
      POSTGRES_PASSWORD: ${POSTGRES_BILLING_PASSWORD:-dramaip}
      BILLING_JOB_HTTP_ADDR: ":8106"
      BILLING_JOB_GRPC_ADDR: ":9110"
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_LEASE: ${OUTBOX_LEASE:-30s}
      OUTBOX_RETRY_DELAY: ${OUTBOX_RETRY_DELAY:-5s}
      BILLING_RECONCILIATION_ENABLED: ${BILLING_RECONCILIATION_ENABLED:-true}
      BILLING_RECONCILIATION_INTERVAL: ${BILLING_RECONCILIATION_INTERVAL:-1h}
      BILLING_RECONCILIATION_BATCH_SIZE: ${BILLING_RECONCILIATION_BATCH_SIZE:-100}
      QUOTA_GRPC_ENDPOINT: quota:9104
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-dramaip}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dramaip}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-dramaip.platform.events}
      RABBITMQ_EVENTS_QUEUE: ${RABBITMQ_EVENTS_QUEUE:-dramaip.platform.events}
      OTEL_SERVICE_NAME: dramaip-billing-job
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
      quota:
        condition: service_started

  quota-job:
    <<: *app-common
    container_name: drama-quota-job
    image: dramaip-quota-job
    build:
      context: ../../legacy/go-services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/quota/job/cmd/server
        OUTPUT: dramaip-quota-job
    environment:
      <<: *app-env
      POSTGRES_USER: dramaip_quota
      POSTGRES_PASSWORD: ${POSTGRES_QUOTA_PASSWORD:-dramaip}
      QUOTA_JOB_HTTP_ADDR: ":8107"
      QUOTA_JOB_TICK_SECONDS: ${QUOTA_JOB_TICK_SECONDS:-60}
      OTEL_SERVICE_NAME: dramaip-quota-job

  web-bff:
    <<: *app-common
    container_name: drama-web-bff
    image: dramaip-web-bff
    build:
      context: ../../legacy/go-services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/bff/web/interface/cmd/server
        OUTPUT: dramaip-web-bff
    environment:
      <<: *app-env
      # BFF 自己只读这 7 个变量；POSTGRES/REDIS/JWT/MIGRATIONS 归下游服务。
      # Override inherited values so the BFF never receives a usable database
      # credential, even though it shares the common runtime environment.
      POSTGRES_HOST: ""
      POSTGRES_PORT: ""
      POSTGRES_USER: ""
      POSTGRES_PASSWORD: ""
      POSTGRES_DB: ""
      WEB_BFF_HTTP_ADDR: ":8100"
      AUTH_GRPC_ENDPOINT: auth:9101
      USER_GRPC_ENDPOINT: user:9102
      BILLING_GRPC_ENDPOINT: billing:9103
      QUOTA_GRPC_ENDPOINT: quota:9104
      AI_GATEWAY_GRPC_ENDPOINT: ai-gateway:9105
      NOTIFICATION_GRPC_ENDPOINT: notification:9106
      REVIEW_GRPC_ENDPOINT: review:9112
      OTEL_SERVICE_NAME: dramaip-web-bff
    depends_on:
      - auth
      - user
      - billing
      - quota
      - ai-gateway
      - notification
      - review

  # Desktop BFF is a separate public adapter. It owns only desktop token
  # exchange/session/context routes; browser cookies stay in web-bff.
  desktop-bff:
    <<: *app-common
    container_name: drama-desktop-bff
    image: dramaip-desktop-bff
    build:
      context: ../../legacy/go-services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/bff/desktop/interface/cmd/server
        OUTPUT: dramaip-desktop-bff
    environment:
      <<: *app-env
      POSTGRES_HOST: ""
      POSTGRES_PORT: ""
      POSTGRES_USER: ""
      POSTGRES_PASSWORD: ""
      POSTGRES_DB: ""
      DESKTOP_BFF_HTTP_ADDR: ":8110"
      AUTH_GRPC_ENDPOINT: auth:9101
      USER_GRPC_ENDPOINT: user:9102
      BILLING_GRPC_ENDPOINT: billing:9103
      QUOTA_GRPC_ENDPOINT: quota:9104
      AI_GATEWAY_GRPC_ENDPOINT: ai-gateway:9105
      INSPIRATION_GRPC_ENDPOINT: inspiration:9107
      SNAPSHOT_GRPC_ENDPOINT: snapshot:9109
      REVIEW_GRPC_ENDPOINT: review:9112
      REPORTING_GRPC_ENDPOINT: reporting:9108
      OTEL_SERVICE_NAME: dramaip-desktop-bff
    depends_on:
      - auth
      - user
      - billing
      - quota
      - ai-gateway
      - inspiration
      - snapshot
      - review
      - reporting

  # Mobile BFF is an independent token/session adapter. It has no database,
  # payment or AI credential and exposes only /v1/mobile through Kong.
  mobile-bff:
    <<: *app-common
    container_name: drama-mobile-bff
    image: dramaip-mobile-bff
    build:
      context: ../../legacy/go-services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/bff/mobile/interface/cmd/server
        OUTPUT: dramaip-mobile-bff
    environment:
      <<: *app-env
      POSTGRES_HOST: ""
      POSTGRES_PORT: ""
      POSTGRES_USER: ""
      POSTGRES_PASSWORD: ""
      POSTGRES_DB: ""
      MOBILE_BFF_HTTP_ADDR: ":8120"
      AUTH_GRPC_ENDPOINT: auth:9101
      BILLING_GRPC_ENDPOINT: billing:9103
      QUOTA_GRPC_ENDPOINT: quota:9104
      AI_GATEWAY_GRPC_ENDPOINT: ai-gateway:9105
      INSPIRATION_GRPC_ENDPOINT: inspiration:9107
      OTEL_SERVICE_NAME: dramaip-mobile-bff
    depends_on:
      - auth
      - billing
      - quota
      - ai-gateway
      - inspiration

  # Admin owns its privileged identity/audit metadata in an independent schema
  # and validates a separate JWT key set. It never accepts Web C-end cookies.
  admin-bff:
    <<: *app-common
    container_name: drama-admin-bff
    image: dramaip-admin-bff
    build:
      context: ../../legacy/go-services
      dockerfile: Dockerfile.service
      args:
        TARGET: ./app/admin/interface/cmd/server
        OUTPUT: dramaip-admin-bff
    environment:
      <<: *app-env
      POSTGRES_USER: dramaip_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-dramaip}
      ADMIN_BFF_HTTP_ADDR: ":8130"
      ADMIN_JWT_ISSUER: ${ADMIN_JWT_ISSUER:-dramaip-admin}
      ADMIN_JWT_AUDIENCE: ${ADMIN_JWT_AUDIENCE:-dramaip-admin-api}
      ADMIN_JWT_ACTIVE_KID: ${ADMIN_JWT_ACTIVE_KID:-}
      ADMIN_JWT_PRIVATE_KEY_FILE: ${ADMIN_JWT_PRIVATE_KEY_FILE:-}
      ADMIN_JWT_JWKS_FILE: ${ADMIN_JWT_JWKS_FILE:-}
      ADMIN_JWT_ACCESS_TTL: ${ADMIN_JWT_ACCESS_TTL:-10m}
      REPORTING_GRPC_ENDPOINT: reporting:9108
      AUTH_GRPC_ENDPOINT: auth:9101
      USER_GRPC_ENDPOINT: user:9102
      BILLING_GRPC_ENDPOINT: billing:9103
      QUOTA_GRPC_ENDPOINT: quota:9104
      AI_GATEWAY_GRPC_ENDPOINT: ai-gateway:9105
      NOTIFICATION_GRPC_ENDPOINT: notification:9106
      BILLING_JOB_GRPC_ENDPOINT: billing-job:9110
      NOTIFICATION_JOB_GRPC_ENDPOINT: notification-job:9111
      ADMIN_BFF_GRPC_DIAL_TIMEOUT: ${ADMIN_BFF_GRPC_DIAL_TIMEOUT:-15s}
      OTEL_SERVICE_NAME: dramaip-admin-bff
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      reporting:
        condition: service_started
      auth:
        condition: service_started
      user:
        condition: service_started
      billing:
        condition: service_started
      quota:
        condition: service_started
      ai-gateway:
        condition: service_started
      notification:
        condition: service_started
      billing-job:
        condition: service_started
      notification-job:
        condition: service_started

  # Application external entry — the ONLY API service clients may reach from outside.
  # (postgres/redis/rabbitmq/prometheus/grafana/jaeger below are dev-time
  # infra ports; in prod (k8s) everything collapses to exposing Kong alone.)
  kong:
    profiles: [legacy, mixed]
    container_name: drama-kong
    image: kong:3.9-ubuntu
    pull_policy: missing
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ../kong/kong.yml:/kong/declarative/kong.yml:ro
    depends_on:
      - auth
      - web-bff
      - desktop-bff
      - mobile-bff
      - admin-bff
      - billing-job
      - notification-job
      - quota-job
      - reporting-job

  # ─────────────────── 可观测性 ───────────────────
  # 三大支柱（10 个 Go 微服务是数据源）：traces/metrics 经 OTLP 推送到 otel-collector，
  # logs 走 stdout 由宿主 docker json-file 落盘、再由 fluent-bit 采集。
  # 书写顺序≠启动顺序（启动由 depends_on 拓扑决定），这里按「排查优先级」排——
  # 接到告警后的典型动线：指标发现问题 → 链路定位服务 → 日志深挖到行。
  # 故顺序为 指标(Prometheus) → 链路(Jaeger + otel-collector) → 日志(OpenSearch 栈)
  # → 可视化前端(Grafana) 收尾。

  # ────── 指标 (Metrics)：拉模型抓取 + TSDB 存储（告警/排障第一站）──────
  prometheus:
    profiles: [observability]
    container_name: drama-prometheus
    image: prom/prometheus:v3.11.3
    pull_policy: missing
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./docker-data/prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d

  # ────── 链路追踪 (Tracing)：定位「哪个服务、哪一跳」出问题 ──────
  # 数据流：Go 服务 → otel-collector（中转）→ jaeger（存储/UI）。
  # otel-collector 横跨三支柱：traces 转发至 jaeger，metrics/logs 视
  # otel-collector/config.yaml 可下发到 prometheus / opensearch。
  otel-collector:
    profiles: [observability]
    container_name: drama-otel-collector
    image: otel/opentelemetry-collector-contrib:0.155.0
    pull_policy: missing
    command: ["--config", "/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"     # OTLP gRPC（Kratos OTel exporter 发往这里）
      - "127.0.0.1:4318:4318"     # OTLP HTTP
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    profiles: [observability]
    # v2 基于 OTel Collector；v1(all-in-one) 已于 2025-12-31 EOL。
    # badger 落盘到 docker-data/jaeger（见 jaeger/config.yaml）。
    container_name: drama-jaeger
    image: jaegertracing/jaeger:2.17.0
    pull_policy: missing
    command: ["--config", "/jaeger/config.yaml"]
    ports:
      - "127.0.0.1:16686:16686"   # Jaeger UI（local development only）
    volumes:
      - ./jaeger/config.yaml:/jaeger/config.yaml:ro
      - ./docker-data/jaeger:/badger

  # ────── 日志 (Logging)：采集 → 存储/检索 → UI（深挖到「哪一行」）──────
  # 日志采集：tail docker json-file + 本机开发 OpenSearch 直连（无认证）。
  # 注：Fluent Bit 无 `docker` filter 插件；容器【名】需改用 fluentbit 日志驱动或 Lua 注入。
  # 挂宿主 /var/lib/docker/containers 是采集容器日志的标配；state 卷持久化 tail DB 偏移，
  # 避免 fluent-bit 重启后从头重读 → OpenSearch 日志重复。
  fluent-bit:
    profiles: [observability]
    container_name: drama-fluent-bit
    image: fluent/fluent-bit:5.0.8
    pull_policy: missing
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./docker-data/fluent-bit:/fluent-bit/state
    depends_on:
      - opensearch

  # OpenSearch 存储/检索。此 Compose 服务仅用于本机开发：安全插件关闭且所有
  # 端口限制在 loopback。生产环境不得复用它，必须使用启用认证、TLS、索引
  # 生命周期和最小权限角色的受管/受控 OpenSearch 集群（见 docs/LOCAL_DEVELOPMENT.md）。
  opensearch:
    profiles: [observability]
    container_name: drama-opensearch
    image: opensearchproject/opensearch:3.6.0
    pull_policy: missing
    environment:
      cluster.name: dramaip-logs
      node.name: drama-opensearch
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Dramaip@2026"   # 兜底：3.x 镜像 entrypoint 即便 security 禁用也可能强制检查
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    # Heap is 512m; allow headroom for Lucene off-heap segments and JVM
    # overhead while still bounding the container under 1GB.
    mem_limit: ${OPENSEARCH_MEM_LIMIT:-896m}
    ports:
      - "127.0.0.1:9200:9200"   # REST API（Dashboards / Fluent Bit 连）
      - "127.0.0.1:9600:9600"   # 性能指标，留作后续 prometheus 抓
    volumes:
      - ./docker-data/opensearch:/usr/share/opensearch/data

  opensearch-dashboards:
    profiles: [observability]
    container_name: drama-opensearch-dashboards
    image: opensearchproject/opensearch-dashboards:3.6.0
    pull_policy: missing
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"   # 配合 OS 侧 plugins.security.disabled=true，移除登录页与 tenantinfo 400
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - opensearch

  # ────── 可视化前端：统一大盘，provisioning 同时接 Prometheus(指标,默认) + OpenSearch(日志) ──────
  grafana:
    profiles: [observability]
    container_name: drama-grafana
    image: grafana/grafana:12.3.8
    pull_policy: missing
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-dramaip}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dramaip}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./docker-data/grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - opensearch

  # ─────────────────── Java 服务端 ───────────────────
  # 镜像未指定 platform，Docker Desktop 会为 Windows/amd64、macOS/arm64
  # 选择宿主机对应的多架构基础镜像；Java 服务本身从本地源码构建。
  nacos:
    image: nacos/nacos-server:v3.1.1
    profiles: [mixed, java]
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      # Nacos 3 validates this value even when local authentication is not
      # enabled. It is a development-only default; deployments inject it.
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-VGhpcy1pcy1hLWxvY2FsLWRldmVsb3BtZW50LXRva2VuLWNoYW5nZS1tZQ==}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-security}
      JVM_XMS: ${NACOS_JVM_XMS:-256m}
      JVM_XMX: ${NACOS_JVM_XMX:-256m}
      JVM_XMN: ${NACOS_JVM_XMN:-128m}
    # Cap memory so the standalone JVM does not balloon on a dev host; the
    # heap alone targets 256m, the rest covers metaspace + direct buffers.
    mem_limit: ${NACOS_MEM_LIMIT:-512m}
    # 8848 is the HTTP API, 8849 is the Nacos 3 console (container 8080), and
    # 9848 is the Nacos gRPC client channel needed by Java services on the host.
    ports: ["8848:8848", "8849:8080", "9848:9848"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v3/console/health/readiness >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  seata:
    image: apache/seata-server:2.5.0.jdk21
    profiles: [mixed, java]
    environment:
      SEATA_IP: seata
      SEATA_PORT: 8091
    # Seata's default heap easily exceeds 1GB without a cgroup limit. 768m is
    # ample for single-node dev and keeps Docker Desktop memory predictable.
    mem_limit: ${SEATA_MEM_LIMIT:-768m}
    ports: ["8091:8091"]

  java-migration:
    profiles: [mixed, java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: migration } }
    environment:
      POSTGRES_DSN: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dramaip}
      POSTGRES_USER: ${POSTGRES_USER:-dramaip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dramaip}
      LEGACY_MIGRATIONS_DIR: /app/legacy-migrations
      DB_ROLE_BOOTSTRAP: ${DB_ROLE_BOOTSTRAP:-true}
      DRAMAIP_MIGRATION_ROLE_PASSWORD: ${DRAMAIP_MIGRATION_ROLE_PASSWORD:-dramaip}
    depends_on: { postgres: { condition: service_healthy } }

  java-gateway:
    profiles: [mixed, java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: gateway } }
    environment: &java-env
      NACOS_SERVER_ADDR: nacos:8848
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dramaip}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://identity:8080/.well-known/jwks.json}
      JWT_ENABLED: ${JWT_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3010}
      DRAMAIP_INTERNAL_TOKEN: ${DRAMAIP_INTERNAL_TOKEN:-change-me-internal}
    ports: ["8080:8080"]
    depends_on: { nacos: { condition: service_healthy }, java-migration: { condition: service_completed_successfully } }

  identity:
    profiles: [mixed, java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: services/identity } }
    environment: &java-service-env
      POSTGRES_DSN: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dramaip}
      POSTGRES_PASSWORD: ${POSTGRES_IDENTITY_PASSWORD:-dramaip}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dramaip}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-dramaip}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-dramaip}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dramaip}
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-false}
      WEB_COOKIE_DOMAIN: ${WEB_COOKIE_DOMAIN:-}
      WEB_REFRESH_COOKIE_TTL: ${WEB_REFRESH_COOKIE_TTL:-720h}
      NACOS_SERVER_ADDR: nacos:8848
      SEATA_SERVER_ADDR: seata:8091
      JWT_ENABLED: ${JWT_ENABLED:-true}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://identity:8080/.well-known/jwks.json}
      DRAMAIP_INTERNAL_TOKEN: ${DRAMAIP_INTERNAL_TOKEN:-change-me-internal}
      IDENTITY_ALLOW_EPHEMERAL_JWT: ${IDENTITY_ALLOW_EPHEMERAL_JWT:-true}
      REVIEW_S3_ENDPOINT: ${REVIEW_S3_ENDPOINT:-http://minio:9000}
      REVIEW_S3_REGION: ${REVIEW_S3_REGION:-us-east-1}
      REVIEW_S3_BUCKET: ${REVIEW_S3_BUCKET:-dramaip-review}
      REVIEW_S3_ACCESS_KEY: ${REVIEW_S3_ACCESS_KEY:-dramaip-review}
      REVIEW_S3_SECRET_KEY: ${REVIEW_S3_SECRET_KEY:-dramaip-review-development-secret}
      REVIEW_S3_ALLOW_INSECURE: ${REVIEW_S3_ALLOW_INSECURE:-true}
    depends_on: { java-migration: { condition: service_completed_successfully }, nacos: { condition: service_healthy } }

  support:
    profiles: [mixed, java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: services/support } }
    environment: *java-service-env
    depends_on: { java-migration: { condition: service_completed_successfully }, nacos: { condition: service_healthy } }

  creation:
    profiles: [mixed, java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: services/creation } }
    environment: *java-service-env
    depends_on: { java-migration: { condition: service_completed_successfully }, nacos: { condition: service_healthy } }

  java-quota:
    profiles: [mixed, java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: services/quota } }
    environment: *java-service-env
    depends_on: { java-migration: { condition: service_completed_successfully }, nacos: { condition: service_healthy }, seata: { condition: service_started } }

  ai:
    profiles: [mixed, java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: services/ai } }
    environment: *java-service-env
    depends_on: { java-migration: { condition: service_completed_successfully }, nacos: { condition: service_healthy }, seata: { condition: service_started } }

  java-billing:
    profiles: [mixed, java]
    build: { context: ../.., dockerfile: server/Dockerfile, args: { MODULE: services/billing } }
    environment: *java-service-env
    depends_on: { java-migration: { condition: service_completed_successfully }, nacos: { condition: service_healthy }, seata: { condition: service_started } }

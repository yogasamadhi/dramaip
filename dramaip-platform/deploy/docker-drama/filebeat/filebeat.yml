# Docker json-file logs -> Elasticsearch. This configuration is deliberately
# local-development only: Elasticsearch authentication is disabled in Compose.
filebeat.inputs:
  - type: filestream
    id: docker-container-logs
    paths:
      - /var/lib/docker/containers/*/*-json.log
    parsers:
      - container: ~
    prospector.scanner.check_interval: 5s
    # Filebeat 9.x waits until a file reaches the fingerprint length. Lower it
    # so short-lived containers and smoke-test logs are collected promptly.
    prospector.scanner.fingerprint.length: 64

processors:
  - decode_json_fields:
      fields: ["message"]
      target: ""
      max_depth: 1
      overwrite_keys: true
      add_error_key: false
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"

# Keep the existing dramaip-logs-* query contract used by Grafana and smoke
# checks. A custom index requires a matching template and disabled default ILM.
setup.ilm.enabled: false
setup.template.name: "dramaip-logs"
setup.template.pattern: "dramaip-logs-*"

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "dramaip-logs-%{+yyyy.MM.dd}"

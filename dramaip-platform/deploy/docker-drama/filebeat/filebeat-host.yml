# Docker infrastructure logs plus NDJSON emitted by host-run Java services.
filebeat.inputs:
  - type: filestream
    id: docker-container-logs
    paths:
      - /var/lib/docker/containers/*/*-json.log
    parsers:
      - container: ~
    prospector.scanner.check_interval: 5s
    # Docker json-file startup lines are often identical across containers;
    # retain the mounted inode instead of using a content fingerprint.
    file_identity.native: ~

  - type: filestream
    id: host-java-ndjson
    paths:
      - /var/log/dramaip/*.log
    parsers:
      - ndjson:
          target: ""
          add_error_key: true
    prospector.scanner.check_interval: 5s
    file_identity.native: ~

processors:
  - decode_json_fields:
      when:
        has_fields: ["container"]
      fields: ["message"]
      target: ""
      max_depth: 1
      overwrite_keys: true
      add_error_key: false
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"
  - script:
      lang: javascript
      id: normalize-service-field
      source: >
        function process(event) {
          var serviceName = event.Get("service.name");
          if (serviceName) {
            event.Put("service", serviceName);
            event.Delete("service.name");
          }
        }

setup.ilm.enabled: false
setup.template.enabled: false

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "dramaip-logs-java-%{+yyyy.MM.dd}"

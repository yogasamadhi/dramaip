# Redis dev 配置（绑定挂载进容器，redis-server 启动时加载）。
# 修改后需 `docker compose restart redis` 生效。

# 密码：与 postgres / rabbitmq 一致用 dramaip。
# 其它服务连接串：redis://:dramaip@redis:6379
requirepass dramaip

# 监听容器内所有网卡（compose 网络互访）。
# 设了 requirepass 后 protected-mode 默认不再阻断外部连接，无需手动关。
bind 0.0.0.0

# 持久化：AOF 开启，数据落 docker-data/redis。
appendonly yes

# 内存上限与驱逐策略（dev 防止吃爆宿主机内存；按需调整）。
maxmemory 256mb
maxmemory-policy allkeys-lru

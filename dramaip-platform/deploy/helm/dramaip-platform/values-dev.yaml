replicaCount: 1

image:
  repository: dramaip-web-bff
  tag: dev
  pullPolicy: IfNotPresent

images:
  webBff:
    repository: dramaip-web-bff
    tag: dev
  auth:
    repository: dramaip-auth
    tag: dev
  user:
    repository: dramaip-user
    tag: dev
  billing:
    repository: dramaip-billing
    tag: dev
  quota:
    repository: dramaip-quota
    tag: dev
  aiGateway:
    repository: dramaip-ai-gateway
    tag: dev
  notification:
    repository: dramaip-notification
    tag: dev
  notificationJob:
    repository: dramaip-notification-job
    tag: dev
  billingJob:
    repository: dramaip-billing-job
    tag: dev
  quotaJob:
    repository: dramaip-quota-job
    tag: dev
  migration:
    repository: dramaip-migrate
    tag: dev

config:
  env: dev
  logLevel: debug
  autoMigrate: "false"
  postgres:
    host: postgres
    sslmode: disable
  redis:
    addr: redis:6379
  rabbitmq:
    host: rabbitmq
    port: "5672"
    vhost: /
  otel:
    endpoint: http://otel-collector:4318

internalMTLS:
  enabled: false

devInfra:
  enabled: true
  persistence:
    enabled: true
    hostPathBase: ""

migrations:
  enabled: false

secret:
  postgresUser: dramaip
  postgresPassword: dramaip
  postgresAuthPassword: dramaip
  postgresUserProfilePassword: dramaip
  postgresBillingPassword: dramaip
  postgresQuotaPassword: dramaip
  postgresAIGatewayPassword: dramaip
  postgresNotificationPassword: dramaip
  redisPassword: dramaip
  rabbitmqUser: dramaip
  rabbitmqPassword: dramaip

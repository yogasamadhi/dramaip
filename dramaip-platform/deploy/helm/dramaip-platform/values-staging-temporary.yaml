# This overlay is intentionally usable only through helm-release.sh with both
# DRAMAIP_TEMPORARY_STAGING_INFRA=1 and DRAMAIP_TEMPORARY_STAGING_AUTHORIZED=1.
# It never changes normal staging or production. All data is emptyDir-backed
# and is discarded with the dedicated staging namespace.
replicaCount: 1

image:
  pullPolicy: IfNotPresent

nodeSelector:
  node-role.kubernetes.io/worker: worker

devInfra:
  enabled: true
  persistence:
    enabled: false

config:
  env: staging
  postgres:
    host: postgres
    port: "5432"
    database: dramaip
    sslmode: disable
  redis:
    addr: redis:6379
  rabbitmq:
    host: rabbitmq
    port: "5672"
    vhost: /
  otel:
    endpoint: http://otel-collector:4318
  billingJob:
    reconciliationEnabled: "false"
  ai:
    # This unroutable local endpoint and generated placeholder token prevent a
    # temporary health test from reaching an external AI provider.
    providerBaseUrl: http://127.0.0.1:1
    openaiCompatibleGpt4oMini:
      inputPricePerMillion: "0.001"
      outputPricePerMillion: "0.001"
      currency: USD
      exchangeRateToCny: "1"

# A short-lived test deploy validates generated local keys, not the normal
# staging/production rotation workflow. The application generates ephemeral
# key material when these mount names are deliberately empty.
authJWT:
  keysetSecret: ""
adminJWT:
  keysetSecret: ""

migrations:
  enabled: true
  useHelmHook: true
  bootstrapRuntimeRoles: true

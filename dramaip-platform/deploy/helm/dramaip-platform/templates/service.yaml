{{- $services := list
  (dict "component" "web-bff" "http" 8100 "grpc" 0)
  (dict "component" "desktop-bff" "http" 8110 "grpc" 0)
  (dict "component" "mobile-bff" "http" 8120 "grpc" 0)
  (dict "component" "admin-bff" "http" 8130 "grpc" 0)
  (dict "component" "auth" "http" 8101 "grpc" 9101)
  (dict "component" "user" "http" 8102 "grpc" 9102)
  (dict "component" "billing" "http" 8103 "grpc" 9103)
  (dict "component" "quota" "http" 8104 "grpc" 9104)
  (dict "component" "ai-gateway" "http" 8105 "grpc" 9105)
  (dict "component" "notification" "http" 8108 "grpc" 9106)
  (dict "component" "inspiration" "http" 8111 "grpc" 9107)
  (dict "component" "snapshot" "http" 8114 "grpc" 9109)
  (dict "component" "review" "http" 8115 "grpc" 9112)
  (dict "component" "reporting" "http" 8112 "grpc" 9108)
  (dict "component" "notification-job" "http" 8109 "grpc" 9111)
  (dict "component" "billing-job" "http" 8106 "grpc" 9110)
-}}
{{- range $index, $service := $services }}
{{- $component := index $service "component" }}
{{- $http := index $service "http" }}
{{- $grpc := index $service "grpc" }}
{{- if $index }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dramaip-platform.fullname" $ }}-{{ $component }}
  labels:
    {{- include "dramaip-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: {{ $http }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if $grpc }}
    - port: {{ $grpc }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "dramaip-platform.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $component }}
{{- end }}

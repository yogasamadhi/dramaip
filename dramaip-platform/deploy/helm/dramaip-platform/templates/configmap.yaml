apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dramaip-platform.fullname" . }}-config
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
data:
  ENV: {{ .Values.config.env | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  TIMEZONE: {{ .Values.config.timezone | quote }}
  WEB_BFF_HTTP_ADDR: {{ .Values.config.webBffHttpAddr | quote }}
  WEB_REFRESH_COOKIE_TTL: {{ .Values.config.webSession.refreshCookieTtl | quote }}
  WEB_COOKIE_DOMAIN: {{ .Values.config.webSession.cookieDomain | quote }}
  GRPC_MTLS_ENABLED: {{ .Values.internalMTLS.enabled | quote }}
  GRPC_MTLS_CA_FILE: {{ if .Values.internalMTLS.enabled }}"/var/run/dramaip/mtls/ca.crt"{{ else }}""{{ end }}
  AUTH_HTTP_ADDR: {{ .Values.config.authHttpAddr | quote }}
  AUTH_GRPC_ADDR: {{ .Values.config.authGrpcAddr | quote }}
  USER_HTTP_ADDR: {{ .Values.config.userHttpAddr | quote }}
  USER_GRPC_ADDR: {{ .Values.config.userGrpcAddr | quote }}
  BILLING_HTTP_ADDR: {{ .Values.config.billingHttpAddr | quote }}
  BILLING_GRPC_ADDR: {{ .Values.config.billingGrpcAddr | quote }}
  QUOTA_HTTP_ADDR: {{ .Values.config.quotaHttpAddr | quote }}
  QUOTA_GRPC_ADDR: {{ .Values.config.quotaGrpcAddr | quote }}
  AI_GATEWAY_HTTP_ADDR: {{ .Values.config.aiGatewayHttpAddr | quote }}
  AI_GATEWAY_GRPC_ADDR: {{ .Values.config.aiGatewayGrpcAddr | quote }}
  NOTIFICATION_HTTP_ADDR: {{ .Values.config.notificationHttpAddr | quote }}
  NOTIFICATION_GRPC_ADDR: {{ .Values.config.notificationGrpcAddr | quote }}
  BILLING_JOB_HTTP_ADDR: {{ .Values.config.billingJobHttpAddr | quote }}
  QUOTA_JOB_HTTP_ADDR: {{ .Values.config.quotaJobHttpAddr | quote }}
  AUTO_MIGRATE: {{ .Values.config.autoMigrate | quote }}
  MIGRATIONS_DIR: {{ .Values.config.migrationsDir | quote }}
  POSTGRES_HOST: {{ .Values.config.postgres.host | quote }}
  POSTGRES_PORT: {{ .Values.config.postgres.port | quote }}
  POSTGRES_DB: {{ .Values.config.postgres.database | quote }}
  POSTGRES_SSLMODE: {{ .Values.config.postgres.sslmode | quote }}
  REDIS_ADDR: {{ .Values.config.redis.addr | quote }}
  REDIS_DB: {{ .Values.config.redis.db | quote }}
  RABBITMQ_HOST: {{ .Values.config.rabbitmq.host | quote }}
  RABBITMQ_PORT: {{ .Values.config.rabbitmq.port | quote }}
  RABBITMQ_VHOST: {{ .Values.config.rabbitmq.vhost | quote }}
  RABBITMQ_EVENTS_QUEUE: {{ .Values.config.rabbitmq.eventsQueue | quote }}
  JWT_ISSUER: {{ .Values.config.jwt.issuer | quote }}
  JWT_AUDIENCE: {{ .Values.config.jwt.audience | quote }}
  JWT_ACTIVE_KID: {{ .Values.config.jwt.activeKeyID | quote }}
  JWT_PRIVATE_KEY_FILE: {{ if .Values.authJWT.keysetSecret }}{{ printf "/var/run/dramaip/auth-jwt/%s" .Values.authJWT.privateKeyFile | quote }}{{ else }}""{{ end }}
  JWT_JWKS_FILE: {{ if .Values.authJWT.keysetSecret }}{{ printf "/var/run/dramaip/auth-jwt/%s" .Values.authJWT.jwksFile | quote }}{{ else }}""{{ end }}
  JWT_ACCESS_TTL: {{ .Values.config.jwt.accessTtlSeconds | quote }}
  JWT_REFRESH_TTL: {{ .Values.config.jwt.refreshTtlSeconds | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otel.endpoint | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.otel.serviceName | quote }}
  AUTH_GRPC_ENDPOINT: {{ .Values.config.downstream.authGrpcEndpoint | quote }}
  USER_GRPC_ENDPOINT: {{ .Values.config.downstream.userGrpcEndpoint | quote }}
  BILLING_GRPC_ENDPOINT: {{ .Values.config.downstream.billingGrpcEndpoint | quote }}
  QUOTA_GRPC_ENDPOINT: {{ .Values.config.downstream.quotaGrpcEndpoint | quote }}
  AI_GATEWAY_GRPC_ENDPOINT: {{ .Values.config.downstream.aiGatewayGrpcEndpoint | quote }}
  NOTIFICATION_GRPC_ENDPOINT: {{ .Values.config.downstream.notificationGrpcEndpoint | quote }}
  AI_PROVIDERS: {{ .Values.config.ai.providers | quote }}
  AI_PROVIDER_DEFAULT: {{ .Values.config.ai.defaultProvider | quote }}
  AI_PROVIDER_BASE_URL: {{ .Values.config.ai.providerBaseUrl | quote }}
  AI_DEFAULT_MODEL: {{ .Values.config.ai.defaultModel | quote }}
  AI_PROVIDER_TIMEOUT_SECONDS: {{ .Values.config.ai.timeoutSeconds | quote }}

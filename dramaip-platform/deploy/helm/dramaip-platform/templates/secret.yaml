{{- if not .Values.secret.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dramaip-platform.secretName" . }}
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secret.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secret.postgresPassword | quote }}
  POSTGRES_AUTH_PASSWORD: {{ .Values.secret.postgresAuthPassword | quote }}
  POSTGRES_USER_PROFILE_PASSWORD: {{ .Values.secret.postgresUserProfilePassword | quote }}
  POSTGRES_BILLING_PASSWORD: {{ .Values.secret.postgresBillingPassword | quote }}
  POSTGRES_QUOTA_PASSWORD: {{ .Values.secret.postgresQuotaPassword | quote }}
  POSTGRES_AI_GATEWAY_PASSWORD: {{ .Values.secret.postgresAIGatewayPassword | quote }}
  POSTGRES_NOTIFICATION_PASSWORD: {{ .Values.secret.postgresNotificationPassword | quote }}
  POSTGRES_INSPIRATION_PASSWORD: {{ .Values.secret.postgresInspirationPassword | quote }}
  POSTGRES_ADMIN_PASSWORD: {{ .Values.secret.postgresAdminPassword | quote }}
  POSTGRES_REPORTING_PASSWORD: {{ .Values.secret.postgresReportingPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secret.redisPassword | quote }}
  RABBITMQ_USER: {{ .Values.secret.rabbitmqUser | quote }}
  RABBITMQ_PASSWORD: {{ .Values.secret.rabbitmqPassword | quote }}
  AI_PROVIDER_API_KEY: {{ .Values.secret.aiProviderApiKey | quote }}
  RECONCILIATION_OPERATOR_TOKEN: {{ .Values.secret.reconciliationOperatorToken | quote }}
  AUTH_EMAIL_DELIVERY_TOKEN: {{ .Values.secret.authEmailDeliveryToken | quote }}
{{- end }}

{{- if not .Values.secret.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dramaip-platform.secretName" . }}
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secret.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secret.postgresPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secret.redisPassword | quote }}
  RABBITMQ_USER: {{ .Values.secret.rabbitmqUser | quote }}
  RABBITMQ_PASSWORD: {{ .Values.secret.rabbitmqPassword | quote }}
  JWT_ACCESS_SECRET: {{ .Values.secret.jwtAccessSecret | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secret.jwtRefreshSecret | quote }}
  AI_PROVIDER_API_KEY: {{ .Values.secret.aiProviderApiKey | quote }}
{{- end }}

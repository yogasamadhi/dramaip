apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-minio
spec:
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dev-minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dramaip-platform.fullname" . }}-minio
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dev-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: dev-minio
    spec:
      containers:
        - name: minio
          image: {{ .Values.devInfra.minio.image | quote }}
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "dramaip-platform.secretName" . }}
                  key: REVIEW_S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dramaip-platform.secretName" . }}
                  key: REVIEW_S3_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if $persistenceEnabled }}
          hostPath:
            path: {{ printf "%s/minio" $hostPathBase | quote }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.devInfra.minio.storage | quote }}
          {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dramaip-platform.fullname" . }}-minio-init
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-minio-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: dev-minio-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-init
          image: {{ .Values.devInfra.minio.clientImage | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until mc alias set review http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done
              mc mb --ignore-existing review/{{ .Values.review.objectStore.bucket }}
              mc anonymous set none review/{{ .Values.review.objectStore.bucket }}
              mc ilm rule rm --all --force review/{{ .Values.review.objectStore.bucket }}
              mc ilm rule add --expire-days 30 review/{{ .Values.review.objectStore.bucket }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "dramaip-platform.secretName" . }}
                  key: REVIEW_S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dramaip-platform.secretName" . }}
                  key: REVIEW_S3_SECRET_KEY
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dramaip-platform.fullname" . }}-otel-config
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-otel
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      debug: {}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-otel
spec:
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dev-otel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dramaip-platform.fullname" . }}-otel
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-otel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dev-otel
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: dev-otel
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: otel
          image: {{ .Values.devInfra.otel.image | quote }}
          args:
            - --config=/etc/otelcol/config.yaml
          ports:
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            tcpSocket:
              port: otlp-http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
      volumes:
        - name: config
          configMap:
            name: {{ include "dramaip-platform.fullname" . }}-otel-config
{{- end }}

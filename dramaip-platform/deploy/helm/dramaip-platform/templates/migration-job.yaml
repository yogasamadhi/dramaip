{{- if .Values.migrations.enabled -}}
{{- $useHelmHook := or .Values.migrations.useHelmHook (and .Release.IsUpgrade .Values.migrations.useHelmHookOnUpgrade) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dramaip-platform.fullname" . }}-migrate
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  {{- if $useHelmHook }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-5"
{{- end }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "dramaip-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.migrations.serviceAccountName }}
      serviceAccountName: {{ .Values.migrations.serviceAccountName }}
      {{- else if $useHelmHook }}
      serviceAccountName: default
      {{- else }}
      serviceAccountName: {{ include "dramaip-platform.serviceAccountName" . }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.images.migration.repository }}:{{ .Values.images.migration.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "dramaip-platform.secretName" . }}
          env:
            # When configured as a pre-install/pre-upgrade hook, Helm runs it
            # before ordinary chart resources such as platform-config exist.
            # Keep its small database-only runtime configuration independent
            # of that ConfigMap for both hook and ordinary Job modes.
            - name: MIGRATIONS_DIR
              value: {{ .Values.config.migrationsDir | quote }}
            - name: POSTGRES_HOST
              value: {{ .Values.config.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.config.postgres.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.config.postgres.database | quote }}
            - name: POSTGRES_SSLMODE
              value: {{ .Values.config.postgres.sslmode | quote }}
            - name: TIMEZONE
              value: {{ .Values.config.timezone | quote }}
            - name: DB_ROLE_BOOTSTRAP
              value: {{ .Values.migrations.bootstrapRuntimeRoles | quote }}
{{- end }}

{{- if .Values.pdb.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "dramaip-platform.fullname" . }}-bff
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: bff
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "dramaip-platform.selectorLabels" . | nindent 6 }}
{{- end }}

{{- if and .Values.legacy.enabled .Values.pdb.enabled -}}
{{- $components := list "web-bff" "desktop-bff" "mobile-bff" "admin-bff" -}}
{{- range $component := $components }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "dramaip-platform.fullname" $ }}-{{ $component }}
  labels:
    {{- include "dramaip-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  minAvailable: {{ $.Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "dramaip-platform.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
{{- end }}
{{- end }}

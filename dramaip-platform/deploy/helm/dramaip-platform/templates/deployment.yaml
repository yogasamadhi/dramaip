{{- $workloads := list
  (dict "key" "webBff" "component" "web-bff" "http" 8100 "grpc" 0)
  (dict "key" "desktopBff" "component" "desktop-bff" "http" 8110 "grpc" 0)
  (dict "key" "mobileBff" "component" "mobile-bff" "http" 8120 "grpc" 0)
  (dict "key" "adminBff" "component" "admin-bff" "http" 8130 "grpc" 0)
  (dict "key" "auth" "component" "auth" "http" 8101 "grpc" 9101)
  (dict "key" "user" "component" "user" "http" 8102 "grpc" 9102)
  (dict "key" "billing" "component" "billing" "http" 8103 "grpc" 9103)
  (dict "key" "quota" "component" "quota" "http" 8104 "grpc" 9104)
  (dict "key" "aiGateway" "component" "ai-gateway" "http" 8105 "grpc" 9105)
  (dict "key" "notification" "component" "notification" "http" 8108 "grpc" 9106)
  (dict "key" "inspiration" "component" "inspiration" "http" 8111 "grpc" 9107)
  (dict "key" "snapshot" "component" "snapshot" "http" 8114 "grpc" 9109)
  (dict "key" "review" "component" "review" "http" 8115 "grpc" 9112)
  (dict "key" "reporting" "component" "reporting" "http" 8112 "grpc" 9108)
  (dict "key" "notificationJob" "component" "notification-job" "http" 8109 "grpc" 9111)
  (dict "key" "reportingJob" "component" "reporting-job" "http" 8113 "grpc" 0)
  (dict "key" "billingJob" "component" "billing-job" "http" 8106 "grpc" 9110)
  (dict "key" "quotaJob" "component" "quota-job" "http" 8107 "grpc" 0)
-}}
{{- $databaseRoles := dict
  "auth" (dict "user" "dramaip_auth" "passwordKey" "POSTGRES_AUTH_PASSWORD")
  "user" (dict "user" "dramaip_user" "passwordKey" "POSTGRES_USER_PROFILE_PASSWORD")
  "billing" (dict "user" "dramaip_billing" "passwordKey" "POSTGRES_BILLING_PASSWORD")
  "quota" (dict "user" "dramaip_quota" "passwordKey" "POSTGRES_QUOTA_PASSWORD")
  "aiGateway" (dict "user" "dramaip_ai_gateway" "passwordKey" "POSTGRES_AI_GATEWAY_PASSWORD")
  "notification" (dict "user" "dramaip_notification" "passwordKey" "POSTGRES_NOTIFICATION_PASSWORD")
  "inspiration" (dict "user" "dramaip_inspiration" "passwordKey" "POSTGRES_INSPIRATION_PASSWORD")
  "snapshot" (dict "user" "dramaip_snapshot" "passwordKey" "POSTGRES_SNAPSHOT_PASSWORD")
  "review" (dict "user" "dramaip_review" "passwordKey" "POSTGRES_REVIEW_PASSWORD")
  "adminBff" (dict "user" "dramaip_admin" "passwordKey" "POSTGRES_ADMIN_PASSWORD")
  "reporting" (dict "user" "dramaip_reporting" "passwordKey" "POSTGRES_REPORTING_PASSWORD")
  "notificationJob" (dict "user" "dramaip_notification" "passwordKey" "POSTGRES_NOTIFICATION_PASSWORD")
  "reportingJob" (dict "user" "dramaip_reporting" "passwordKey" "POSTGRES_REPORTING_PASSWORD")
  "billingJob" (dict "user" "dramaip_billing" "passwordKey" "POSTGRES_BILLING_PASSWORD")
  "quotaJob" (dict "user" "dramaip_quota" "passwordKey" "POSTGRES_QUOTA_PASSWORD")
-}}
{{- range $index, $workload := $workloads }}
{{- $key := index $workload "key" }}
{{- $databaseRole := index $databaseRoles $key }}
{{- $component := index $workload "component" }}
{{- $http := index $workload "http" }}
{{- $grpc := index $workload "grpc" }}
{{- $image := index $.Values.images $key }}
{{- $healthPath := "/healthz" }}
{{- $metricsPath := "/metrics" }}
{{- if eq $key "webBff" }}
{{- $healthPath = "/v1/healthz" }}
{{- $metricsPath = "/v1/metrics" }}
{{- end }}
{{- if $index }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dramaip-platform.fullname" $ }}-{{ $component }}
  labels:
    {{- include "dramaip-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ ternary 1 $.Values.replicaCount (hasSuffix "-job" $component) }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dramaip-platform.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dramaip-platform.name" $ }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        dramaip.dev/rollout-token: {{ $.Values.rolloutToken | quote }}
        {{- if not $.Values.secret.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
        {{- end }}
        {{- if $.Values.prometheus.annotations.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ $metricsPath }}
        prometheus.io/port: {{ $http | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "dramaip-platform.serviceAccountName" $ }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $component }}
          image: "{{ $image.repository }}:{{ $image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $http }}
              protocol: TCP
            {{- if $grpc }}
            - name: grpc
              containerPort: {{ $grpc }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "dramaip-platform.fullname" $ }}-config
          {{- if or $.Values.internalMTLS.enabled $databaseRole (eq $key "webBff") (eq $key "desktopBff") (eq $key "mobileBff") }}
          env:
            {{- if $databaseRole }}
            - name: POSTGRES_USER
              value: {{ index $databaseRole "user" | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dramaip-platform.secretName" $ }}
                  key: {{ index $databaseRole "passwordKey" }}
            {{- end }}
            {{- if eq $key "auth" }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dramaip-platform.secretName" $ }}
                  key: REDIS_PASSWORD
            - name: AUTH_EMAIL_DELIVERY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "dramaip-platform.secretName" $ }}
                  key: AUTH_EMAIL_DELIVERY_TOKEN
            {{- end }}
            {{- if or (eq $key "billingJob") (eq $key "notificationJob") (eq $key "reportingJob") }}
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "dramaip-platform.secretName" $ }}
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dramaip-platform.secretName" $ }}
                  key: RABBITMQ_PASSWORD
            {{- end }}
            {{- if eq $key "aiGateway" }}
            - name: AI_PROVIDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "dramaip-platform.secretName" $ }}
                  key: AI_PROVIDER_API_KEY
            {{- end }}
            {{- if eq $key "review" }}
            - name: REVIEW_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "dramaip-platform.secretName" $) $.Values.review.objectStore.credentialsSecret }}
                  key: {{ $.Values.review.objectStore.accessKeyKey }}
            - name: REVIEW_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "dramaip-platform.secretName" $) $.Values.review.objectStore.credentialsSecret }}
                  key: {{ $.Values.review.objectStore.secretKeyKey }}
            {{- end }}
            {{- if and (eq $key "billing") $.Values.payment.wechat.enabled }}
            - name: WECHAT_PAY_API_V3_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "payment.wechat.credentialsSecret is required when WeChat Pay is enabled" $.Values.payment.wechat.credentialsSecret }}
                  key: {{ $.Values.payment.wechat.apiV3KeyKey }}
            {{- end }}
            {{- if or (eq $key "webBff") (eq $key "desktopBff") (eq $key "mobileBff") }}
            # The BFF has no Secret envFrom. Blank connection metadata as an
            # additional guard against a future direct database client.
            - name: POSTGRES_HOST
              value: ""
            - name: POSTGRES_PORT
              value: ""
            - name: POSTGRES_USER
              value: ""
            - name: POSTGRES_PASSWORD
              value: ""
            - name: POSTGRES_DB
              value: ""
            {{- end }}
            {{- if eq $key "desktopBff" }}
            - name: OTEL_SERVICE_NAME
              value: "dramaip-desktop-bff"
            {{- end }}
            {{- if eq $key "mobileBff" }}
            - name: OTEL_SERVICE_NAME
              value: "dramaip-mobile-bff"
            {{- end }}
            {{- if eq $key "adminBff" }}
            - name: OTEL_SERVICE_NAME
              value: "dramaip-admin-bff"
            {{- end }}
          {{- if $.Values.internalMTLS.enabled }}
            - name: GRPC_MTLS_CERT_FILE
              value: /var/run/dramaip/mtls/tls.crt
            - name: GRPC_MTLS_KEY_FILE
              value: /var/run/dramaip/mtls/tls.key
          {{- end }}
          {{- end }}
          {{- if or $.Values.internalMTLS.enabled (and (eq $key "auth") $.Values.authJWT.keysetSecret) (and (eq $key "adminBff") $.Values.adminJWT.keysetSecret) (and (eq $key "billing") $.Values.payment.wechat.enabled) (and (eq $key "billing") $.Values.payment.alipay.enabled) }}
          volumeMounts:
            {{- if $.Values.internalMTLS.enabled }}
            - name: internal-mtls
              mountPath: /var/run/dramaip/mtls/ca.crt
              subPath: {{ $.Values.internalMTLS.caKey | quote }}
              readOnly: true
            - name: internal-mtls
              mountPath: /var/run/dramaip/mtls/tls.crt
              subPath: {{ index $.Values.internalMTLS.certKeys $key | quote }}
              readOnly: true
            - name: internal-mtls
              mountPath: /var/run/dramaip/mtls/tls.key
              subPath: {{ index $.Values.internalMTLS.keyKeys $key | quote }}
              readOnly: true
            {{- end }}
            {{- if and (eq $key "auth") $.Values.authJWT.keysetSecret }}
            - name: auth-jwt-keyset
              mountPath: /var/run/dramaip/auth-jwt
              readOnly: true
            {{- end }}
            {{- if and (eq $key "adminBff") $.Values.adminJWT.keysetSecret }}
            - name: admin-jwt-keyset
              mountPath: /var/run/dramaip/admin-jwt
              readOnly: true
            {{- end }}
            {{- if and (eq $key "billing") $.Values.payment.wechat.enabled }}
            - name: wechat-pay-credentials
              mountPath: /var/run/dramaip/wechat/apiclient-key.pem
              subPath: {{ $.Values.payment.wechat.merchantPrivateKeyKey | quote }}
              readOnly: true
            - name: wechat-pay-credentials
              mountPath: /var/run/dramaip/wechat/platform-cert.pem
              subPath: {{ $.Values.payment.wechat.platformCertificateKey | quote }}
              readOnly: true
            {{- end }}
            {{- if and (eq $key "billing") $.Values.payment.alipay.enabled }}
            - name: alipay-credentials
              mountPath: /var/run/dramaip/alipay/app-private-key.pem
              subPath: {{ $.Values.payment.alipay.merchantPrivateKeyKey | quote }}
              readOnly: true
            - name: alipay-credentials
              mountPath: /var/run/dramaip/alipay/alipay-public-key.pem
              subPath: {{ $.Values.payment.alipay.alipayPublicKeyKey | quote }}
              readOnly: true
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $healthPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            # Startup answers only whether the process has bound its port.
            # Dependency readiness stays on the HTTP probe below, so a
            # temporarily unavailable downstream cannot force a restart loop.
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
      {{- if or $.Values.internalMTLS.enabled (and (eq $key "auth") $.Values.authJWT.keysetSecret) (and (eq $key "adminBff") $.Values.adminJWT.keysetSecret) (and (eq $key "billing") $.Values.payment.wechat.enabled) (and (eq $key "billing") $.Values.payment.alipay.enabled) }}
      volumes:
        {{- if $.Values.internalMTLS.enabled }}
        - name: internal-mtls
          secret:
            secretName: {{ required "internalMTLS.existingSecret is required when mTLS is enabled" $.Values.internalMTLS.existingSecret }}
        {{- end }}
        {{- if and (eq $key "auth") $.Values.authJWT.keysetSecret }}
        - name: auth-jwt-keyset
          secret:
            secretName: {{ $.Values.authJWT.keysetSecret }}
        {{- end }}
        {{- if and (eq $key "adminBff") $.Values.adminJWT.keysetSecret }}
        - name: admin-jwt-keyset
          secret:
            secretName: {{ $.Values.adminJWT.keysetSecret }}
        {{- end }}
        {{- if and (eq $key "billing") $.Values.payment.wechat.enabled }}
        - name: wechat-pay-credentials
          secret:
            secretName: {{ required "payment.wechat.credentialsSecret is required when WeChat Pay is enabled" $.Values.payment.wechat.credentialsSecret }}
        {{- end }}
        {{- if and (eq $key "billing") $.Values.payment.alipay.enabled }}
        - name: alipay-credentials
          secret:
            secretName: {{ required "payment.alipay.credentialsSecret is required when Alipay is enabled" $.Values.payment.alipay.credentialsSecret }}
        {{- end }}
      {{- end }}
{{- end }}

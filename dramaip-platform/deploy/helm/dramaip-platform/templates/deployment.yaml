{{- $workloads := list
  (dict "key" "bff" "component" "bff" "http" 8100 "grpc" 0)
  (dict "key" "auth" "component" "auth" "http" 8101 "grpc" 9101)
  (dict "key" "user" "component" "user" "http" 8102 "grpc" 9102)
  (dict "key" "billing" "component" "billing" "http" 8103 "grpc" 9103)
  (dict "key" "quota" "component" "quota" "http" 8104 "grpc" 9104)
  (dict "key" "aiGateway" "component" "ai-gateway" "http" 8105 "grpc" 9105)
  (dict "key" "billingJob" "component" "billing-job" "http" 8106 "grpc" 0)
  (dict "key" "quotaJob" "component" "quota-job" "http" 8107 "grpc" 0)
-}}
{{- range $index, $workload := $workloads }}
{{- $key := index $workload "key" }}
{{- $component := index $workload "component" }}
{{- $http := index $workload "http" }}
{{- $grpc := index $workload "grpc" }}
{{- $image := index $.Values.images $key }}
{{- if $index }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dramaip-platform.fullname" $ }}-{{ $component }}
  labels:
    {{- include "dramaip-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ ternary 1 $.Values.replicaCount (hasSuffix "-job" $component) }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dramaip-platform.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dramaip-platform.name" $ }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        dramaip.dev/rollout-token: {{ $.Values.rolloutToken | quote }}
        {{- if not $.Values.secret.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
        {{- end }}
        {{- if $.Values.prometheus.annotations.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ $http | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "dramaip-platform.serviceAccountName" $ }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $component }}
          image: "{{ $image.repository }}:{{ $image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $http }}
              protocol: TCP
            {{- if $grpc }}
            - name: grpc
              containerPort: {{ $grpc }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "dramaip-platform.fullname" $ }}-config
            - secretRef:
                name: {{ include "dramaip-platform.secretName" $ }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
{{- end }}

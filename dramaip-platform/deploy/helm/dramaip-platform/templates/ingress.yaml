{{- if .Values.ingress.enabled -}}
{{- $pluginNames := list -}}
{{- $annotations := omit .Values.ingress.annotations "konghq.com/plugins" -}}
{{- if and .Values.kong.plugins.enabled .Values.kong.plugins.cors.enabled -}}
{{- $pluginNames = append $pluginNames (printf "%s-cors" (include "dramaip-platform.fullname" .)) -}}
{{- end -}}
{{- if and .Values.kong.plugins.enabled .Values.kong.plugins.rateLimiting.enabled -}}
{{- $pluginNames = append $pluginNames (printf "%s-rate-limiting" (include "dramaip-platform.fullname" .)) -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dramaip-platform.fullname" . }}-web-bff
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-bff
  {{- if or $annotations $pluginNames }}
  annotations:
    {{- if $pluginNames }}
    konghq.com/plugins: {{ join "," $pluginNames | quote }}
    {{- end }}
    {{- with $annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /v1/desktop
            pathType: Prefix
            backend:
              service:
                name: {{ include "dramaip-platform.fullname" $ }}-desktop-bff
                port:
                  number: 8110
          {{- $paths := default (list (dict "path" "/" "pathType" "Prefix")) .paths }}
          {{- range $paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "dramaip-platform.fullname" $ }}-web-bff
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.payment.wechat.enabled }}
---
{{- $webhookPluginNames := list -}}
{{- if .Values.kong.plugins.enabled -}}
{{- $webhookPluginNames = append $webhookPluginNames (printf "%s-wechat-webhook-rate-limiting" (include "dramaip-platform.fullname" .)) -}}
{{- $webhookPluginNames = append $webhookPluginNames (printf "%s-wechat-webhook-size-limit" (include "dramaip-platform.fullname" .)) -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dramaip-platform.fullname" . }}-wechat-pay-webhook
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: billing
  {{- if $webhookPluginNames }}
  annotations:
    # No browser CORS or JWT plugin belongs here. WeChat signs the original
    # request body and billing-service verifies that signature itself.
    konghq.com/plugins: {{ join "," $webhookPluginNames | quote }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /v1/webhooks/wechat-pay
            pathType: Exact
            backend:
              service:
                name: {{ include "dramaip-platform.fullname" $ }}-billing
                port:
                  number: 8103
    {{- end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.payment.alipay.enabled }}
---
{{- $alipayWebhookPluginNames := list -}}
{{- if .Values.kong.plugins.enabled -}}
{{- $alipayWebhookPluginNames = append $alipayWebhookPluginNames (printf "%s-alipay-webhook-rate-limiting" (include "dramaip-platform.fullname" .)) -}}
{{- $alipayWebhookPluginNames = append $alipayWebhookPluginNames (printf "%s-alipay-webhook-size-limit" (include "dramaip-platform.fullname" .)) -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dramaip-platform.fullname" . }}-alipay-webhook
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: billing
  {{- if $alipayWebhookPluginNames }}
  annotations:
    # No browser CORS or JWT plugin belongs here. Alipay signs the original
    # form body and billing-service verifies it before active reconciliation.
    konghq.com/plugins: {{ join "," $alipayWebhookPluginNames | quote }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /v1/webhooks/alipay
            pathType: Exact
            backend:
              service:
                name: {{ include "dramaip-platform.fullname" $ }}-billing
                port:
                  number: 8103
    {{- end }}
{{- end }}

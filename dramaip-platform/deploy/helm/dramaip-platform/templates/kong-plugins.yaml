{{- if and .Values.ingress.enabled .Values.kong.plugins.enabled .Values.kong.plugins.cors.enabled }}
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ include "dramaip-platform.fullname" . }}-cors
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
plugin: cors
config:
  origins:
    {{- toYaml .Values.kong.plugins.cors.origins | nindent 4 }}
  methods:
    {{- toYaml .Values.kong.plugins.cors.methods | nindent 4 }}
  headers:
    {{- toYaml .Values.kong.plugins.cors.headers | nindent 4 }}
  exposed_headers:
    {{- toYaml .Values.kong.plugins.cors.exposedHeaders | nindent 4 }}
  credentials: {{ .Values.kong.plugins.cors.credentials }}
  max_age: {{ .Values.kong.plugins.cors.maxAge }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.kong.plugins.enabled .Values.kong.plugins.rateLimiting.enabled }}
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ include "dramaip-platform.fullname" . }}-rate-limiting
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
plugin: rate-limiting
config:
  minute: {{ .Values.kong.plugins.rateLimiting.minute }}
  policy: {{ .Values.kong.plugins.rateLimiting.policy | quote }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.adminIngress.enabled .Values.adminIngress.cors.enabled }}
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ include "dramaip-platform.fullname" . }}-admin-cors
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
plugin: cors
config:
  origins:
    {{- toYaml .Values.adminIngress.cors.origins | nindent 4 }}
  methods:
    {{- toYaml .Values.adminIngress.cors.methods | nindent 4 }}
  headers:
    {{- toYaml .Values.adminIngress.cors.headers | nindent 4 }}
  exposed_headers:
    {{- toYaml .Values.adminIngress.cors.exposedHeaders | nindent 4 }}
  credentials: {{ .Values.adminIngress.cors.credentials }}
  max_age: {{ .Values.adminIngress.cors.maxAge }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.adminIngress.enabled .Values.adminIngress.rateLimiting.enabled }}
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ include "dramaip-platform.fullname" . }}-admin-rate-limiting
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
plugin: rate-limiting
config:
  minute: {{ .Values.adminIngress.rateLimiting.minute }}
  policy: {{ .Values.adminIngress.rateLimiting.policy | quote }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.payment.wechat.enabled .Values.kong.plugins.enabled }}
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ include "dramaip-platform.fullname" . }}-wechat-webhook-rate-limiting
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
plugin: rate-limiting
config:
  minute: {{ .Values.payment.wechat.webhookRateLimitPerMinute }}
  policy: local
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ include "dramaip-platform.fullname" . }}-wechat-webhook-size-limit
  labels:
    {{- include "dramaip-platform.labels" . | nindent 4 }}
plugin: request-size-limiting
config:
  allowed_payload_size: 1
{{- end }}
{{- if and .Values.ingress.enabled .Values.payment.alipay.enabled .Values.kong.plugins.enabled }}
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:

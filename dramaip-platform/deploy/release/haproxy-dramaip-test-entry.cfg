# BEGIN dramaip temporary staging web entry
# Test-only public listener for the control-plane VIP. It intentionally sends
# browser traffic to Kong over TLS and preserves the Ingress host expected by
# the temporary staging chart. Do not use this plaintext listener for a
# production endpoint.
frontend dramaip-test-web-frontend
    mode http
    bind *:81
    option forwardfor
    http-request set-header Host api.staging.internal
    http-request set-header X-Forwarded-Proto http
    default_backend dramaip-test-web-backend

backend dramaip-test-web-backend
    mode http
    balance roundrobin
    option httpchk GET /v1/healthz
    http-check send hdr Host api.staging.internal
    http-check expect status 200
    server k8s-worker01 192.168.2.101:32443 ssl verify none check check-sni api.staging.internal sni str(api.staging.internal)
    server k8s-worker02 192.168.2.102:32443 ssl verify none check check-sni api.staging.internal sni str(api.staging.internal)
    server k8s-worker03 192.168.2.103:32443 ssl verify none check check-sni api.staging.internal sni str(api.staging.internal)
# END dramaip temporary staging web entry

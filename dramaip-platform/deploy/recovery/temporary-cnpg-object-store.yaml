# Disposable in-cluster S3 endpoint for exercising CNPG Barman. The images are
# local amd64 tags with a Never pull policy, so no node pulls images remotely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnpg-recovery-minio
  namespace: dramaip-recovery-staging
  labels:
    app.kubernetes.io/name: cnpg-recovery-minio
    app.kubernetes.io/part-of: dramaip-recovery-rehearsal
    dramaip.io/temporary: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cnpg-recovery-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cnpg-recovery-minio
        app.kubernetes.io/part-of: dramaip-recovery-rehearsal
        dramaip.io/temporary: "true"
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: worker
        kubernetes.io/hostname: k8s-worker01
      containers:
        - name: minio
          image: dramaip-recovery-minio:amd64
          imagePullPolicy: Never
          command:
            - /usr/bin/minio
          args:
            - server
            - /data
            - --address
            - :9000
            - --console-address
            - :9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: cnpg-recovery-minio-credentials
                  key: ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cnpg-recovery-minio-credentials
                  key: SECRET_ACCESS_KEY
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cnpg-recovery-minio
  namespace: dramaip-recovery-staging
  labels:
    app.kubernetes.io/name: cnpg-recovery-minio
    app.kubernetes.io/part-of: dramaip-recovery-rehearsal
    dramaip.io/temporary: "true"
spec:
  selector:
    app.kubernetes.io/name: cnpg-recovery-minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cnpg-recovery-minio-bucket
  namespace: dramaip-recovery-staging
  labels:
    app.kubernetes.io/name: cnpg-recovery-minio-bucket
    app.kubernetes.io/part-of: dramaip-recovery-rehearsal
    dramaip.io/temporary: "true"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cnpg-recovery-minio-bucket
        app.kubernetes.io/part-of: dramaip-recovery-rehearsal
        dramaip.io/temporary: "true"
    spec:
      restartPolicy: Never
      nodeSelector:
        node-role.kubernetes.io/worker: worker
        kubernetes.io/hostname: k8s-worker01
      containers:
        - name: create-bucket
          image: dramaip-recovery-mc:amd64
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -ceu
            - |
              until /usr/bin/mc alias set local http://cnpg-recovery-minio:9000 "$ACCESS_KEY_ID" "$SECRET_ACCESS_KEY"; do
                sleep 2
              done
              /usr/bin/mc mb --ignore-existing local/dramaip-cnpg-recovery
              /usr/bin/mc ls local/dramaip-cnpg-recovery >/dev/null
          env:
            - name: ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: cnpg-recovery-minio-credentials
                  key: ACCESS_KEY_ID
            - name: SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cnpg-recovery-minio-credentials
                  key: SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

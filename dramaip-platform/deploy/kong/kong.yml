_format_version: "3.0"

# Kong is the sole external entry for DramaIP clients (:8000 proxy, :8001 admin).
# The BFF binds loopback on the host (127.0.0.1:8100); Kong reaches it via
# host.docker.internal. Internal services (auth/user/billing/quota/ai-gateway)
# are NOT exposed here — clients must never reach them directly.
#
# Cross-cutting concerns live ONLY at Kong: TLS, CORS, rate limiting, and edge
# JWT verification. The checked-in file is the development template. Production
# must be rendered with the auth-service public JWKS by
# `go run ./cmd/kong-jwt-config`; it never contains a private key. See
# deploy/kong/README.md and docs/技术架构.md §9.

services:
  # Payment-provider ingress terminates at billing-service directly. It is
  # intentionally outside the BFF/JWT route: WeChat signs its original body,
  # which billing verifies and records before server-side reconciliation.
  - name: dramaip-billing-wechat-webhook
    url: http://billing:8103
    routes:
      - name: dramaip-wechat-pay-webhook
        paths:
          - /v1/webhooks/wechat-pay
        methods: [POST]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 600
              policy: local
          - name: request-size-limiting
            config:
              allowed_payload_size: 1

  # Alipay notifications are form-encoded but equally bypass the browser BFF
  # and edge JWT checks. billing-service verifies the original signed form and
  # actively queries the transaction before changing entitlement state.
  - name: dramaip-billing-alipay-webhook
    url: http://billing:8103
    routes:
      - name: dramaip-alipay-webhook
        paths:
          - /v1/webhooks/alipay
        methods: [POST]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 600
              policy: local
          - name: request-size-limiting
            config:
              allowed_payload_size: 1

  # Public verification-key discovery only. auth-service does not expose its
  # private key and all token issuance remains behind the Web BFF.
  - name: dramaip-auth-jwks
    url: http://auth:8101
    routes:
      - name: dramaip-auth-jwks
        paths:
          - /.well-known/jwks.json
        methods: [GET]
        strip_path: false

  - name: dramaip-web-bff
    url: http://web-bff:8100
    routes:
      - name: dramaip-protected-api
        paths:
          - /v1/me
          - /v1/billing
          - /v1/subscription
          - /v1/ai
        strip_path: false
        plugins:
          # JWT_PLUGIN
          - name: cors
            config:
              origins: ["http://localhost:3009", "http://127.0.0.1:3009"]
              methods: [GET, POST, PATCH, OPTIONS]
              headers: [Authorization, Content-Type, Idempotency-Key, X-CSRF-Token, X-Device-Id, X-Request-Id, traceparent, tracestate]
              exposed_headers: [Content-Type, Idempotency-Key, X-Trace-Id, X-Request-Id]
              credentials: true
              max_age: 3600
          - name: rate-limiting
            config:
              minute: 120
              policy: local
      - name: dramaip-api
        paths:
          - /v1/
        strip_path: false
    plugins:
      # Never let an external client manufacture an internal identity. The Web
      # BFF derives user context from the verified Cookie/JWT and forwards it
      # only over authenticated internal gRPC.
      - name: request-transformer
        config:
          remove:
            headers: [X-User-Id, X-User-Role, X-User-Email, X-User-Plan, X-Dramaip-User-Id]
      - name: cors
        config:
          # Development origins only. Production declarations must replace
          # these with the exact web origin(s), e.g. https://app.dramaip.com.
          origins: ["http://localhost:3009", "http://127.0.0.1:3009"]
          methods: [GET, POST, PATCH, OPTIONS]
          headers: [Authorization, Content-Type, Idempotency-Key, X-CSRF-Token, X-Device-Id, X-Request-Id, traceparent, tracestate]
          exposed_headers: [Content-Type, Idempotency-Key, X-Trace-Id, X-Request-Id]
          credentials: true
          max_age: 3600
      - name: rate-limiting
        config:
          minute: 120
          policy: local

  # Desktop traffic never shares Web BFF cookies or login endpoints. Electron
  # calls these routes from its main process after a PKCE browser hand-off.
  - name: dramaip-desktop-bff
    url: http://desktop-bff:8110
    routes:
      - name: dramaip-desktop-api
        paths:
          - /v1/desktop
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              policy: local

# JWT_CREDENTIALS

plugins:
  - name: prometheus

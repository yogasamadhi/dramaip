_format_version: "3.0"

# Kong is the sole external entry for DramaIP clients (:8000 proxy, :8001 admin).
# The BFF binds loopback on the host (127.0.0.1:8100); Kong reaches it via
# host.docker.internal. Internal services (auth/user/billing/quota/ai-gateway)
# are NOT exposed here — clients must never reach them directly.
#
# Cross-cutting concerns live ONLY at Kong: TLS, CORS, rate limiting, and edge
# JWT verification. The checked-in file is the development template. Production
# must be rendered with the auth-service public JWKS by
# `go run ./cmd/kong-jwt-config`; it never contains a private key. See
# deploy/kong/README.md and docs/技术架构.md §9.

services:
  # Public verification-key discovery only. auth-service does not expose its
  # private key and all token issuance remains behind the Web BFF.
  - name: dramaip-auth-jwks
    url: http://auth:8101
    routes:
      - name: dramaip-auth-jwks
        paths:
          - /.well-known/jwks.json
        methods: [GET]
        strip_path: false

  - name: dramaip-web-bff
    url: http://web-bff:8100
    routes:
      - name: dramaip-protected-api
        paths:
          - /v1/me
          - /v1/billing
          - /v1/subscription
          - /v1/ai
        strip_path: false
        plugins:
          # JWT_PLUGIN
          - name: cors
            config:
              origins: ["http://localhost:3009", "http://127.0.0.1:3009"]
              methods: [GET, POST, PATCH, OPTIONS]
              headers: [Authorization, Content-Type, X-CSRF-Token, X-Device-Id, X-Request-Id, traceparent, tracestate]
              exposed_headers: [Content-Type, X-Trace-Id, X-Request-Id]
              credentials: true
              max_age: 3600
          - name: rate-limiting
            config:
              minute: 120
              policy: local
      - name: dramaip-api
        paths:
          - /v1/
        strip_path: false
    plugins:
      - name: cors
        config:
          # Development origins only. Production declarations must replace
          # these with the exact web origin(s), e.g. https://app.dramaip.com.
          origins: ["http://localhost:3009", "http://127.0.0.1:3009"]
          methods: [GET, POST, PATCH, OPTIONS]
          headers: [Authorization, Content-Type, X-CSRF-Token, X-Device-Id, X-Request-Id, traceparent, tracestate]
          exposed_headers: [Content-Type, X-Trace-Id, X-Request-Id]
          credentials: true
          max_age: 3600
      - name: rate-limiting
        config:
          minute: 120
          policy: local

# JWT_CREDENTIALS

plugins:
  - name: prometheus

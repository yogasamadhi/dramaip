_format_version: "3.0"

# Kong is the sole external entry for DramaIP clients (:8000 proxy, :8001 admin).
# The BFF binds loopback on the host (127.0.0.1:8100); Kong reaches it via
# host.docker.internal. Internal services (auth/user/billing/quota/ai-gateway)
# are NOT exposed here — clients must never reach them directly.
#
# Cross-cutting concerns live ONLY at Kong: TLS, CORS, rate limiting, and (once
# auth-service issues real JWTs) edge JWT verification. See docs/技术架构.md §9.

services:
  - name: dramaip-bff
    url: http://bff:8100
    routes:
      - name: dramaip-protected-api
        paths:
          - /v1/me
          - /v1/billing
          - /v1/subscription
          - /v1/ai
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              secret_is_base64: false
              claims_to_verify:
                - exp
          - name: cors
            config:
              origins: ["*"]
              methods: [GET, POST, PATCH, OPTIONS]
              headers: [Authorization, Content-Type, X-Request-Id, traceparent, tracestate]
              exposed_headers: [Content-Type, X-Trace-Id, X-Request-Id]
              credentials: false
              max_age: 3600
          - name: rate-limiting
            config:
              minute: 120
              policy: local
      - name: dramaip-api
        paths:
          - /v1/
        strip_path: false
    plugins:
      - name: cors
        config:
          # dev: allow any origin. In prod, restrict to the web origin(s), e.g.
          #   origins: [https://app.dramaip.com]
          origins: ["*"]
          methods: [GET, POST, PATCH, OPTIONS]
          headers: [Authorization, Content-Type, X-Request-Id, traceparent, tracestate]
          exposed_headers: [Content-Type, X-Trace-Id, X-Request-Id]
          credentials: false
          max_age: 3600
      - name: rate-limiting
        config:
          minute: 120
          policy: local

consumers:
  - username: dramaip-auth
    jwt_secrets:
      - key: dramaip
        algorithm: HS256
        secret: dramaip-dev-access-secret-change-me

plugins:
  - name: prometheus

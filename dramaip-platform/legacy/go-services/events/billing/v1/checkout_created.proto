syntax = "proto3";

package events.billing.v1;

option go_package = "github.com/dramaip/dramaip-platform/services/events/billing/v1;billingeventsv1";

// CheckoutCreated records a newly created pending order before payment is
// confirmed. It is versioned because it is published through the same outbox.
message CheckoutCreated {
  string order_id = 1;
  string user_id = 2;
  string plan_code = 3;
  string provider = 4;
  string amount = 5;
  string currency = 6;
}

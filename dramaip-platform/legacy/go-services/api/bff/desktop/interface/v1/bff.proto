syntax = "proto3";

package dramaip.bff.desktop.interface.v1;

option go_package = "github.com/dramaip/dramaip-platform/services/api/bff/desktop/interface/v1;desktopbffv1";

// Contract owned by the Desktop BFF. The external HTTP adapter returns the
// same shape after it validates the desktop access token.
service DesktopBffInterfaceService {
  rpc GetCloudContext(GetCloudContextRequest) returns (GetCloudContextResponse);
}

message GetCloudContextRequest {
  string user_id = 1;
}

message GetCloudContextResponse {
  string user_id = 1;
  string plan_code = 2;
  string subscription_status = 3;
  int64 quota_tokens = 4;
  int64 used_tokens = 5;
  int64 remaining_tokens = 6;
}

syntax = "proto3";

package dramaip.bff.web.interface.v1;

option go_package = "github.com/dramaip/dramaip-platform/services/api/bff/web/interface/v1;webbffv1";

service WebBffInterfaceService {
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse);
}

message GetDashboardRequest {
  string user_id = 1;
}

message GetDashboardResponse {
  string user_id = 1;
  string email = 2;
  string subscription_status = 3;
  int64 quota_tokens = 4;
  int64 used_tokens = 5;
  int64 remaining_tokens = 6;
}

# electron-builder 配置（ROADMAP v1.0-5）—— macOS / Windows / Linux 安装包
appId: com.sdns.studio
productName: 尽意 DramaIP
afterSign: ../../scripts/notarize-mac.cjs
# 版本号从 apps/desktop/package.json 读取；GA 前必须由 v2 release gate 验证。
directories:
  output: dist
  buildResources: build
# 原生模块必须从 asar 中解包；只解包二进制，避免把依赖源码目录散落进 unpacked 产物
asarUnpack:
  - "**/*.node"
# 应用文件
files:
  - "out/**/*"
  - "package.json"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/**/*.d.ts"
  - "!**/node_modules/**/*.md"
  - "!**/node_modules/**/LICENSE*"
  - "!**/node_modules/**/*.{map,test.js,spec.js}"
extraResources:
  - from: ../../profiles
    to: profiles
    filter:
      - "*.json"
  - from: build/third-party-notices
    to: third-party-notices
  - from: build/codex
    to: codex
    filter:
      - "**/*"
  - from: build/pi
    to: pi/runtime
    filter:
      - "**/*"
  - from: ../../vendor/pi/LICENSE
    to: third-party-notices/pi/LICENSE
  - from: pi-adapter/THIRD_PARTY_NOTICES.md
    to: third-party-notices/pi/THIRD_PARTY_NOTICES.md
# .sdnspkg 项目包文件关联（双击可在应用内打开导入）
fileAssociations:
  - ext: sdnspkg
    name: 尽意 DramaIP Project Package
    description: 尽意 DramaIP 项目包
    role: Editor
# 图标（buildResources 下：icon.icns / icon.ico / icon.png，缺失则用默认）
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
win:
  icon: build/icon.ico
  target:
    - nsis
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
# Linux 与桌面正式版保持同版本号，但在发布页明确标记 Beta。
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  category: Office
  maintainer: sdns-studio
  artifactName: ${productName}-${version}-${arch}.${ext}
# 不提供源码内默认更新域名。release 环境必须注入真实 HTTPS 源；
# 缺失时 electron-builder 直接失败，候选保持 RC。
publish:
  provider: generic
  url: ${env.DRAMAIP_UPDATE_URL}
